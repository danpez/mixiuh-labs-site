'use strict';
const $=id=>document.getElementById(id), TAU=Math.PI*2, clamp=(x,a,b)=>Math.min(b,Math.max(a,x)), mix=(a,b,t)=>a+(b-a)*t, pad=n=>String(n).padStart(2,'0');
const TEAM=['Astra','Fable'], TAG=['A','F'], HEX=['#54e6b4','#ffab67'];
const fleets=$('fleets');
for(let t=0;t<2;t++){
  const key=t?'fable':'astra', team=document.createElement('article');
  team.className='fleet '+key;
  team.innerHTML='<div class="fleet-head"><div class="fleet-title"><span class="crest"><svg class="team-mark"><use href="#'+key+'-mark"/></svg></span><div><h3>'+TEAM[t]+' '+(t?'ámbar':'esmeralda')+'</h3><div class="mode" id="stats'+t+'">5 ACTIVOS · 0 CAPTURAS</div></div></div><span class="fleet-side"><svg class="icon"><use href="#strat"/></svg><span id="strategy'+t+'">Despliegue</span></span></div><div class="cells">'+Array.from({length:5},(_,i)=>'<div class="cell" id="cell'+t+i+'"><div class="battery-info"><span class="callsign">'+TAG[t]+'-'+pad(i+1)+'</span><span class="pct" id="pct'+t+i+'">100%</span></div><div class="bar"><i id="bat'+t+i+'"></i></div></div>').join('')+'</div>';
  fleets.appendChild(team);
}
// Fixed-step flight dynamics. Distances are in arena units, time in seconds.
const W=45,D=23,H=21,DT=1/60, CAP_RADIUS=7.1;
const pillars=[
  {x:-17,z:-5,r:3.6,h:10.2},{x:18,z:-7,r:4.2,h:13.2},
  {x:-8,z:10,r:2.1,h:4.5},{x:12,z:11,r:2.2,h:5.4},
  {x:-32,z:-14,r:3.5,h:9},{x:33,z:14,r:2.9,h:6.1},
  {x:2,z:-20,r:3.3,h:8.2},{x:-35,z:17,r:2.3,h:4.5}
];
const bases=[{x:-29,y:.75,z:2.7},{x:29,y:.75,z:.7}];
let drones=[],beacon,worldTime=0,roundTime=0,round=1,scores=[0,0],captures=[0,0],roundCaps=[0,0];
let order=0,phase='play',phaseTime=0,lastWinner=-1,commands=[[],[]],brainTime=0,paused=false,speed=1;
const beaconSites=[[0,0],[-14,-14],[17,4],[-18,7],[5,-10],[21,-14],[-4,12]];

 const p=beaconSites[order%beaconSites.length];order++;
 beacon={id:order,x:p[0],y:6,z:p[1],cx:p[0],cz:p[1],owner:-1,progress:0,challenger:-1,hold:0,n:[0,0],age:0};
}
function startRound(){
 roundTime=0;roundCaps=[0,0];phase='play';phaseTime=0;brainTime=0;drones=[];
 for(let t=0;t<2;t++)for(let i=0;i<5;i++){
   const a=i*TAU/5+.18, b=bases[t];
   drones.push({team:t,idx:i,x:b.x+Math.cos(a)*4.4,y:b.y+1.1+(i%2)*.48,z:b.z+Math.sin(a)*4.4,vx:(t?-1:1)*1.4,vy:2.4+i*.14,vz:0,battery:100,alive:true,dead:0,charge:false,boost:false,yaw:t?-Math.PI/2:Math.PI/2,roll:0,trail:[]});
 }
 nextBeacon();
}
function resetGame(){worldTime=0;round=1;scores=[0,0];captures=[0,0];order=0;startRound()}
function snapshot(){
 const {id,x,y,z,owner,progress}=beacon;
 return {arenaHalfW:W,arenaHalfD:D,arenaHeight:H,pillars:pillars.map(p=>({...p})),bases:bases.map(b=>({...b})),beacons:[{id,x,y,z,owner,progress}],drones:drones.map(({team,idx,x,y,z,vx,vy,vz,battery,alive})=>({team,idx,x,y,z,vx,vy,vz,battery,alive}))};
}
// Stateless controller. Each call derives the five commands from the supplied observation.
window.decideDroneSwarm=function(state,teamIndex){
 const own=state.drones.filter(d=>d.team===teamIndex),base=state.bases[teamIndex],target=state.beacons[0];
 return Array.from({length:5},(_,idx)=>{
   const d=own.find(v=>v.idx===idx);
   if(!d||!d.alive||!base)return {ax:0,ay:0,az:0,boost:false};
   const baseDist=Math.hypot(d.x-base.x,d.z-base.z),home=d.battery<25||(baseDist<6.8&&d.y<base.y+3.2&&d.battery<96);
   let tx=base.x,ty=base.y+1.2,tz=base.z;
   if(target&&!home){
     const sweep=(100-d.battery)*.21+target.id*.64+teamIndex*2.35;
     const attackers=target.owner<0?(Math.sin(sweep)>.12?4:3):(target.owner===teamIndex?3:5);
     const slot=(idx+target.id)%5,guard=slot>=attackers;

 const font=Math.max(10,Math.min(15,width*.0095));hud.font='600 '+font+'px '+fontMono;
 const w=hud.measureText(text).width+23,h=font+9,left=Math.round(x-w/2),top=Math.round(y-h);
 hud.fillStyle='rgba(16,22,25,.86)';hud.fillRect(left,top,w,h);hud.strokeStyle=focus?'#d1af6da6':'#b1b8ae46';hud.lineWidth=1;hud.strokeRect(left+.5,top+.5,w-1,h-1);
 hud.fillStyle=c;if(focus){hud.save();hud.translate(left+9,top+h*.5);hud.rotate(Math.PI/4);hud.fillRect(-2.5,-2.5,5,5);hud.restore()}else hud.fillRect(left+6,top+h*.5-2,4,4);
 hud.textBaseline='middle';hud.fillText(text,left+15,top+h*.5+.5);hud.strokeStyle=c;hud.beginPath();hud.moveTo(x,y);hud.lineTo(x,y+5);hud.stroke();
}
function drawHUD(){
 hud.clearRect(0,0,width,height);
 const b=beacon,cp=project(b.x,b.y,b.z),label=project(b.x,b.y+1.9,b.z);
 if(cp&&label&&!hiddenByRock(b.x,b.y,b.z)){
  const rad=clamp(770/cp[2],6,25),halo=hud.createRadialGradient(cp[0],cp[1],0,cp[0],cp[1],rad*2.9);
  halo.addColorStop(0,'rgba(255,218,107,.36)');halo.addColorStop(.27,'rgba(255,204,91,.19)');halo.addColorStop(1,'rgba(255,202,84,0)');
  hud.fillStyle=halo;hud.fillRect(cp[0]-rad*3,cp[1]-rad*3,rad*6,rad*6);
  drawLabel(label[0],label[1]-6,'B-'+pad(b.id),'#ffdb80',true);
 }
 for(const d of drones){
   if(d.idx!==0||!d.alive||hiddenByRock(d.x,d.y,d.z))continue;
   const p=project(d.x,d.y+.75,d.z);if(!p||label&&Math.abs(p[0]-label[0])<58&&Math.abs(p[1]-label[1])<34)continue;
   drawLabel(p[0],p[1]-6,TAG[d.team]+'-01',HEX[d.team]);
 }
}
let audioCtx=null,soundOn=false;
function chime(t){
 if(!soundOn||!audioCtx)return;const osc=audioCtx.createOscillator(),gain=audioCtx.createGain(),n=audioCtx.currentTime;
 osc.type='sine';osc.frequency.setValueAtTime(t?370:485,n);osc.frequency.exponentialRampToValueAtTime(t?550:710,n+.12);gain.gain.setValueAtTime(.0001,n);gain.gain.exponentialRampToValueAtTime(.065,n+.025);gain.gain.exponentialRampToValueAtTime(.0001,n+.32);osc.connect(gain);gain.connect(audioCtx.destination);osc.start(n);osc.stop(n+.34);
}
$('sound').onclick=async()=>{
 if(!audioCtx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;audioCtx=new AC()}
 if(audioCtx.state==='suspended')await audioCtx.resume();soundOn=!soundOn;
 $('sound').querySelector('use').setAttribute('href',soundOn?'#sound-on':'#sound-off');setButton('sound',soundOn?'Silenciar sonido':'Activar sonido');$('sound').setAttribute('aria-pressed',String(soundOn));if(soundOn)chime(0);
};
function setButton(id,label){$(id).setAttribute('aria-label',label);$(id).title=label}
$('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else if(document.documentElement.webkitRequestFullscreen)document.documentElement.webkitRequestFullscreen()}catch{}};
document.addEventListener('fullscreenchange',()=>setButton('full',document.fullscreenElement?'Salir de pantalla completa':'Pantalla completa'));
function togglePause(){paused=!paused;$('pause').querySelector('use').setAttribute('href',paused?'#play':'#ico-pause');setButton('pause',paused?'Reanudar':'Pausar');$('running').textContent=paused?'EN PAUSA':'EN CURSO';$('simDot').style.background=paused?'#ffd476':''}
$('pause').onclick=togglePause;
$('speed').onclick=()=>{speed=speed===1?2:speed===2?.5:1;$('speed').textContent=(speed===.5?'0,5':speed)+'×'};
$('reset').onclick=()=>{if(paused)togglePause();resetGame();updateUI()};
const menu=$('camMenu');
function openMenu(open){menu.hidden=!open;$('camButton').setAttribute('aria-expanded',String(open))}
$('camButton').onclick=()=>openMenu(menu.hidden);
for(const btn of menu.children)btn.onclick=()=>{mode=Number(btn.dataset.cam);dragPitch=0;zoom=1;$('camText').textContent=btn.textContent;for(const item of menu.children)item.setAttribute('aria-pressed',String(item===btn));openMenu(false)};
document.addEventListener('pointerdown',e=>{if(!e.target.closest('.camera-wrap'))openMenu(false)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')openMenu(false);if(e.code==='Space'&&e.target===document.body){e.preventDefault();togglePause()}});
canvas.addEventListener('pointerdown',e=>{drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(!drag)return;dragAngle-=(e.clientX-drag[0])*.005;dragPitch=clamp(dragPitch+(e.clientY-drag[1])*.004,-.18,.86);drag=[e.clientX,e.clientY]});
canvas.addEventListener('lostpointercapture',()=>drag=null);
canvas.addEventListener('pointerup',()=>drag=null);
canvas.addEventListener('wheel',e=>{if(!e.ctrlKey&&!e.metaKey)return;e.preventDefault();zoom=clamp(zoom*Math.exp(e.deltaY*.004),.65,1.4)},{passive:false});
function updateUI(){
 const s=Math.floor(roundTime),b=beacon;$('timer').textContent=pad(Math.floor(s/60))+':'+pad(s%60);$('round').textContent='RONDA '+pad(round);
 document.querySelectorAll('.round-dots i').forEach((el,i)=>el.classList.toggle('on',i<round));
 $('beaconName').textContent=phase==='play'?'BALIZA '+pad(b.id):phase==='match'?'FIN DE PARTIDA':'FIN DE RONDA';
 $('beaconStatus').textContent=phase!=='play'?TEAM[lastWinner]+' gana':b.owner>=0?'Control de '+TEAM[b.owner]:b.progress>.04?'Captura de '+TEAM[b.challenger]:b.n[0]&&b.n[1]?'En disputa':'En aproximación';
 const c=$('capBar');c.style.width=(b.owner>=0?100:b.progress*100)+'%';c.style.background=b.owner>=0?HEX[b.owner]:HEX[b.challenger]||'#ffd476';
 const active=[0,0],charging=[0,0];
 for(const d of drones){const id=''+d.team+d.idx,p=Math.ceil(d.battery);active[d.team]+=Number(d.alive);charging[d.team]+=Number(d.charge&&d.battery<95);
 $('pct'+id).textContent=p+'%';$('bat'+id).style.width=p+'%';$('cell'+id).classList.toggle('low',p<25);$('cell'+id).classList.toggle('disabled',!d.alive)}
 for(let t=0;t<2;t++){$('score'+t).textContent=scores[t];$('stats'+t).textContent=active[t]+' ACTIVOS · '+roundCaps[t]+(roundCaps[t]===1?' CAPTURA':' CAPTURAS');
 $('strategy'+t).textContent=phase!=='play'?'En espera':charging[t]?'Recarga':b.owner===t?'Defensa':b.n[t]?'Captura':roundTime<2?'Despliegue':'Aproximación'}
 $('online').textContent=(active[0]+active[1])+' drones en línea';
}
let prev=performance.now(),accumulator=0,nextUI=0;
function frame(now){
 const elapsed=clamp((now-prev)/1000,0,.15);prev=now;
 if(!paused){accumulator+=elapsed*speed;while(accumulator>=DT){step(DT);if(phase==='play')sampleTrails(DT);accumulator-=DT}}
 camera(elapsed);render();if(now>=nextUI){updateUI();nextUI=now+150}
 requestAnimationFrame(frame);
}
window.addEventListener('resize',resize);new ResizeObserver(resize).observe(scene);
document.addEventListener('visibilitychange',()=>{prev=performance.now();accumulator=0});
resize();camera(1,true);readAI();updateUI();render();requestAnimationFrame(frame);
</script>
