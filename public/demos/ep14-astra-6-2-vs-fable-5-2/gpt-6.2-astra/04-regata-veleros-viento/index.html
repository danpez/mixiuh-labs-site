<script>
'use strict';
/* Angles use screen coordinates, clockwise from +x. Wind points downwind.
   Positions and vx/vy use chart units and chart units/s. Speeds use knots.
   targetMark: 0 = windward buoy, 1 = finish, 2 = finished. Trim: 0 tight, 1 eased. */
const PI=Math.PI, TAU=PI*2, RAD=PI/180, KT=.514444, SCALE=2.65;
const W=1060,H=680,BUOY={x:530,y:108},START={x:530,y:562},GATE=230;
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n)), wrap=a=>Math.atan2(Math.sin(a),Math.cos(a));
const $=id=>document.getElementById(id);
const colours=['#43e8aa','#ffab55'];
const teams=['Astra','Fable'];
const dict={
 es:{series:'Arena IA vs IA',challenge:'RETO 04 / 06',title:'Regata de barlovento',map:'Vista táctica',northwind:'Viento N',gusts:'Rachas',shadow:'Sombra de viento',wakes:'Estelas',telemetry:'Telemetría',polar:'Polar de velocidad',winner:'GANADOR DE LA MANGA',active:'Simulación activa',paused:'En pausa',heat:'Manga',pause:'Pausar',play:'Continuar',reset:'Reiniciar manga',full:'Pantalla completa',progress:'PROGRESO',speed:'Velocidad',tacks:'Viradas',mark:'BARLOVENTO',line:'SALIDA / META',noGo:'ZONA MUERTA',vmg:'Velocidad hacia la marca',ocean:'Campo de regata con dos catamaranes autónomos',diagram:'Polar de velocidad y ángulo al viento instantáneo'},
 en:{series:'AI vs AI Arena',challenge:'CHALLENGE 04 / 06',title:'Windward regatta',map:'Tactical view',northwind:'Wind N',gusts:'Gusts',shadow:'Wind shadow',wakes:'Wakes',telemetry:'Telemetry',polar:'Speed polar',winner:'HEAT WINNER',active:'Simulation active',paused:'Paused',heat:'Heat',pause:'Pause',play:'Resume',reset:'Restart heat',full:'Full screen',progress:'PROGRESS',speed:'Speed',tacks:'Tacks',mark:'WINDWARD',line:'START / FINISH',noGo:'NO-GO ZONE',vmg:'Velocity made good to mark',ocean:'Racecourse with two autonomous catamarans',diagram:'Speed polar and current angle to the wind'}
};
let lang='es',heat=1,raceTime=0,elapsed=0,clockTicks=0,paused=false,finished=-1,finishHold=0,peak=0,boats=[],windAngle=PI/2,windKt=16;
const tr=k=>dict[lang][k];
const panels=teams.map((name,i)=>{
 const card=document.createElement('article');card.className='boatcard'+(i?' amber':'');
 card.innerHTML='<div class="teamrow"><div class="boatname"><svg class="teamicon"><use href="#sail"/></svg><h3>'+name+' <span>'+(i?'Ámbar':'Esmeralda')+'</span></h3></div><span class="place"></span></div><div class="progressrow"><span class="smallcap" data-i="progress"></span><span class="pct"></span></div><div class="track"><div class="fill"></div></div><div class="stats"><div class="stat"><span class="statlabel" data-i="speed"></span><strong></strong><span class="unit">kn</span></div><div class="stat"><span class="statlabel">VMG</span><strong></strong><span class="unit">kn</span></div><div class="stat"><span class="statlabel" data-i="tacks"></span><strong></strong></div></div>';
 $('crews').append(card);return {rank:card.querySelector('.place'),pct:card.querySelector('.pct'),fill:card.querySelector('.fill'),stats:card.querySelectorAll('strong'),vmg:card.querySelectorAll('.statlabel')[1]};
});
function setLabels(){
 document.documentElement.lang=lang;document.title='Regata Lab · '+tr('title');
 document.querySelectorAll('[data-i]').forEach(el=>el.textContent=tr(el.dataset.i));
 $('liveText').textContent=tr(paused?'paused':'active');$('langCode').textContent=lang.toUpperCase();
 $('lang').title=$('lang').ariaLabel=lang==='es'?'Switch to English':'Cambiar a español';
 for(const [id,key] of [['pauseBtn',paused?'play':'pause'],['resetBtn','reset'],['fullBtn','full']]){$(id).title=$(id).ariaLabel=tr(key)}
 $('pauseIcon').setAttribute('href',paused?'#play':'#pause');document.body.classList.toggle('paused',paused);
 $('ocean').ariaLabel=tr('ocean');$('polar').ariaLabel=tr('diagram');panels.forEach(p=>p.vmg.title=tr('vmg'));updateHUD();
}
/* A stateless helm. Tack selection uses the current bow, a sailing corridor
   and the buoy laylines; replacing the public hook changes both live helms. */
function decideSailboatAction(state,sideIndex){
 const b=state.boats[sideIndex],up=wrap(state.windAngleRad+PI);
 const finish=b.targetMark!==0,tx=finish?state.startX+(sideIndex?.062:-.062)*state.width:state.buoyX,ty=finish?state.startY+15:state.buoyY;
 const bearing=Math.atan2(ty-b.y,tx-b.x),d=wrap(bearing-up),close=(sideIndex?48:46)*RAD;
 let heading=bearing;
 if(!finish){
  const dx=b.x-state.buoyX,halfWidth=state.width*(sideIndex?.192:.172);
  let tack=wrap(b.headingRad-up)>=0?1:-1;
  if(Math.abs(d)>close+1.5*RAD){heading=bearing}
  else{
   if(dx>halfWidth)tack=-1;else if(dx< -halfWidth)tack=1;
   heading=up+tack*close;
  }
 }
 const angle=Math.abs(wrap(heading-up));
 return {targetHeadingRad:wrap(heading),sailTrim:clamp((angle/RAD-39)/141,0,1)};
}
window.decideSailboatAction=decideSailboatAction;
window.__auditRegatta=()=>({progress:boats.map(b=>b.progress),tacks:boats.map(b=>b.tacks),maxBoatSpeedKt:peak,aiHookReady:typeof window.decideSailboatAction==='function'});
function resetRace(){
 raceTime=0;finished=-1;finishHold=0;peak=0;clockTicks=0;$('result').hidden=true;
 boats=teams.map((_,i)=>{
  const h=-PI/2+(i?48:-46)*RAD,x=START.x+(i?73:-73),y=START.y;
  const speed=(i?7.15:7.35)*KT,b={x,y,u:Math.cos(h)*speed,v:Math.sin(h)*speed,headingRad:h,speedKt:speed/KT,sailTrim:.08,targetMark:0,progress:0,tacks:0,tackSign:i?1:-1,trail:[],shadow:0,wind:16,windDir:PI/2,vmg:0};
  for(let k=38;k>=0;k--)b.trail.push({x:x-b.u*SCALE*k*.13,y:y-b.v*SCALE*k*.13,h,t:-k*.13});return b;
 });peak=Math.max(...boats.map(b=>b.speedKt));updateHUD();
}
function stateView(){return {windAngleRad:windAngle,windSpeedKt:windKt,buoyX:BUOY.x,buoyY:BUOY.y,startX:START.x,startY:START.y,width:W,height:H,boats:boats.map(b=>({x:b.x,y:b.y,vx:b.u*SCALE,vy:b.v*SCALE,headingRad:b.headingRad,speedKt:b.speedKt,targetMark:b.targetMark,progress:b.progress}))}}
function air(x,y,t){
 const field=.5+.5*Math.sin(x/117+.83*Math.sin(y/138-t*.18))*Math.cos(y/153-t*.26+x/430);
 return {dir:windAngle+.052*Math.sin(x/183+y/159-t*.16),kt:windKt*(.83+.32*field),gust:field};

 path(g,[0,-r*.75,-r*.29,r*.44,0,r*.17],'#6ce7c4');path(g,[0,-r*.75,r*.29,r*.44,0,r*.17],'#d8efe8');g.restore();
 const x=17,y=sh-15,len=20*SCALE*worldScale;g.strokeStyle='#adc8c7';g.lineWidth=1;g.beginPath();g.moveTo(x,y-4);g.lineTo(x,y);g.lineTo(x+len,y);g.lineTo(x+len,y-4);g.stroke();g.font='10px '+fonts;g.fillStyle='#c6d8d6';g.fillText('20 m',x,y-8);
}
/* Solve steady longitudinal force for each angle using the same sail and
   hull model as the race. Each boat's curve uses its local, shadowed wind. */
function polarSpeed(angle,wind){
 if(angle<40*RAD)return 0;
 const trim=clamp((angle/RAD-39)/141,0,1),sheet=(7+77*trim)*RAD;
 const axial=wind*KT*Math.cos(angle),cross=wind*KT*Math.sin(angle);let lo=0,hi=wind*KT*2.2;
 for(let n=0;n<12;n++){const mid=(lo+hi)/2,ap=Math.atan2(cross,axial+mid);
 const f=sailForce(Math.hypot(cross,axial+mid),ap,sheet)[0]-23*mid*mid-16*mid;
 if(f>0)lo=mid;else hi=mid}
 return (lo+hi)*.5/KT;
}
let polarCurves=[[],[]],lastPolar=-100;
function drawPolar(){
 const g=pc;g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,pw,ph);
 const r=Math.max(21,Math.min(pw*.35,(ph-29)*.5)),cx=pw*.5,cy=ph*.5+1;
 const scaleMax=24,fs=clamp(pw*.027,9,14);g.save();g.translate(cx,cy);g.font=fs+'px '+fonts;g.textAlign='center';g.textBaseline='middle';
 g.beginPath();g.moveTo(0,0);g.arc(0,0,r,-PI/2-40*RAD,-PI/2+40*RAD);g.closePath();g.fillStyle='#57513b42';g.fill();
 for(const d of [-40,40])path(g,[0,0,Math.sin(d*RAD)*r,-Math.cos(d*RAD)*r],null,'#9c865971',.9);
 for(let k=1;k<=4;k++)circle(g,0,0,r*k/4,null,k===4?'#476069':'#34474f',.85);
 for(let k=0;k<12;k++){const a=k*PI/6;g.setLineDash(k%3?[2,4]:[]);path(g,[0,0,Math.sin(a)*r,-Math.cos(a)*r],null,'#34464d',.8)}g.setLineDash([]);
 g.fillStyle='#afc0c7';g.fillText('0°',0,-r-8);g.fillText('90°',r+17,0);g.fillText('90°',-r-17,0);g.fillText('180°',0,r+9);
 g.fillStyle='#b5a27c';g.font='600 '+clamp(fs*.83,8,12)+'px '+fonts;g.fillText(tr('noGo'),0,-r*.70);
 g.font=(fs*.9)+'px '+fonts;g.fillStyle='#90a6b1';g.fillText('12',r*.5-2,8);g.fillText('24',r-3,8);
 if(Math.abs(raceTime-lastPolar)>.28||!polarCurves[0].length){lastPolar=raceTime;polarCurves=boats.map(b=>Array.from({length:181},(_,i)=>polarSpeed(Math.abs(i-90)*2*RAD,b.wind)))}
 boats.forEach((b,i)=>{
  const vals=polarCurves[i];g.beginPath();vals.forEach((v,j)=>{const a=(j-90)*2*RAD,rr=v/scaleMax*r,x=Math.sin(a)*rr,y=-Math.cos(a)*rr;if(!j)g.moveTo(x,y);else g.lineTo(x,y)});g.closePath();
  g.fillStyle=colours[i]+(i?'08':'11');g.fill();g.strokeStyle=colours[i];g.setLineDash(i?[4,3]:[]);g.lineWidth=i?1.4:2;g.stroke();g.setLineDash([]);
 });
 boats.forEach((b,i)=>{const a=wrap(b.headingRad-b.windDir-PI),rr=clamp(b.speedKt/scaleMax,0,1.04)*r,x=Math.sin(a)*rr,y=-Math.cos(a)*rr;
 path(g,[0,0,x,y],null,colours[i]+'a6',1.1);circle(g,x,y,4.4,colours[i],'#112029',1.5)});circle(g,0,0,2.1,'#c9d7da');g.restore();
}
function render(){if(!sw||!boats.length)return;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.drawImage(cache,0,0,sw,sh);surface();ctx.save();ctx.translate(offsetX,offsetY);ctx.scale(worldScale,worldScale);course();renderBoats();ctx.restore();instruments();drawPolar()}
resetRace();setLabels();resize();
let resizeTimer=0;new ResizeObserver(()=>{cancelAnimationFrame(resizeTimer);resizeTimer=requestAnimationFrame(()=>{const a=ocean.getBoundingClientRect(),b=chart.getBoundingClientRect();if(Math.abs(a.width-sw)>.4||Math.abs(a.height-sh)>.4||Math.abs(b.height-ph)>.4||Math.abs(b.width-pw)>.4)resize()})}).observe(document.querySelector('.dashboard'));
window.addEventListener('resize',()=>{clearTimeout(window.regattaResizeTimer);window.regattaResizeTimer=setTimeout(resize,90)});
const STEP=1/60;let previous=performance.now(),accumulator=0,hudTime=0;
function frame(now){
 const delta=Math.min(.12,Math.max(0,(now-previous)/1000));previous=now;
 if(!paused){accumulator+=delta;let advanced=false;while(accumulator+1e-8>=STEP){physics(STEP);accumulator-=STEP;advanced=true}
  if(advanced){hudTime+=delta;if(hudTime>=.105){updateHUD();hudTime=0}render()}}
 requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange',()=>{previous=performance.now();accumulator=0});requestAnimationFrame(frame);
</script>
