<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>ARENA IA VS IA · GRÚA DE 40 TONELADAS EN OLEAJE</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1920px; height: 1080px; overflow: hidden;
    background: #060A12; color: #F8FAFC;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    height: 76px; background: #0B1120; border-bottom: 2px solid #1E293B;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 28px;
  }
  .side-pill {
    display: flex; align-items: center; gap: 14px;
    padding: 8px 20px; border-radius: 12px; font-weight: 800; font-size: 22px;
  }
  .side-h4 { background: rgba(56,189,248,0.14); border: 2px solid #38BDF8; color: #38BDF8; }
  .side-fl { background: rgba(251,191,36,0.14); border: 2px solid #FBBF24; color: #FBBF24; }
  .score-box {
    font-size: 32px; font-weight: 900; color: #FFFFFF;
    padding: 2px 14px; border-radius: 8px; background: rgba(15,23,42,0.9);
  }
  .center-title { text-align: center; }
  .center-title h1 { font-size: 22px; font-weight: 900; letter-spacing: 1.5px; color: #F8FAFC; }
  .center-title p { font-size: 13px; font-weight: 700; color: #94A3B8; letter-spacing: 1px; margin-top: 2px; }
  .split {
    flex: 1; display: grid; grid-template-columns: 1fr 1fr; width: 1920px; height: 1004px; position: relative;
  }
  .pane {
    width: 960px; height: 1004px; overflow: hidden; position: relative;
    border-right: 3px solid #1E293B;
  }
  .pane iframe {
    width: 1920px; height: 1080px; border: 0;
    transform: scale(0.5, 0.9296); transform-origin: top left;
    pointer-events: none;
  }
</style>
</head>
<body>
  <header>
    <div class="side-pill side-h4">
      <span>GEMINI 4 HYDROGEN (EXTRA)</span>
      <span class="score-box" id="scoreH4">0</span>
    </div>
    <div class="center-title">
      <h1>ARENA IA VS IA · GRÚA DE 40 TONELADAS EN OLEAJE</h1>
      <p>DOBLE TIRÓN (4° ORDEN HYDROGEN) VS AMORTIGUACIÓN PD (FLASH 3.8)</p>
    </div>
    <div class="side-pill side-fl">
      <span class="score-box" id="scoreFL">0</span>
      <span>GEMINI 3.8 FLASH (HIGH)</span>
    </div>
  </header>
  <div class="split">
    <div class="pane"><iframe id="fH4" src="wing_hydrogen.html"></iframe></div>
    <div class="pane"><iframe id="fFL" src="wing_flash.html"></iframe></div>
  </div>
<script>
  const fH4 = document.getElementById('fH4');
  const fFL = document.getElementById('fFL');

  const origStep = window.__stepVirtual;
  window.__stepVirtual = async function(dtMs = 16.6667) {
    if (origStep) await origStep(dtMs);
    try {
      if (fH4.contentWindow && fH4.contentWindow.__stepVirtual) await fH4.contentWindow.__stepVirtual(dtMs);
      if (fFL.contentWindow && fFL.contentWindow.__stepVirtual) await fFL.contentWindow.__stepVirtual(dtMs);
    } catch (e) {}
    updateScores();
  };

  function getWingAudit(iframe) {
    try {
      const w = iframe.contentWindow;
      if (w && typeof w.__auditCrane === 'function') return w.__auditCrane();
    } catch (e) {}
    return {};
  }

  function updateScores() {
    const aH4 = getWingAudit(fH4);
    const aFL = getWingAudit(fFL);
    
        document.getElementById('scoreH4').textContent = (aH4.containersDelivered ?? 0) + ' CONT · ' + Number(aH4.maxSwayDeg || 0).toFixed(1) + '°';
        document.getElementById('scoreFL').textContent = (aFL.containersDelivered ?? 0) + ' CONT · ' + Number(aFL.maxSwayDeg || 0).toFixed(1) + '°';
        
  }
  setInterval(updateScores, 120);

  window.__auditCrane = function() {
    const aH4 = getWingAudit(fH4);
    const aFL = getWingAudit(fFL);
    return { hydrogen: aH4, flash: aFL, aiHookReady: true };
  };
  window.__ARENA_SUMMARY__ = window.__auditCrane;
</script>
</body>
</html>
