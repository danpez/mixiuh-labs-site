<!DOCTYPE html>
<html lang="es">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Tanquecitos Carambola | Arena de Madera con Balas de Rebote</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden}
body{
  background:
    radial-gradient(circle at 20% 30%,rgba(255,255,255,.55) 0 5px,transparent 6px) 0 0/86px 86px,
    radial-gradient(circle at 70% 60%,rgba(255,255,255,.35) 0 3px,transparent 4px) 0 0/58px 58px,
    linear-gradient(160deg,#6fd6ff 0%,#9df0d2 52%,#ffe48f 100%);
  font-family:"Trebuchet MS","Avenir Next","Segoe UI",system-ui,sans-serif;color:#23365e;
  user-select:none;-webkit-user-select:none;touch-action:none}
#game{position:fixed;left:0;top:0;width:100vw;height:100vh;display:block;cursor:crosshair}
#hud{position:fixed;top:0;left:0;right:0;display:flex;align-items:stretch;justify-content:center;gap:8px;padding:8px 10px 0;pointer-events:none;flex-wrap:wrap;z-index:2}
.panel{pointer-events:auto;background:rgba(255,255,255,.92);border:3px solid #fff;border-radius:16px;box-shadow:0 4px 0 rgba(40,110,160,.28),0 10px 22px rgba(40,110,160,.18)}
#logo{display:flex;align-items:center;gap:8px;padding:4px 12px}
#logo .t1{font-weight:900;font-size:18px;letter-spacing:1px;line-height:1;color:#ff8a1f;text-shadow:0 2px 0 #c9560b}
#logo .t2{font-weight:900;font-size:12px;letter-spacing:3px;color:#2f7dff;line-height:1.2}
#cards{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.card{display:flex;align-items:center;gap:6px;padding:4px 8px;border-color:var(--c);min-width:162px;transition:transform .2s,opacity .25s,filter .25s}
.card.dead{opacity:.55;filter:grayscale(.8)}
.card.win{transform:translateY(-2px) scale(1.05)}
.cname{font-weight:900;font-size:13px;color:var(--d);letter-spacing:1px;white-space:nowrap}
.cname em{font-style:normal;font-size:9px;background:var(--c);color:#fff;border-radius:6px;padding:1px 5px;margin-left:3px;vertical-align:2px}
.cstat{font-size:10px;font-weight:800;color:#5a6b8c;letter-spacing:1px;white-space:nowrap}
.cnum{display:flex;gap:5px;margin-left:auto}
.cnum div{display:flex;flex-direction:column;align-items:center;background:#eef5ff;border-radius:8px;padding:2px 6px;min-width:36px}
.cnum small{font-size:8px;font-weight:800;color:#7b8bb0;letter-spacing:.5px}
.cnum b{font-size:16px;line-height:1;color:var(--d)}
#stats{display:flex;gap:2px;padding:4px 6px;align-items:center}
.stat{display:flex;flex-direction:column;align-items:center;padding:0 7px}
.stat small{font-size:9px;font-weight:800;color:#7b8bb0;letter-spacing:1px;white-space:nowrap}
.stat b{font-size:17px;line-height:1.1;color:#23365e;white-space:nowrap}
#bar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;align-items:center;gap:8px;padding:0 10px 8px;flex-wrap:wrap;z-index:2;pointer-events:none}
.btn{pointer-events:auto;display:flex;align-items:center;gap:7px;font-family:inherit;font-weight:800;font-size:12px;line-height:1;letter-spacing:.3px;color:#fff;border:3px solid #fff;border-radius:14px;padding:8px 12px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.16),0 8px 16px rgba(40,110,160,.2);transition:transform .08s,filter .15s}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.btn svg{width:18px;height:18px;flex:none}
#bLaser{background:linear-gradient(#36c6ff,#1f8fe6)}
#bLaser.on{background:linear-gradient(#ff6ad5,#d61f9e)}
#bCrates{background:linear-gradient(#ffd24a,#f39200);color:#5a3200}
#bReset{background:linear-gradient(#ff7676,#e0303f)}
#bPilot{background:linear-gradient(#86e163,#2fa13a)}
#bPilot.off{background:linear-gradient(#a3b0cf,#6c7aa0)}
.hint{pointer-events:auto;font-size:11px;font-weight:800;color:#2b4a7a;background:rgba(255,255,255,.8);border-radius:10px;padding:7px 10px}
#banner{position:fixed;left:50%;top:46%;transform:translate(-50%,-50%) scale(.6);font-weight:900;font-size:clamp(26px,5.5vw,62px);letter-spacing:3px;color:#fff;text-shadow:0 5px 0 var(--bc,#1f8fe6),0 10px 26px rgba(0,40,90,.3);pointer-events:none;opacity:0;transition:opacity .25s,transform .35s cubic-bezier(.2,1.6,.4,1);z-index:3;white-space:nowrap}
#banner.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#feed{position:fixed;right:12px;top:90px;display:flex;flex-direction:column;gap:4px;align-items:flex-end;pointer-events:none;z-index:2}
.fe{background:rgba(255,255,255,.94);border-radius:10px;padding:4px 9px;font-size:12px;font-weight:800;color:#33456e;box-shadow:0 3px 0 rgba(40,110,160,.2);transition:opacity .5s,transform .5s}
.fe.out{opacity:0;transform:translateX(20px)}
</style>

<body>
<canvas id="game"></canvas>

<div id="hud">
  <div id="logo" class="panel">
    <svg width="34" height="30" viewBox="0 0 40 34">
      <rect x="2" y="4" width="30" height="7" rx="3.5" fill="#4a4f6e"/>
      <rect x="2" y="23" width="30" height="7" rx="3.5" fill="#4a4f6e"/>
      <rect x="4" y="9" width="26" height="16" rx="5" fill="#ff8a1f"/>
      <circle cx="16" cy="17" r="6.5" fill="#ffc98a" stroke="#c9560b" stroke-width="2"/>

<div id="bar">
  <button id="bLaser" class="btn" title="Tecla L">

    <svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="14" rx="2.5" fill="#fff4c9" stroke="#8a4a00" stroke-width="2"/><rect x="6.5" y="3" width="3" height="9" rx="1.5" fill="#ff3b4a"/><rect x="10.5" y="3" width="3" height="9" rx="1.5" fill="#ff3b4a"/><rect x="14.5" y="3" width="3" height="9" rx="1.5" fill="#ff3b4a"/></svg>

    <span>Reiniciar Batalla</span>

    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><rect x="4" y="7" width="16" height="12" rx="3" fill="rgba(255,255,255,.25)"/><circle cx="9" cy="13" r="1.8" fill="#fff"/><circle cx="15" cy="13" r="1.8" fill="#fff"/><path d="M12 3v4M2 12v3M22 12v3"/></svg>
    <span id="pilotTxt">Piloto IA: ACTIVO</span>
  </button>
  <div class="hint">WASD / Flechas: mover &nbsp;|&nbsp; Raton: apuntar &nbsp;|&nbsp; Clic: disparar &nbsp;|&nbsp; Espacio o Clic der.: mina</div>
</div>

<script>
(function(){
'use strict';

/* =====================================================================
   CONSTANTES DEL MUNDO
   ===================================================================== */
const COLS=22, ROWS=14, T=40, W=COLS*T, H=ROWS*T, FR=22, LIFT=12, FM=26;
const TANK_R=13, BULLET_R=4, BARREL=24, BSPEED=250, TANK_SPEED=92, TURN_SPEED=4.4;
const MAXB=5, MAXM=2, COOLDOWN=0.3, MINE_FUSE=9, BLAST_R=60, TANK_LIFT=3, MAX_BOUNCES=2;
const EMPTY=0, WOOD=1, CORK=2, PIT=3;
const TAU=Math.PI*2;
const STEER=[0,.35,-.35,.7,-.7,1.05,-1.05,1.4,-1.4,1.9,-1.9,2.5,-2.5];

/* Cuadrante superior-izquierdo (11x7) espejado en X e Y => arena simetrica justa.
   '.' piso  '#' bloque de madera (indestructible, rebota)  'c' corcho/ladrillo (destructible)  'w' charco/foso */
const LAYOUTS=[
  {name:'Trincheras', q:["...........","...........","...##...c..","...#....c..",".....cc....","..c....###.","..c..ww...."]},
  {name:'Cruz de Corcho', q:["...........","......#....","..c...#....","..c...#..cc","..c........",".....##c...","ww...#....."]},
  {name:'Islas', q:["...........","...........","..#c#..ww..","...........","..c..#..c..","..#..#.....",".....cc..#."]},
  {name:'Laberinto', q:["...........","....c......",".##.c..###.","...........",".c...##...w","..#..#..c.w","..#.......w"]}
];

const TANK_DEFS=[
  {name:'AZUL',   color:'#2f7dff', light:'#9cc7ff', dark:'#1b4fc0', spawn:[1,12],  a:-Math.PI/4},
  {name:'MORADO', color:'#9b4dff', light:'#d2aaff', dark:'#6326c2', spawn:[1,1],   a:Math.PI/4},
  {name:'NARANJA',color:'#ff8a1f', light:'#ffc98a', dark:'#c9560b', spawn:[20,12], a:-3*Math.PI/4},
  {name:'ROJO',   color:'#ff3b4a', light:'#ffa3aa', dark:'#bd1a2c', spawn:[20,1],  a:3*Math.PI/4}
];

/* Personalidades del cerebro (misma IA, distintos parametros) */
const PERS=[
  {label:'Equilibrado',  rays:100, bouncePenalty:110,  aimError:0.010, turretSpeed:4.8, mineRate:0.30, holdDist:230, fireDelay:0.36, verifyR:13, intercept:true},
  {label:'Carambolista', rays:150, bouncePenalty:-180, aimError:0.006, turretSpeed:4.2, mineRate:0.20, holdDist:300, fireDelay:0.42, verifyR:12, intercept:false},
  {label:'Minero',       rays:80,  bouncePenalty:150,  aimError:0.015, turretSpeed:4.4, mineRate:0.85, holdDist:150, fireDelay:0.46, verifyR:14, intercept:false},
  {label:'Artillero',    rays:110, bouncePenalty:80,   aimError:0.012, turretSpeed:6.0, mineRate:0.25, holdDist:220, fireDelay:0.28, verifyR:15, intercept:true}
];

/* =====================================================================
   UTILIDADES
   ===================================================================== */
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function angDiff(a,b){let d=(a-b)%TAU; if(d>Math.PI)d-=TAU; else if(d<-Math.PI)d+=TAU; return d;}
function wrapA(a){return Math.atan2(Math.sin(a),Math.cos(a));}
function rotateToward(cur,tgt,step){const d=angDiff(tgt,cur); if(Math.abs(d)<=step)return tgt; return cur+Math.sign(d)*step;}
function rnd(a,b){return a+Math.random()*(b-a);}
function pick(arr){return arr[(Math.random()*arr.length)|0];}
function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
function rr(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);c.lineTo(x+w,y+h-r);c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);c.lineTo(x+r,y+h);c.quadraticCurveTo(x,y+h,x,y+h-r);c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);c.closePath();}

function tileAt(g,c,r){ if(c<0||r<0||c>=COLS||r>=ROWS) return WOOD; return g[r*COLS+c]; }
function bulletSolid(t){ return t===WOOD||t===CORK; }
function tankSolid(t){ return t!==EMPTY; }

function tankFree(g,x,y,rad){
  rad=rad||TANK_R;
  if(x<rad||y<rad||x>W-rad||y>H-rad) return false;
  const c0=Math.floor((x-rad)/T), c1=Math.floor((x+rad)/T), r0=Math.floor((y-rad)/T), r1=Math.floor((y+rad)/T);
  for(let r=r0;r<=r1;r++) for(let c=c0;c<=c1;c++){
    if(!tankSolid(tileAt(g,c,r))) continue;
    const nx=clamp(x,c*T,c*T+T), ny=clamp(y,r*T,r*T+T);
    const dx=x-nx, dy=y-ny;
    if(dx*dx+dy*dy<rad*rad) return false;
  }
  return true;
}
function clearFat(g,x0,y0,x1,y1){
  const d=Math.hypot(x1-x0,y1-y0), n=Math.max(1,Math.ceil(d/8));
  for(let i=1;i<=n;i++){ const k=i/n; if(!tankFree(g,x0+(x1-x0)*k,y0+(y1-y0)*k,TANK_R+1)) return false; }
  return true;
}
function segPointDist(sg,px,py){
  const sx=sg.x2-sg.x1, sy=sg.y2-sg.y1, L2=sx*sx+sy*sy;
  let t=L2>0?((px-sg.x1)*sx+(py-sg.y1)*sy)/L2:0; t=clamp(t,0,1);
  return Math.hypot(px-(sg.x1+sx*t),py-(sg.y1+sy*t));
}

/* =====================================================================
   RAYCAST DE BILLAR (DDA sobre la rejilla + reflexion R = D - 2(D.N)N)
   Sirve tanto para mover las balas reales como para que la IA "piense".
   ===================================================================== */
function castPath(g,x,y,dx,dy,bouncesLeft,maxLen,tanks,hitR,speed,ignoreId){
  const segs=[]; let len=0, bounces=0;
  let c=Math.floor(x/T), r=Math.floor(y/T);
  if(bulletSolid(tileAt(g,c,r))) return {segs,end:'blocked',x,y,dx,dy,bounces,len,tank:null,cell:null};
  for(let it=0; it<12; it++){
    const stepX=dx>0?1:-1, stepY=dy>0?1:-1;
    const tdx=dx!==0?Math.abs(T/dx):1e9, tdy=dy!==0?Math.abs(T/dy):1e9;
    let tmx=dx>0?((c+1)*T-x)/dx:(dx<0?(c*T-x)/dx:1e9);
    let tmy=dy>0?((r+1)*T-y)/dy:(dy<0?(r*T-y)/dy:1e9);
    if(tmx<0)tmx=0; if(tmy<0)tmy=0;
    const remain=maxLen-len;
    let tWall=-1,nx=0,ny=0,wc=0,wr=0,wt=0,cc=c,rc=r;
    for(let k=0;k<220;k++){
      let t,isX;
      if(tmx<=tmy){t=tmx;isX=true;}else{t=tmy;isX=false;}
      if(t>remain) break;
      const nc=isX?cc+stepX:cc, nr=isX?rc:rc+stepY;
      const tt=tileAt(g,nc,nr);
      if(bulletSolid(tt)){ tWall=t; if(isX)nx=-stepX; else ny=-stepY; wc=nc; wr=nr; wt=tt; break; }
      cc=nc; rc=nr; if(isX)tmx+=tdx; else tmy+=tdy;
    }
    const segLen=tWall>=0?tWall:remain;
    if(tanks){
      let bt=null, bestT=segLen;
      for(let i=0;i<tanks.length;i++){
        const tk=tanks[i];
        if(!tk.alive||tk.id===ignoreId) continue;
        let fx=x-tk.x, fy=y-tk.y, ex=dx, ey=dy;
        if(speed){ const t0=len/speed; fx-=(tk.vx||0)*t0; fy-=(tk.vy||0)*t0; ex-=(tk.vx||0)/speed; ey-=(tk.vy||0)/speed; }
        const a=ex*ex+ey*ey, b=fx*ex+fy*ey, cq=fx*fx+fy*fy-hitR*hitR;
        if(cq<=0){ bt=tk; bestT=0; break; }
        const disc=b*b-a*cq; if(disc<0||a<1e-9) continue;
        const tt=(-b-Math.sqrt(disc))/a;
        if(tt>=0&&tt<=bestT){ bestT=tt; bt=tk; }
      }
      if(bt){
        const hx=x+dx*bestT, hy=y+dy*bestT;
        segs.push({x1:x,y1:y,x2:hx,y2:hy}); len+=bestT;
        return {segs,end:'tank',x:hx,y:hy,dx,dy,bounces,len,tank:bt,cell:null};
      }
    }
    const ex2=x+dx*segLen, ey2=y+dy*segLen;
    segs.push({x1:x,y1:y,x2:ex2,y2:ey2}); len+=segLen;
    if(tWall<0) return {segs,end:'len',x:ex2,y:ey2,dx,dy,bounces,len,tank:null,cell:null};
    if(wt===CORK) return {segs,end:'cork',x:ex2,y:ey2,dx,dy,bounces,len,tank:null,cell:{c:wc,r:wr}};
    if(bouncesLeft<=0) return {segs,end:'wall',x:ex2,y:ey2,dx,dy,bounces,len,tank:null,cell:{c:wc,r:wr}};
    // Reflexion vectorial: R = D - 2 (D . N) N
    const dot=dx*nx+dy*ny; dx=dx-2*dot*nx; dy=dy-2*dot*ny;
    bouncesLeft--; bounces++;
    x=ex2+dx*0.001; y=ey2+dy*0.001; c=cc; r=rc;
  }
  return {segs,end:'len',x,y,dx,dy,bounces,len,tank:null,cell:null};
}

/* BFS sobre la rejilla para navegar */
const _q=new Int16Array(COLS*ROWS), _prev=new Int16Array(COLS*ROWS);
function bfsPath(g,sc,sr,gc,gr,corkOk){
  _prev.fill(-2);
  const start=sr*COLS+sc, goal=gr*COLS+gc;
  let h=0,tl=0; _q[tl++]=start; _prev[start]=-1;
  while(h<tl){
    const cur=_q[h++]; if(cur===goal) break;
    const c=cur%COLS, r=(cur/COLS)|0;
    for(let k=0;k<4;k++){
      const nc=c+(k===0?1:k===1?-1:0), nr=r+(k===2?1:k===3?-1:0);
      if(nc<0||nr<0||nc>=COLS||nr>=ROWS) continue;
      const idx=nr*COLS+nc; if(_prev[idx]!==-2) continue;
      const tt=g[idx];
      if(tt===EMPTY||(corkOk&&tt===CORK)){ _prev[idx]=cur; _q[tl++]=idx; }
    }
  }
  if(_prev[goal]===-2) return null;
  const path=[]; let cur=goal;
  while(cur!==-1){ path.push({c:cur%COLS,r:(cur/COLS)|0}); cur=_prev[cur]; }
  path.reverse(); return path;
}
function pathDir(g,me,gc,gr){
  const sc=clamp(Math.floor(me.x/T),0,COLS-1), sr=clamp(Math.floor(me.y/T),0,ROWS-1);
  gc=clamp(gc,0,COLS-1); gr=clamp(gr,0,ROWS-1);
  let p=bfsPath(g,sc,sr,gc,gr,false);
  if(!p) p=bfsPath(g,sc,sr,gc,gr,true);
  if(!p) return null;
  if(p.length<2) return {x:(gc+.5)*T-me.x, y:(gr+.5)*T-me.y, cork:null};
  let cork=null;
  for(let k=1;k<Math.min(p.length,3);k++){ if(g[p[k].r*COLS+p[k].c]===CORK){cork=p[k];break;} }
  let pk=p[1];
  for(let k=Math.min(5,p.length-1);k>=2;k--){
    let ok=true;
    for(let j=1;j<=k;j++){ if(g[p[j].r*COLS+p[j].c]!==EMPTY){ok=false;break;} }
    if(ok&&clearFat(g,me.x,me.y,(p[k].c+.5)*T,(p[k].r+.5)*T)){pk=p[k];break;}
  }
  return {x:(pk.c+.5)*T-me.x, y:(pk.r+.5)*T-me.y, cork};
}

/* =====================================================================
   CEREBRO IA "CARAMBOLA" (exportable)
   state = { me, tanks[], bullets[], mines[], crates[], grid(Uint8Array COLSxROWS),
             time, canFire, minesLeft, personality, mem, bulletSpeed }
   return { mx, my (vector de movimiento -1..1), aim (rad), fire, mine, plan, mode }
   ===================================================================== */
const brainMem={};
function evalShot(s,me,a,hitR){
  const g=s.grid, dx=Math.cos(a), dy=Math.sin(a);
  const sx=me.x+dx*BARREL, sy=me.y+dy*BARREL;
  if(bulletSolid(tileAt(g,Math.floor(sx/T),Math.floor(sy/T)))) return null;
  if(bulletSolid(tileAt(g,Math.floor((me.x+dx*14)/T),Math.floor((me.y+dy*14)/T)))) return null;
  const r=castPath(g,sx,sy,dx,dy,MAX_BOUNCES,1100,s.tanks,hitR,s.bulletSpeed||BSPEED,-1);
  if(r.end!=='tank'||r.tank.id===me.id) return null;
  for(let i=1;i<r.segs.length;i++) if(segPointDist(r.segs[i],me.x,me.y)<26) return null; // no suicidarse con la carambola
  return r;
}

function decide(s){
  const me=s.me, P=s.personality||PERS[0], g=s.grid;
  const tanksA=s.tanks||[], bulletsA=s.bullets||[], minesA=s.mines||[], cratesA=s.crates||[];
  const sp=s.bulletSpeed||BSPEED;
  let mem=s.mem; if(!mem){ mem=brainMem[me.id]||(brainMem[me.id]={}); }
  if(!mem.init){ mem.init=true; mem.strafe=Math.random()<.5?1:-1; mem.strafeT=1; mem.lx=me.x; mem.ly=me.y; mem.stuckT=0; mem.unstick=0; mem.ux=0; mem.uy=0; mem.lastT=s.time||0; mem.err=0; mem.errT=0; mem.nextFire=0; mem.rot=0; }
  const now=s.time||0; const dt=clamp(now-mem.lastT,0,0.25); mem.lastT=now;
  const out={mx:0,my:0,aim:me.turret,fire:false,mine:false,plan:null,mode:'PATRULLA'};

  const enemies=[]; for(const t of tanksA) if(t.alive&&t.id!==me.id) enemies.push(t);
  if(!enemies.length){ out.mode='VICTORIA'; out.aim=me.turret+0.6; out.mx=Math.cos(now*1.7)*0.5; out.my=Math.sin(now*1.7)*0.5; return out; }
  let near=enemies[0], nd=1e9;
  for(const e of enemies){ const d=Math.hypot(e.x-me.x,e.y-me.y); if(d<nd){nd=d;near=e;} }

  /* 1) AMENAZAS: simular trayectoria de cada bala (con rebotes) y esquivar perpendicularmente */
  let dgx=0, dgy=0, threatB=null, threatW=0;
  for(const b of bulletsA){
    if(b.owner===me.id&&b.age<0.3) continue;
    const p=castPath(g,b.x,b.y,b.dx,b.dy,b.bouncesLeft,340,null);
    let acc=0;
    for(const sg of p.segs){
      const sx=sg.x2-sg.x1, sy=sg.y2-sg.y1, L=Math.hypot(sx,sy);
      if(L<0.001) continue;
      const ux=sx/L, uy=sy/L;
      const tp=clamp((me.x-sg.x1)*ux+(me.y-sg.y1)*uy,0,L);
      const cx=sg.x1+ux*tp, cy=sg.y1+uy*tp;
      const d=Math.hypot(me.x-cx,me.y-cy), along=acc+tp;
      if(d<36&&along<340){
        const w=(1-along/340)*0.8+(1-d/36)*0.6;
        const nx=-uy, ny=ux;
        const sd=(me.x-cx)*nx+(me.y-cy)*ny;
        let side=Math.abs(sd)>1.5?Math.sign(sd):mem.strafe;
        if(!tankFree(g,me.x+nx*side*24,me.y+ny*side*24)) side=-side;
        dgx+=nx*side*w; dgy+=ny*side*w;
        if(w>threatW){threatW=w;threatB=b;}
      }
      acc+=L;
    }
  }
  for(const m of minesA){
    const d=Math.hypot(me.x-m.x,me.y-m.y), R=96;
    if(d<R){
      const w=(1-d/R)*(m.triggered?2.6:1.25)*(m.owner===me.id?1.3:1);
      const ux=d>0.5?(me.x-m.x)/d:Math.cos(me.angle+Math.PI), uy=d>0.5?(me.y-m.y)/d:Math.sin(me.angle+Math.PI);
      dgx+=ux*w; dgy+=uy*w;
    }
  }

  /* 2) BUSQUEDA DE TIRO: abanico de rayos con hasta 2 rebotes + tiro directo con anticipacion */
  mem.errT-=dt; if(mem.errT<=0){ mem.errT=0.5+Math.random()*0.8; mem.err=(Math.random()*2-1)*P.aimError; }
  const N=P.rays|0; mem.rot=(mem.rot+0.618)%1; const step=TAU/N;
  let best=null;
  const tryA=(a)=>{
    const r=evalShot(s,me,a,12); if(!r) return;
    const turn=Math.abs(angDiff(a,me.turret));
    const sc=r.len+r.bounces*P.bouncePenalty+turn*70;
    if(!best||sc<best.score) best={a,score:sc,res:r};
  };
  for(const e of enemies){
    const d=Math.hypot(e.x-me.x,e.y-me.y), tt=d/sp;
    tryA(Math.atan2(e.y+(e.vy||0)*tt-me.y,e.x+(e.vx||0)*tt-me.x));
    tryA(Math.atan2(e.y-me.y,e.x-me.x));
  }
  for(let i=0;i<N;i++) tryA((i+mem.rot)*step);
  if(best){ // centrar el angulo dentro de la ventana de impacto
    let lo=best.a, hi=best.a;
    for(let k=1;k<=4;k++){ const a=best.a-k*0.008, r=evalShot(s,me,a,12); if(r&&r.tank===best.res.tank) lo=a; else break; }
    for(let k=1;k<=4;k++){ const a=best.a+k*0.008, r=evalShot(s,me,a,12); if(r&&r.tank===best.res.tank) hi=a; else break; }
    best.a=(lo+hi)/2;
  }
  if(best){ out.aim=best.a+mem.err; out.plan=best.res.segs; out.mode=best.res.bounces>0?('CARAMBOLA x'+best.res.bounces):'TIRO DIRECTO'; }
  else out.aim=Math.atan2(near.y-me.y,near.x-me.x);

  /* 3) MOVIMIENTO */
  let gx=0, gy=0, pinfo=null;
  let crate=null, cd=360;
  if(!(me.triple>0)){ for(const k of cratesA){ if(k.landed===false) continue; const d=Math.hypot(k.x-me.x,k.y-me.y); if(d<cd){cd=d;crate=k;} } }
  const tgt=best?best.res.tank:near;
  const dT=Math.hypot(tgt.x-me.x,tgt.y-me.y);
  if(crate&&!(best&&dT<170)){
    pinfo=pathDir(g,me,Math.floor(crate.x/T),Math.floor(crate.y/T));
    if(pinfo){gx=pinfo.x;gy=pinfo.y;}
    if(!best) out.mode='BUSCA CAJA x3';
  } else if(best&&dT<P.holdDist*1.7){
    const ang=Math.atan2(tgt.y-me.y,tgt.x-me.x);
    gx=-Math.sin(ang)*mem.strafe*0.7; gy=Math.cos(ang)*mem.strafe*0.7;
    if(dT<P.holdDist*0.6){ gx-=Math.cos(ang)*0.9; gy-=Math.sin(ang)*0.9; }
    if(!tankFree(g,me.x+gx*30,me.y+gy*30)){ mem.strafe*=-1; gx=-gx; gy=-gy; }
  } else {
    pinfo=pathDir(g,me,Math.floor(tgt.x/T),Math.floor(tgt.y/T));
    if(pinfo){gx=pinfo.x;gy=pinfo.y;}
    if(dT<P.holdDist*0.45){ gx=me.x-tgt.x; gy=me.y-tgt.y; }
    if(!best) out.mode='CAZANDO';
  }
  let gl=Math.hypot(gx,gy); if(gl>1){gx/=gl;gy/=gl;}
  mem.strafeT-=dt; if(mem.strafeT<=0){ mem.strafe*=-1; mem.strafeT=0.9+Math.random()*1.6; }

  let mx=gx, my=gy;
  const dl=Math.hypot(dgx,dgy);
  if(dl>0.12){ mx=dgx/dl+gx*0.25; my=dgy/dl+gy*0.25; out.mode='ESQUIVANDO'; }
  for(const o of tanksA){
    if(!o.alive||o.id===me.id) continue;
    const d=Math.hypot(me.x-o.x,me.y-o.y);
    if(d<58&&d>0.1){ mx+=(me.x-o.x)/d*0.8; my+=(me.y-o.y)/d*0.8; }
  }
  // anti-atasco
  mem.stuckT+=dt;
  if(mem.stuckT>0.7){
    const moved=Math.hypot(me.x-mem.lx,me.y-mem.ly);
    if(moved<6&&Math.hypot(mx,my)>0.3&&mem.unstick<=0){ mem.unstick=0.55; const a=Math.random()*TAU; mem.ux=Math.cos(a); mem.uy=Math.sin(a); }
    mem.stuckT=0; mem.lx=me.x; mem.ly=me.y;
  }
  if(mem.unstick>0){ mem.unstick-=dt; mx=mem.ux; my=mem.uy; }
  // direccion con evasion de obstaculos y minas enemigas
  const l=Math.hypot(mx,my);
  if(l>0.05){
    const base=Math.atan2(my,mx); let ch=null;
    for(const o of STEER){
      const a=base+o, px=me.x+Math.cos(a)*20, py=me.y+Math.sin(a)*20;
      if(!tankFree(g,px,py,TANK_R-1)) continue;
      let bad=false; for(const m of minesA){ if(m.owner!==me.id&&Math.hypot(m.x-px,m.y-py)<44){bad=true;break;} }
      if(bad) continue; ch=a; break;
    }
    if(ch===null) ch=base;
    const mag=Math.min(1,l); out.mx=Math.cos(ch)*mag; out.my=Math.sin(ch)*mag;
  }

  /* 4) MUROS DE CORCHO EN LA RUTA / INTERCEPCION DE BALAS */
  if(!best&&pinfo&&pinfo.cork){
    const cx=(pinfo.cork.c+.5)*T, cy=(pinfo.cork.r+.5)*T;
    out.aim=Math.atan2(cy-me.y,cx-me.x); out.mode='ROMPIENDO MURO';
    if(s.canFire&&now>=mem.nextFire&&Math.abs(angDiff(out.aim,me.turret))<0.09){
      const dx=Math.cos(me.turret), dy=Math.sin(me.turret);
      const tx=me.x+dx*BARREL, ty=me.y+dy*BARREL;
      const tc=Math.floor(tx/T), tr=Math.floor(ty/T);
      let ok=(tc===pinfo.cork.c&&tr===pinfo.cork.r);
      if(!ok){ const r=castPath(g,tx,ty,dx,dy,0,420,null); ok=(r.end==='cork'&&r.cell.c===pinfo.cork.c&&r.cell.r===pinfo.cork.r); }
      if(ok){ out.fire=true; mem.nextFire=now+P.fireDelay; }
    }
    if(s.minesLeft>0&&Math.hypot(cx-me.x,cy-me.y)<54&&Math.random()<0.06*P.mineRate+0.02) out.mine=true;
  } else if(!best&&threatB&&P.intercept&&threatW>0.55){
    const a=Math.atan2(threatB.y-me.y,threatB.x-me.x);
    out.aim=a;
    if(s.canFire&&now>=mem.nextFire&&Math.abs(angDiff(a,me.turret))<0.1&&Math.hypot(threatB.x-me.x,threatB.y-me.y)<260){
      out.fire=true; mem.nextFire=now+P.fireDelay; out.mode='INTERCEPTANDO';
    }
  }
  // Disparo verificado con la linea actual de la torreta
  if(!out.fire&&s.canFire&&now>=mem.nextFire){
    const cur=evalShot(s,me,me.turret,P.verifyR);
    if(cur){ out.fire=true; mem.nextFire=now+P.fireDelay*(0.75+Math.random()*0.5); }
  }

  /* 5) MINAS */
  if(s.minesLeft>0&&!out.mine){
    let close=false; for(const m of minesA){ if(Math.hypot(m.x-me.x,m.y-me.y)<75){close=true;break;} }
    if(!close){
      if(nd<130&&Math.random()<P.mineRate*0.22) out.mine=true;
      else if(Math.random()<P.mineRate*0.004) out.mine=true;
    }
  }
  return out;
}

/* =====================================================================
   AUDIO PROCEDURAL (Web Audio API)
   ===================================================================== */
const Snd={ctx:null,master:null,noise:null,last:{}};
function audioInit(){
  if(Snd.ctx){ if(Snd.ctx.state==='suspended') Snd.ctx.resume(); return; }
  const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
  const c=new AC(); Snd.ctx=c;
  Snd.master=c.createGain(); Snd.master.gain.value=0.5;
  const comp=c.createDynamicsCompressor(); Snd.master.connect(comp); comp.connect(c.destination);
  const len=c.sampleRate*2, buf=c.createBuffer(1,len,c.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
  Snd.noise=buf;
}
function outNode(pan){
  const c=Snd.ctx;
  if(c.createStereoPanner){ const p=c.createStereoPanner(); p.pan.value=clamp(pan,-1,1); p.connect(Snd.master); return p; }
  return Snd.master;
}
function tone(type,f0,f1,dur,vol,pan,delay){
  const c=Snd.ctx, t0=c.currentTime+(delay||0);
  const o=c.createOscillator(); o.type=type; o.frequency.setValueAtTime(f0,t0);
  if(f1!==f0) o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t0+dur);
  const gn=c.createGain(); gn.gain.setValueAtTime(0.0001,t0); gn.gain.exponentialRampToValueAtTime(vol,t0+0.008); gn.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(gn); gn.connect(outNode(pan)); o.start(t0); o.stop(t0+dur+0.03);
}
function noiseB(dur,vol,ft,f0,f1,pan,q,delay){
  const c=Snd.ctx, t0=c.currentTime+(delay||0);
  const s=c.createBufferSource(); s.buffer=Snd.noise;
  const f=c.createBiquadFilter(); f.type=ft; f.frequency.setValueAtTime(f0,t0);
  if(f1!==f0) f.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t0+dur);
  if(q) f.Q.value=q;
  const gn=c.createGain(); gn.gain.setValueAtTime(0.0001,t0); gn.gain.exponentialRampToValueAtTime(vol,t0+0.006); gn.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  s.connect(f); f.connect(gn); gn.connect(outNode(pan)); s.start(t0,Math.random()*0.8); s.stop(t0+dur+0.03);
}
function play(name,x){
  const c=Snd.ctx; if(!c||c.state!=='running') return;
  const now=c.currentTime;
  const lim={bounce:0.035,beep:0.07,shoot:0.025,cork:0.04,fizzle:0.05,clash:0.04,land:0.05};
  if(lim[name]&&Snd.last[name]&&now-Snd.last[name]<lim[name]) return;
  Snd.last[name]=now;
  const pan=x==null?0:clamp((x/W)*2-1,-1,1)*0.7;
  switch(name){
    case 'shoot': tone('square',640,170,0.1,0.16,pan); noiseB(0.06,0.16,'highpass',2200,2200,pan); break;
    case 'bounce': tone('sine',1500,1100,0.07,0.12,pan); tone('triangle',2300,2100,0.04,0.05,pan); break;
    case 'cork': noiseB(0.09,0.25,'bandpass',900,500,pan,3); tone('triangle',260,140,0.08,0.15,pan); break;
    case 'break': noiseB(0.32,0.35,'lowpass',2600,300,pan); tone('square',190,60,0.22,0.1,pan); break;
    case 'boom': noiseB(0.8,0.7,'lowpass',1900,110,pan); tone('sine',115,35,0.6,0.5,pan); break;
    case 'tank': noiseB(1.0,0.8,'lowpass',2600,100,pan); tone('sawtooth',320,40,0.7,0.16,pan); tone('sine',85,30,0.8,0.5,pan); break;
    case 'mine': tone('triangle',520,520,0.06,0.15,pan); tone('triangle',780,780,0.08,0.15,pan,0.07); break;
    case 'beep': tone('sine',1700,1700,0.045,0.07,pan); break;
    case 'pickup': [523,659,784,1047].forEach((f,i)=>tone('square',f,f,0.08,0.08,pan,i*0.06)); break;
    case 'clash': noiseB(0.05,0.2,'highpass',3000,3000,pan); tone('square',900,300,0.05,0.08,pan); break;
    case 'win': [392,523,659,784,1047].forEach((f,i)=>tone('triangle',f,f,0.18,0.14,0,i*0.1)); break;
    case 'round': [330,440,660].forEach((f,i)=>tone('square',f,f,0.1,0.07,0,i*0.11)); break;
    case 'fizzle': noiseB(0.08,0.1,'bandpass',600,300,pan,2); break;
    case 'land': tone('triangle',210,90,0.1,0.14,pan); noiseB(0.06,0.1,'lowpass',800,300,pan); break;
    case 'drop': [880,660,440].forEach((f,i)=>tone('sine',f,f*0.9,0.09,0.08,0,i*0.07)); break;
  }
}

function makeBlockSprite(kind,hp){
  const s=document.createElement('canvas');
  s.width=Math.ceil((T+2)*ps); s.height=Math.ceil((T+LIFT+2)*ps);
  const c=s.getContext('2d'); c.setTransform(ps,0,0,ps,ps,ps);

    let g=c.createLinearGradient(0,T-6,0,T+LIFT); g.addColorStop(0,'#e3a15c'); g.addColorStop(1,'#bf7834');
    c.fillStyle=g; rr(c,0,T-8,T,LIFT+8,6); c.fill();

    for(let x=6;x<T;x+=9){ c.beginPath(); c.moveTo(x,T+1); c.lineTo(x+1,T+LIFT-2); c.stroke(); }
    g=c.createLinearGradient(0,0,T,T); g.addColorStop(0,'#fff0c8'); g.addColorStop(0.55,'#f9d58f'); g.addColorStop(1,'#efbd6c');
    c.fillStyle=g; rr(c,0,0,T,T,6); c.fill();
    c.strokeStyle='rgba(185,115,45,.28)'; c.lineWidth=1;
    for(let k=0;k<4;k++){ const y=6+k*8+R()*3; c.beginPath(); c.moveTo(4,y); c.bezierCurveTo(T*.3,y+R()*5-2.5,T*.65,y+R()*5-2.5,T-4,y+R()*3-1.5); c.stroke(); }
    c.beginPath(); c.ellipse(T*0.68,T*0.35,3.2,2,0.2,0,TAU); c.stroke();
    c.strokeStyle='rgba(255,255,255,.75)'; c.lineWidth=2; c.beginPath(); c.moveTo(3,T-5); c.lineTo(3,3.5); c.lineTo(T-5,3.5); c.stroke();
    c.strokeStyle='rgba(160,90,25,.45)'; c.lineWidth=1.6; c.beginPath(); c.moveTo(T-2.5,5); c.lineTo(T-2.5,T-2.5); c.lineTo(5,T-2.5); c.stroke();
    c.strokeStyle='#c98a45'; c.lineWidth=1; rr(c,0.5,0.5,T-1,T-1,6); c.stroke();
  } else {
    let g=c.createLinearGradient(0,T-6,0,T+LIFT); g.addColorStop(0,'#cf7b3c'); g.addColorStop(1,'#a2552a');
    c.fillStyle=g; rr(c,0,T-8,T,LIFT+8,5); c.fill();
    c.strokeStyle='rgba(255,220,180,.35)'; c.lineWidth=1; c.beginPath(); c.moveTo(T/2,T); c.lineTo(T/2,T+LIFT-1); c.stroke();
    g=c.createLinearGradient(0,0,T,T); g.addColorStop(0,'#f7c08a'); g.addColorStop(1,'#de8f52');
    c.fillStyle=g; rr(c,0,0,T,T,5); c.fill();
    for(let k=0;k<46;k++){ c.fillStyle=R()<0.55?'rgba(150,80,35,.45)':'rgba(255,240,215,.6)'; c.beginPath(); c.arc(2+R()*(T-4),2+R()*(T-4),0.6+R()*1.1,0,TAU); c.fill(); }
    c.strokeStyle='rgba(150,75,30,.5)'; c.lineWidth=1.2; c.beginPath();
    c.moveTo(1,T/2); c.lineTo(T-1,T/2); c.moveTo(T/2,1); c.lineTo(T/2,T/2); c.moveTo(T/4,T/2); c.lineTo(T/4,T-1); c.moveTo(T*3/4,T/2); c.lineTo(T*3/4,T-1); c.stroke();
    c.strokeStyle='rgba(255,255,255,.6)'; c.lineWidth=1.8; c.beginPath(); c.moveTo(2.5,T-5); c.lineTo(2.5,3); c.lineTo(T-5,3); c.stroke();
    c.strokeStyle='#b9642c'; c.lineWidth=1; rr(c,0.5,0.5,T-1,T-1,5); c.stroke();
    const cracks=3-hp;
    c.strokeStyle='#6b3412'; c.lineWidth=1.6; c.lineCap='round'; c.lineJoin='round';
    for(let k=0;k<cracks*2;k++){
      let x=6+R()*(T-12), y=6+R()*(T-12); c.beginPath(); c.moveTo(x,y);
      for(let j=0;j<4;j++){ x+=R()*12-6; y+=R()*12-6; c.lineTo(clamp(x,2,T-2),clamp(y,2,T-2)); }
      c.stroke();
    }

  }

}
function buildSprites(){

function buildFloor(){
  fsc=Math.min(ps,3);
  const ex=W+2*(FR+FM), ey=H+2*(FR+FM)+14;
  floorCv.width=Math.ceil(ex*fsc); floorCv.height=Math.ceil(ey*fsc);
  const f=floorCv.getContext('2d');
  f.setTransform(fsc,0,0,fsc,(FR+FM)*fsc,(FR+FM)*fsc);
  f.clearRect(-FR-FM,-FR-FM,ex,ey);
  f.fillStyle='rgba(30,100,140,.22)'; rr(f,-FR+10,-FR+18,W+2*FR,H+2*FR+8,26); f.fill();
  f.fillStyle='#a8622a'; rr(f,-FR,-FR+8,W+2*FR,H+2*FR+6,22); f.fill();
  let g=f.createLinearGradient(0,-FR,0,H+FR); g.addColorStop(0,'#f6bd74'); g.addColorStop(1,'#dd9449');
  f.fillStyle=g; rr(f,-FR,-FR,W+2*FR,H+2*FR,22); f.fill();
  const R=mulberry32(91);
  f.strokeStyle='rgba(170,95,35,.22)'; f.lineWidth=1;
  for(let k=0;k<26;k++){ const y=-FR+3+R()*(FR-6); f.beginPath(); f.moveTo(-FR+10+R()*40,y); f.lineTo(W+FR-10-R()*40,y+R()*2-1); f.stroke(); const y2=H+3+R()*(FR-6); f.beginPath(); f.moveTo(-FR+10+R()*40,y2); f.lineTo(W+FR-10-R()*40,y2); f.stroke(); }
  f.strokeStyle='rgba(255,245,220,.85)'; f.lineWidth=2.2; rr(f,-FR+2.5,-FR+2.5,W+2*FR-5,H+2*FR-5,20); f.stroke();
  f.fillStyle='#b8702f'; rr(f,-5,-5,W+10,H+10,7); f.fill();
  for(const [sx,sy] of [[-FR/2,-FR/2],[W+FR/2,-FR/2],[-FR/2,H+FR/2],[W+FR/2,H+FR/2]]){
    f.fillStyle='#ffe9b8'; f.beginPath(); f.arc(sx,sy,5,0,TAU); f.fill();
    f.strokeStyle='#b8702f'; f.lineWidth=1.5; f.beginPath(); f.moveTo(sx-3,sy-3); f.lineTo(sx+3,sy+3); f.stroke();
  }
  f.save(); f.beginPath(); f.rect(0,0,W,H); f.clip();
  const ph=T/2;
  for(let y=0;y<H;y+=ph){
    let x=-R()*120;
    while(x<W){
      const len=90+R()*150;
      f.fillStyle='hsl('+(33+R()*6).toFixed(1)+','+(72+R()*12).toFixed(1)+'%,'+(81+R()*6).toFixed(1)+'%)';
      f.fillRect(x,y,len,ph);
      f.strokeStyle='rgba(175,115,55,.13)'; f.lineWidth=0.7;
      for(let k=0;k<3;k++){ const yy=y+3+R()*(ph-6); f.beginPath(); f.moveTo(x,yy); f.bezierCurveTo(x+len*.3,yy+R()*4-2,x+len*.6,yy+R()*4-2,x+len,yy); f.stroke(); }
      f.fillStyle='rgba(160,100,45,.35)'; f.fillRect(x+len-1,y,1.2,ph);
      x+=len;
    }
    f.fillStyle='rgba(160,100,45,.3)'; f.fillRect(0,y+ph-1,W,1);
  }
  f.strokeStyle='rgba(255,255,255,.18)'; f.lineWidth=1;
  for(let c=1;c<COLS;c++){ f.beginPath(); f.moveTo(c*T,0); f.lineTo(c*T,H); f.stroke(); }
  let sg=f.createLinearGradient(0,0,0,14); sg.addColorStop(0,'rgba(120,60,15,.32)'); sg.addColorStop(1,'rgba(120,60,15,0)');
  f.fillStyle=sg; f.fillRect(0,0,W,14);
  sg=f.createLinearGradient(0,0,14,0); sg.addColorStop(0,'rgba(120,60,15,.25)'); sg.addColorStop(1,'rgba(120,60,15,0)');
  f.fillStyle=sg; f.fillRect(0,0,14,H);
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++) if(grid[r*COLS+c]===PIT) drawPit(f,c,r);
  f.restore();
}
function drawPit(f,c,r){
  const x=c*T, y=r*T;
  const up=isPit(c,r-1), dn=isPit(c,r+1), lf=isPit(c-1,r), rt=isPit(c+1,r);
  const ix=x+(lf?0:4), iy=y+(up?0:4), iw=T-(lf?0:4)-(rt?0:4), ih=T-(up?0:4)-(dn?0:4);
  f.fillStyle='#e8bd7d'; f.fillRect(x,y,T,T);
  const g=f.createLinearGradient(0,y,0,y+T); g.addColorStop(0,'#3fb8f5'); g.addColorStop(1,'#68d6ff');
  f.fillStyle=g; f.fillRect(ix,iy,iw,ih);
  if(!up){ const sg=f.createLinearGradient(0,iy,0,iy+9); sg.addColorStop(0,'rgba(0,60,130,.45)'); sg.addColorStop(1,'rgba(0,60,130,0)'); f.fillStyle=sg; f.fillRect(ix,iy,iw,9); }
  if(!lf){ const sg=f.createLinearGradient(ix,0,ix+6,0); sg.addColorStop(0,'rgba(0,60,130,.3)'); sg.addColorStop(1,'rgba(0,60,130,0)'); f.fillStyle=sg; f.fillRect(ix,iy,6,ih); }
  f.strokeStyle='rgba(255,255,255,.55)'; f.lineWidth=1.3;
  f.beginPath(); f.arc(x+T*0.35,y+T*0.6,6,Math.PI*1.1,Math.PI*1.7); f.stroke();

}

function randomEmptyCell(c0,c1,r0,r1){
  for(let k=0;k<300;k++){
    const c=(c0+Math.random()*(c1-c0+1))|0, r=(r0+Math.random()*(r1-r0+1))|0;
    if(grid[r*COLS+c]!==EMPTY) continue;
    const x=(c+.5)*T, y=(r+.5)*T;
    let ok=true;
    for(const t of tanks) if(t.alive&&Math.hypot(t.x-x,t.y-y)<50){ok=false;break;}
    for(const k2 of crates) if(Math.hypot(k2.x-x,k2.y-y)<50){ok=false;break;}
    if(ok) return {x,y};
  }
  return null;
}
function dropCrates(n,center){
  let dropped=0;
  for(let i=0;i<n;i++){
    const p=center?randomEmptyCell(6,15,3,10):randomEmptyCell(2,19,1,12);
    if(!p) continue;
    crates.push({x:p.x,y:p.y,z:240+Math.random()*120,vz:0,landed:false,bob:Math.random()*TAU});
    dropped++;
  }
  if(dropped) play('drop');
}
function newRound(){
  roundNum++;
  let li; do{ li=(Math.random()*LAYOUTS.length)|0; }while(li===layoutIdx&&LAYOUTS.length>1);
  layoutIdx=li;
  buildGrid(LAYOUTS[li]);
  bullets.length=0; mines.length=0; crates.length=0; particles.length=0; decals.length=0;
  tctx.setTransform(1,0,0,1,0,0); tctx.clearRect(0,0,trackCv.width,trackCv.height);
  for(const t of tanks){
    t.x=(t.def.spawn[0]+.5)*T; t.y=(t.def.spawn[1]+.5)*T;
    t.angle=t.def.a; t.turret=Math.atan2(H/2-t.y,W/2-t.x);
    t.alive=true; t.vx=0; t.vy=0; t.spd=0; t.rev=false; t.cool=0.15+t.id*0.05; t.recoil=0; t.triple=0;
    t.mem={}; t.think=t.id*0.0125; t.ctl={mx:0,my:0,aim:t.turret,fire:false,mine:false,plan:null,mode:'PATRULLA'};
  }
  roundOver=false; roundTimer=0;
  buildFloor();
  dropCrates(2,true);
  showBanner('RONDA '+roundNum+'  |  '+LAYOUTS[li].name.toUpperCase(),'#2f7dff',1.6);
  play('round');

}
function restartBattle(){
  for(const t of tanks){ t.kills=0; t.wins=0; }
  roundNum=0; feedEl.innerHTML='';
  newRound();
}
function checkRound(){
  if(roundOver) return;
  let alive=null, n=0;
  for(const t of tanks) if(t.alive){ n++; alive=t; }
  if(n<=1){
    roundOver=true; roundTimer=3.4;
    if(n===1){ alive.wins++; showBanner('GANA '+alive.name,alive.color,3); play('win'); }
    else showBanner('EMPATE','#ff5fb1',3);
    updateHUD();
  }
}

function P(x,y,vx,vy,life,size,color,type){
  if(particles.length>850) return null;
  const p={x,y,vx,vy,life,max:life,size,color,type,z:0,vz:0,rot:Math.random()*TAU,vr:rnd(-9,9)};
  particles.push(p); return p;
}
function sparks(x,y,n,col){
  for(let i=0;i<n;i++){ const a=Math.random()*TAU, s=rnd(60,200); P(x,y,Math.cos(a)*s,Math.sin(a)*s,rnd(.15,.3),1.5,col||pick(['#fff7b0','#ffd84a','#ffffff']),'spark'); }
}
function poof(x,y,col){
  for(let i=0;i<6;i++){ const a=Math.random()*TAU, s=rnd(10,50); P(x,y,Math.cos(a)*s,Math.sin(a)*s,rnd(.3,.5),rnd(3,5),'#fff6e6','smoke'); }

function chips(x,y,n,cols){

}
function boomFx(x,y,scale){
  scale=scale||1;
  P(x,y,0,0,0.42,BLAST_R*scale,'#fff3b0','ring');
  for(let i=0;i<26*scale;i++){ const a=Math.random()*TAU, s=rnd(40,230)*scale; P(x,y,Math.cos(a)*s,Math.sin(a)*s,rnd(.3,.65),rnd(6,12)*scale,pick(['#ffe14d','#ffb020','#ff6a2a','#fff6c0']),'fire'); }
  for(let i=0;i<14*scale;i++){ const a=Math.random()*TAU, s=rnd(10,60); P(x+rnd(-10,10),y+rnd(-10,10),Math.cos(a)*s,Math.sin(a)*s,rnd(.8,1.4),rnd(8,14),pick(['#fff4e2','#f6e9d4','#eee0cc']),'smoke'); }
  sparks(x,y,14);
  tctx.setTransform(TS,0,0,TS,0,0);
  const g=tctx.createRadialGradient(x,y,2,x,y,BLAST_R*0.7*scale);
  g.addColorStop(0,'rgba(110,60,20,.32)'); g.addColorStop(1,'rgba(110,60,20,0)');
  tctx.fillStyle=g; tctx.beginPath(); tctx.arc(x,y,BLAST_R*0.7*scale,0,TAU); tctx.fill();
}
function damageCork(c,r,amount){
  const i=r*COLS+c; if(grid[i]!==CORK) return;
  const cx=(c+.5)*T, cy=(r+.5)*T;
  corkHp[i]=Math.max(0,corkHp[i]-(amount||1));
  chips(cx,cy-LIFT,5,['#e39a5c','#f7c08a','#a2552a']);
  if(corkHp[i]<=0){
    grid[i]=EMPTY;
    chips(cx,cy-LIFT,22,['#e39a5c','#f7c08a','#a2552a','#ffe0b8']);
    for(let k=0;k<8;k++) P(cx+rnd(-14,14),cy+rnd(-14,14),rnd(-20,20),rnd(-20,20),rnd(.6,1),rnd(6,10),'#f6e5cc','smoke');
    play('break',cx); shake=Math.min(12,shake+2);
  } else play('cork',cx);
}
function tryFire(t){
  if(t.cool>0) return false;
  let n=0; for(const b of bullets) if(b.owner===t.id) n++;
  if(n>=MAXB) return false;
  const angs=t.triple>0?[t.turret-0.2,t.turret,t.turret+0.2]:[t.turret];
  let any=false;
  for(const a of angs){
    const dx=Math.cos(a), dy=Math.sin(a);
    const tx=t.x+dx*BARREL, ty=t.y+dy*BARREL;
    const tc=Math.floor(tx/T), tr=Math.floor(ty/T), tt=tileAt(grid,tc,tr);
    const mc=Math.floor((t.x+dx*14)/T), mr=Math.floor((t.y+dy*14)/T), mt=tileAt(grid,mc,mr);
    if(mt===CORK){ damageCork(mc,mr); any=true; continue; }
    if(tt===CORK){ damageCork(tc,tr); any=true; continue; }
    if(tt===WOOD||mt===WOOD){ poof(tx,ty,t.light); play('fizzle',tx); continue; }
    bullets.push({x:tx,y:ty,dx,dy,owner:t.id,bouncesLeft:MAX_BOUNCES,age:0,color:t.color,dark:t.dark,trail:[],smokeT:0,dead:false});
    any=true;
    for(let i=0;i<4;i++) P(tx,ty,dx*rnd(40,110)+rnd(-25,25),dy*rnd(40,110)+rnd(-25,25),rnd(.15,.3),rnd(3,6),pick(['#fff6b0','#ffd84a']),'fire');
  }
  t.cool=COOLDOWN; t.recoil=1;
  P(t.x+Math.cos(t.turret)*BARREL,t.y+Math.sin(t.turret)*BARREL,0,0,0.3,6,'#fff6e6','smoke');
  play('shoot',t.x);
  return any;
}
function tryMine(t){
  let n=0; for(const m of mines) if(m.owner===t.id) n++;
  if(n>=MAXM) return false;
  const x=t.x-Math.cos(t.angle)*4, y=t.y-Math.sin(t.angle)*4;
  for(const m of mines) if(Math.hypot(m.x-x,m.y-y)<22) return false;
  mines.push({x,y,owner:t.id,t:0,fuse:MINE_FUSE,triggered:false,bt:0,dead:false,color:t.color});
  play('mine',x);
  return true;
}
function killTank(t,killer){
  if(!t.alive) return;
  t.alive=false; t.vx=0; t.vy=0;
  if(killer!=null&&killer!==t.id){
    tanks[killer].kills++;
    addFeed('<b style="color:'+tanks[killer].dark+'">'+tanks[killer].name+'</b> destruyo a <b style="color:'+t.dark+'">'+t.name+'</b>');
  } else {
    addFeed('<b style="color:'+t.dark+'">'+t.name+'</b> cayo con su propio rebote');
  }
  boomFx(t.x,t.y,1.15);
  chips(t.x,t.y,14,[t.color,t.light,t.dark,'#4a4f6e']);
  decals.push({x:t.x,y:t.y,dark:t.dark,color:t.color,a:t.angle});
  shake=Math.min(16,shake+10);
  play('tank',t.x);
  updateHUD();

}
function explode(x,y,owner){
  boomFx(x,y,1);
  shake=Math.min(14,shake+8);
  play('boom',x);
  const c0=Math.floor((x-BLAST_R-T)/T), c1=Math.floor((x+BLAST_R+T)/T), r0=Math.floor((y-BLAST_R-T)/T), r1=Math.floor((y+BLAST_R+T)/T);
  for(let r=r0;r<=r1;r++) for(let c=c0;c<=c1;c++){
    if(tileAt(grid,c,r)!==CORK) continue;
    if(Math.hypot((c+.5)*T-x,(r+.5)*T-y)<BLAST_R+8) damageCork(c,r,9);
  }
  for(const b of bullets) if(!b.dead&&Math.hypot(b.x-x,b.y-y)<BLAST_R*0.85){ b.dead=true; poof(b.x,b.y,b.color); }
  for(const m of mines) if(!m.dead&&Math.hypot(m.x-x,m.y-y)<BLAST_R+10){ m.triggered=true; m.fuse=Math.min(m.fuse,0.12); }
  for(const t of tanks) if(t.alive&&Math.hypot(t.x-x,t.y-y)<BLAST_R) killTank(t,owner);
}

/* =====================================================================
   CONTROL DE TANQUES
   ===================================================================== */
function resolveTank(t){
  for(let it=0;it<3;it++){
    let moved=false;
    const c0=Math.floor((t.x-TANK_R)/T), c1=Math.floor((t.x+TANK_R)/T), r0=Math.floor((t.y-TANK_R)/T), r1=Math.floor((t.y+TANK_R)/T);
    for(let r=r0;r<=r1;r++) for(let c=c0;c<=c1;c++){
      if(!tankSolid(tileAt(grid,c,r))) continue;
      const nx=clamp(t.x,c*T,c*T+T), ny=clamp(t.y,r*T,r*T+T);
      const dx=t.x-nx, dy=t.y-ny, d2=dx*dx+dy*dy;
      if(d2<TANK_R*TANK_R){
        if(d2>1e-6){ const d=Math.sqrt(d2), p=TANK_R-d; t.x+=dx/d*p; t.y+=dy/d*p; }
        else{
          const l=t.x-c*T, rg=c*T+T-t.x, u=t.y-r*T, dn=r*T+T-t.y, m=Math.min(l,rg,u,dn);
          if(m===l)t.x=c*T-TANK_R; else if(m===rg)t.x=c*T+T+TANK_R; else if(m===u)t.y=r*T-TANK_R; else t.y=r*T+T+TANK_R;
        }
        moved=true;
      }
    }
    if(!moved) break;
  }
  t.x=clamp(t.x,TANK_R,W-TANK_R); t.y=clamp(t.y,TANK_R,H-TANK_R);
}
function drive(t,mx,my,dt,turn){
  const mag=Math.min(1,Math.hypot(mx,my));
  let spd=0;
  if(mag>0.08){
    const h=Math.atan2(my,mx);
    const ad=Math.abs(angDiff(h,t.angle));
    if(t.rev){ if(ad<1.3) t.rev=false; } else if(ad>2.0) t.rev=true;
    const ta=t.rev?h+Math.PI:h;
    t.angle=wrapA(rotateToward(t.angle,ta,turn*dt));
    const al=Math.max(0,Math.cos(angDiff(ta,t.angle)));
    spd=TANK_SPEED*mag*al*al*al*(t.rev?-1:1);
  }
  t.spd=spd;
  t.x+=Math.cos(t.angle)*spd*dt; t.y+=Math.sin(t.angle)*spd*dt;
  resolveTank(t);
}
function humanCtl(t){
  let mx=0,my=0;
  if(keys.l)mx-=1; if(keys.r)mx+=1; if(keys.u)my-=1; if(keys.d)my+=1;
  if(input.touch){ const dx=input.wx-t.x, dy=input.wy-t.y, d=Math.hypot(dx,dy); if(d>50){mx=dx/d;my=dy/d;} }
  const l=Math.hypot(mx,my); if(l>1){mx/=l;my/=l;}
  hc.mx=mx; hc.my=my;
  hc.aim=input.has?Math.atan2(input.wy-t.y,input.wx-t.x):t.turret;
  hc.fire=input.fire;
  hc.mine=input.mineReq; input.mineReq=false;
  return hc;
}
function stateFor(t){
  const s=t.state;
  let nb=0; for(const b of bullets) if(b.owner===t.id) nb++;
  let nm=0; for(const m of mines) if(m.owner===t.id) nm++;
  s.me=t; s.tanks=tanks; s.bullets=bullets; s.mines=mines; s.crates=crates; s.grid=grid; s.time=gameTime;
  s.canFire=t.cool<=0&&nb<MAXB; s.minesLeft=MAXM-nm; s.personality=t.pers; s.mem=t.mem;
  s.bulletSpeed=BSPEED; s.cols=COLS; s.rows=ROWS; s.tile=T;
  return s;
}
function stampTrack(t){
  const c=Math.cos(t.angle), s=Math.sin(t.angle);
  tctx.fillStyle='rgba(125,80,38,.17)';
  for(const sd of [-1,1]){
    const px=t.x-s*sd*10, py=t.y+c*sd*10;
    tctx.setTransform(TS*c,TS*s,-TS*s,TS*c,TS*px,TS*py);
    tctx.fillRect(-1.6,-3.2,3.2,6.4);
  }
}

/* =====================================================================
   UPDATE
   ===================================================================== */
function update(dt){
  gameTime+=dt;
  for(const t of tanks){
    if(!t.alive) continue;
    t.cool-=dt; if(t.triple>0) t.triple=Math.max(0,t.triple-dt); t.recoil=Math.max(0,t.recoil-dt*5);
    let ctl;
    if(t.human) ctl=humanCtl(t);
    else{
      t.think-=dt;
      if(t.think<=0){ t.think+=0.05; if(t.think<=0) t.think=0.05; t.ctl=BRAIN.decide(stateFor(t)); }
      ctl=t.ctl;
    }
    const ox=t.x, oy=t.y, oa=t.angle;
    drive(t,ctl.mx,ctl.my,dt,t.human?5.6:TURN_SPEED);
    t.turret=wrapA(rotateToward(t.turret,ctl.aim,(t.human?14:t.pers.turretSpeed)*dt));
    if(ctl.fire){ tryFire(t); if(!t.human) ctl.fire=false; }
    if(ctl.mine){ tryMine(t); ctl.mine=false; }
    const turned=Math.abs(angDiff(t.angle,oa));
    t.vx=(t.x-ox)/dt; t.vy=(t.y-oy)/dt;
    const mv=Math.hypot(t.x-ox,t.y-oy);
    t.tread+=(t.spd>=0?1:-1)*mv+turned*9;
    t.trackAcc+=mv+turned*10;
    if(t.trackAcc>6){ t.trackAcc=0; stampTrack(t); }
  }
  // separacion entre tanques
  for(let i=0;i<4;i++) for(let j=i+1;j<4;j++){
    const a=tanks[i], b=tanks[j]; if(!a.alive||!b.alive) continue;
    const dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy), mn=TANK_R*2;
    if(d<mn&&d>0.001){ const p=(mn-d)/2; a.x-=dx/d*p; a.y-=dy/d*p; b.x+=dx/d*p; b.y+=dy/d*p; resolveTank(a); resolveTank(b); }
  }
  // balas
  for(const b of bullets){
    if(b.dead) continue;
    b.age+=dt;
    const res=castPath(grid,b.x,b.y,b.dx,b.dy,b.bouncesLeft,BSPEED*dt,null);
    if(res.end==='blocked'){ b.dead=true; poof(b.x,b.y,b.color); continue; }
    for(let k=0;k<res.segs.length-1;k++){ const sg=res.segs[k]; sparks(sg.x2,sg.y2,6); P(sg.x2,sg.y2,0,0,0.25,10,'#ffffff','ring'); play('bounce',sg.x2); }
    b.bouncesLeft-=res.bounces;
    b.x=res.x; b.y=res.y; b.dx=res.dx; b.dy=res.dy;
    b.trail.push(b.x,b.y); if(b.trail.length>14) b.trail.splice(0,2);
    b.smokeT-=dt; if(b.smokeT<=0){ b.smokeT=0.045; P(b.x,b.y,rnd(-8,8),rnd(-8,8),0.35,2.5,'#ffffff','smoke'); }
    if(res.end==='wall'){ b.dead=true; poof(b.x,b.y,b.color); play('fizzle',b.x); }
    else if(res.end==='cork'){ b.dead=true; damageCork(res.cell.c,res.cell.r); poof(b.x,b.y,b.color); }
  }
  for(const b of bullets){
    if(b.dead) continue;
    for(const t of tanks){
      if(!t.alive) continue;
      if(t.id===b.owner&&b.age<0.12) continue;
      const dx=t.x-b.x, dy=t.y-b.y, rr2=TANK_R+BULLET_R;
      if(dx*dx+dy*dy<rr2*rr2){ b.dead=true; killTank(t,b.owner); break; }
    }
    if(b.dead) continue;
    for(const m of mines){
      if(m.dead) continue;
      if(Math.hypot(m.x-b.x,m.y-b.y)<BULLET_R+9){ b.dead=true; m.triggered=true; m.fuse=0; break; }
    }
  }
  for(let i=0;i<bullets.length;i++){
    const a=bullets[i]; if(a.dead) continue;
    for(let j=i+1;j<bullets.length;j++){
      const b=bullets[j]; if(b.dead) continue;
      const dx=a.x-b.x, dy=a.y-b.y;
      if(dx*dx+dy*dy<(BULLET_R*2+1)*(BULLET_R*2+1)){ a.dead=b.dead=true; sparks((a.x+b.x)/2,(a.y+b.y)/2,10); poof((a.x+b.x)/2,(a.y+b.y)/2,'#fff'); play('clash',a.x); break; }
    }
  }
  // minas
  for(const m of mines){
    if(m.dead) continue;
    m.t+=dt; m.fuse-=dt;
    if(m.t>0.8&&!m.triggered){
      for(const t of tanks) if(t.alive&&t.id!==m.owner&&Math.hypot(t.x-m.x,t.y-m.y)<36){ m.triggered=true; m.fuse=Math.min(m.fuse,0.45); break; }
    }
    if(m.triggered||m.fuse<2.2){ m.bt-=dt; if(m.bt<=0){ m.bt=m.triggered?0.09:0.3; play('beep',m.x); } }
    if(m.fuse<=0){ m.dead=true; explode(m.x,m.y,m.owner); }
  }
  // cajas de municion triple
  for(const k of crates){
    if(k.taken) continue;
    if(!k.landed){
      k.vz-=950*dt; k.z+=k.vz*dt;
      if(k.z<=0){ k.z=0; if(k.vz<-140){ k.vz=-k.vz*0.35; play('land',k.x); chips(k.x,k.y,4,['#ffc845','#d2771c']); } else { k.vz=0; k.landed=true; } }
      continue;
    }
    for(const t of tanks){
      if(t.alive&&Math.hypot(t.x-k.x,t.y-k.y)<24){
        k.taken=true; t.triple=12;
        for(let i=0;i<14;i++){ const a=i/14*TAU; P(k.x,k.y,Math.cos(a)*120,Math.sin(a)*120,0.45,3,pick(['#ffe14d','#ff3b4a','#ffffff']),'spark'); }
        P(k.x,k.y,0,0,0.4,30,'#ffe14d','ring');
        addFeed('<b style="color:'+t.dark+'">'+t.name+'</b> tiene MUNICION TRIPLE');
        play('pickup',k.x);
        break;
      }
    }
  }
  if(bullets.some(b=>b.dead)) bullets=bullets.filter(b=>!b.dead);
  if(mines.some(m=>m.dead)) mines=mines.filter(m=>!m.dead);
  if(crates.some(k=>k.taken)) crates=crates.filter(k=>!k.taken);
  // particulas
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.life-=dt;
    if(p.life<=0){ particles[i]=particles[particles.length-1]; particles.pop(); continue; }
    p.x+=p.vx*dt; p.y+=p.vy*dt;
    if(p.type==='chip'){
      p.vz-=520*dt; p.z+=p.vz*dt; p.rot+=p.vr*dt;
      if(p.z<0){ p.z=0; p.vz*=-0.4; p.vx*=0.6; p.vy*=0.6; p.vr*=0.5; }
    } else if(p.type==='fire'||p.type==='smoke'){ p.vx*=1-2.5*dt; p.vy*=1-2.5*dt; if(p.type==='smoke') p.vy-=10*dt; }
  }
  shake=Math.max(0,shake-dt*28);
  trackFadeT+=dt;
  if(trackFadeT>0.25){
    trackFadeT=0;
    tctx.setTransform(1,0,0,1,0,0);
    tctx.globalCompositeOperation='destination-out';
    tctx.fillStyle='rgba(0,0,0,0.035)'; tctx.fillRect(0,0,trackCv.width,trackCv.height);
    tctx.globalCompositeOperation='source-over';
  }
  if(roundOver){ roundTimer-=dt; if(roundTimer<=0) newRound(); }
}

/* =====================================================================
   RENDER 2.5D
   ===================================================================== */
const drawList=[];
function drawTankShadow(t){
  ctx.save(); ctx.translate(t.x+5,t.y+5); ctx.rotate(t.angle);
  ctx.fillStyle='rgba(95,55,15,.26)'; rr(ctx,-17,-14,34,28,9); ctx.fill();
  ctx.restore();
}
function drawTank(t){
  const x=t.x, y=t.y-TANK_LIFT;
  ctx.save(); ctx.translate(x,y+3); ctx.rotate(t.angle);
  ctx.fillStyle='#363a55'; rr(ctx,-16,-13.5,32,27,6); ctx.fill();
  ctx.restore();
  ctx.save(); ctx.translate(x,y); ctx.rotate(t.angle);
  for(const sd of [-1,1]){
    const ty=sd>0?6:-13;
    ctx.fillStyle='#4a4f6e'; rr(ctx,-16,ty,32,7,3.5); ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.38)'; ctx.lineWidth=1.2; ctx.beginPath();
    const ph=((t.tread%5)+5)%5;
    for(let k=-15+ph;k<15;k+=5){ ctx.moveTo(k,ty+1); ctx.lineTo(k,ty+6); }
    ctx.stroke();
  }
  ctx.fillStyle=t.dark; rr(ctx,-14,-9.5,28,19,5); ctx.fill();
  const g=ctx.createLinearGradient(0,-9,0,9); g.addColorStop(0,t.light); g.addColorStop(0.45,t.color); g.addColorStop(1,t.color);
  ctx.fillStyle=g; rr(ctx,-13,-8.5,26,16.5,4.5); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.4)'; rr(ctx,-11,-7,17,3.5,1.8); ctx.fill();
  ctx.fillStyle=t.light; rr(ctx,9.5,-6,3.5,12,1.8); ctx.fill();
  ctx.restore();
  ctx.save(); ctx.translate(x,y-1.5); ctx.rotate(t.turret);
  const rec=t.recoil*4;
  ctx.fillStyle=t.dark; rr(ctx,2-rec,-3.2,21,6.4,2.5); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.3)'; ctx.fillRect(4-rec,-2.4,16,1.3);
  ctx.fillStyle=t.light; rr(ctx,19-rec,-3.9,5.5,7.8,2); ctx.fill();
  ctx.fillStyle=t.dark; ctx.beginPath(); ctx.arc(0,0,8.8,0,TAU); ctx.fill();
  const g2=ctx.createRadialGradient(-2.5,-2.5,1,0,0,8); g2.addColorStop(0,t.light); g2.addColorStop(1,t.color);
  ctx.fillStyle=g2; ctx.beginPath(); ctx.arc(0,0,7.4,0,TAU); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.55)'; ctx.beginPath(); ctx.arc(-2.5,-2.5,2.4,0,TAU); ctx.fill();
  ctx.restore();
  if(t.triple>0){
    ctx.save(); ctx.translate(x,y); ctx.rotate(gameTime*3);
    ctx.strokeStyle=(t.triple<3&&((gameTime*8)|0)%2)?'rgba(255,225,77,.3)':'#ffe14d';
    ctx.lineWidth=2.4; ctx.setLineDash([5,5]); ctx.beginPath(); ctx.arc(0,0,21,0,TAU); ctx.stroke(); ctx.setLineDash([]);
    ctx.restore();
  }
}
function drawBullet(b){
  const tr=b.trail;
  if(tr.length>=4){
    ctx.strokeStyle=b.color; ctx.globalAlpha=0.45; ctx.lineWidth=3; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(tr[0],tr[1]-6);
    for(let i=2;i<tr.length;i+=2) ctx.lineTo(tr[i],tr[i+1]-6);
    ctx.stroke(); ctx.globalAlpha=1;
  }
  ctx.save(); ctx.translate(b.x,b.y-6); ctx.rotate(Math.atan2(b.dy,b.dx));
  ctx.fillStyle='#ffffff'; rr(ctx,-5.5,-2.9,11,5.8,2.9); ctx.fill();
  ctx.strokeStyle=b.dark; ctx.lineWidth=1.3; ctx.stroke();
  ctx.fillStyle=b.color; rr(ctx,0.5,-2.9,5,5.8,2.9); ctx.fill();
  ctx.restore();
}
function drawCrate(k){
  const bobv=k.landed?Math.sin(gameTime*3+k.bob)*1.5:0;
  const x=k.x, y=k.y-k.z-4+bobv;
  ctx.fillStyle='#c96c14'; rr(ctx,-9+x,y-2,18,8,2.5); ctx.fill();
  const g=ctx.createLinearGradient(0,y-12,0,y+2); g.addColorStop(0,'#ffe07a'); g.addColorStop(1,'#ffbf2e');
  ctx.fillStyle=g; rr(ctx,x-9,y-13,18,14,3); ctx.fill();
  ctx.strokeStyle='#b8640f'; ctx.lineWidth=1.2; ctx.stroke();
  for(let i=-1;i<=1;i++){
    ctx.fillStyle='#ff3b4a'; rr(ctx,x+i*5-1.7,y-10.5,3.4,8,1.7); ctx.fill();
    ctx.fillStyle='#fff'; ctx.fillRect(x+i*5-0.7,y-9.5,1.2,2.5);
  }
  if(k.landed){
    ctx.strokeStyle='rgba(255,230,90,'+(0.45+0.35*Math.sin(gameTime*6+k.bob))+')'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(x,y-5,15,0,TAU); ctx.stroke();
  }
}
function drawMine(m){
  ctx.fillStyle='rgba(95,55,15,.25)'; ctx.beginPath(); ctx.ellipse(m.x+2,m.y+2.5,9.5,8,0,0,TAU); ctx.fill();
  ctx.fillStyle='#c99a00'; ctx.beginPath(); ctx.arc(m.x,m.y,9.5,0,TAU); ctx.fill();
  ctx.fillStyle='#ffd51f'; ctx.beginPath(); ctx.arc(m.x,m.y-1,8.5,0,TAU); ctx.fill();
  ctx.fillStyle='#6b5410';
  for(let i=0;i<4;i++){ const a=i*Math.PI/2+0.4; ctx.beginPath(); ctx.moveTo(m.x,m.y-1); ctx.arc(m.x,m.y-1,8.5,a,a+0.45); ctx.closePath(); ctx.fill(); }
  ctx.fillStyle='#ffd51f'; ctx.beginPath(); ctx.arc(m.x,m.y-1,4.6,0,TAU); ctx.fill();
  const rate=m.triggered?18:(m.fuse<2.2?8:2.5);
  const on=((gameTime*rate)|0)%2===0;
  ctx.fillStyle=on?'#ff2a2a':'#ffb3b3'; ctx.beginPath(); ctx.arc(m.x,m.y-1,2.8,0,TAU); ctx.fill();
  if(on){ ctx.fillStyle='rgba(255,60,60,.25)'; ctx.beginPath(); ctx.arc(m.x,m.y-1,7,0,TAU); ctx.fill(); }
  if(m.triggered){ ctx.strokeStyle='rgba(255,50,50,.8)'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(m.x,m.y,12+((gameTime*60)%14),0,TAU); ctx.stroke(); }
}
function drawParticles(){
  for(const p of particles){
    const k=1-p.life/p.max;
    if(p.type==='fire'){
      ctx.globalAlpha=Math.max(0,1-k); ctx.fillStyle=p.color;
      ctx.beginPath(); ctx.arc(p.x,p.y-8,p.size*(0.6+k*0.8),0,TAU); ctx.fill();
    } else if(p.type==='smoke'){
      ctx.globalAlpha=Math.max(0,0.6*(1-k)); ctx.fillStyle=p.color;
      ctx.beginPath(); ctx.arc(p.x,p.y-8,p.size*(1+k*1.6),0,TAU); ctx.fill();
    } else if(p.type==='spark'){
      ctx.globalAlpha=Math.max(0,1-k); ctx.strokeStyle=p.color; ctx.lineWidth=p.size; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(p.x,p.y-6); ctx.lineTo(p.x-p.vx*0.035,p.y-6-p.vy*0.035); ctx.stroke();
    } else if(p.type==='chip'){
      ctx.globalAlpha=Math.min(1,p.life*3); ctx.save(); ctx.translate(p.x,p.y-p.z); ctx.rotate(p.rot);
      ctx.fillStyle=p.color; ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*0.7); ctx.restore();
    } else if(p.type==='ring'){
      ctx.globalAlpha=Math.max(0,1-k); ctx.strokeStyle=p.color; ctx.lineWidth=4*(1-k)+1;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.size*(0.25+k*0.85),0,TAU); ctx.stroke();
    }
  }
  ctx.globalAlpha=1;
}
function strokeSegs(segs){
  ctx.beginPath();
  for(let i=0;i<segs.length;i++){ const s=segs[i]; if(i===0) ctx.moveTo(s.x1,s.y1); ctx.lineTo(s.x2,s.y2); }
  ctx.stroke();
}
function drawAimLines(){
  ctx.lineCap='round';
  for(const t of tanks){
    if(!t.alive) continue;
    const dx=Math.cos(t.turret), dy=Math.sin(t.turret);
    const r=castPath(grid,t.x+dx*BARREL,t.y+dy*BARREL,dx,dy,1,440,null);
    if(!r.segs.length) continue;
    ctx.setLineDash([3,6]); ctx.lineWidth=2;
    ctx.strokeStyle=t.dark; ctx.globalAlpha=0.7; strokeSegs([r.segs[0]]);
    if(r.segs[1]){ ctx.globalAlpha=0.25; strokeSegs([r.segs[1]]); }
    ctx.globalAlpha=1; ctx.setLineDash([]);
  }
}
function drawLasers(){
  ctx.lineCap='round'; ctx.lineJoin='round';
  for(const b of bullets){
    const r=castPath(grid,b.x,b.y,b.dx,b.dy,b.bouncesLeft,520,null);
    ctx.setLineDash([2,5]); ctx.lineWidth=1.5; ctx.strokeStyle=b.color; ctx.globalAlpha=0.75; strokeSegs(r.segs);
  }
  ctx.setLineDash([]); ctx.globalAlpha=1;
  for(const m of mines){
    ctx.setLineDash([4,5]); ctx.strokeStyle='rgba(255,170,0,.65)'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(m.x,m.y,BLAST_R,0,TAU); ctx.stroke(); ctx.setLineDash([]);
  }
  for(const t of tanks){
    if(!t.alive) continue;
    if(!t.human&&t.ctl.plan){ ctx.setLineDash([1,6]); ctx.lineWidth=2; ctx.strokeStyle='rgba(255,255,255,.85)'; strokeSegs(t.ctl.plan); ctx.setLineDash([]); }
    const dx=Math.cos(t.turret), dy=Math.sin(t.turret);
    const r=castPath(grid,t.x+dx*BARREL,t.y+dy*BARREL,dx,dy,MAX_BOUNCES,1400,tanks,15);
    if(!r.segs.length) continue;
    ctx.globalAlpha=0.3; ctx.strokeStyle=t.color; ctx.lineWidth=8; strokeSegs(r.segs);
    ctx.globalAlpha=1; ctx.strokeStyle=t.color; ctx.lineWidth=2.6; strokeSegs(r.segs);
    ctx.strokeStyle='rgba(255,255,255,.9)'; ctx.lineWidth=1; strokeSegs(r.segs);
    for(let i=0;i<r.segs.length-1;i++){
      const s=r.segs[i];
      ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(s.x2,s.y2,4.2,0,TAU); ctx.fill();
      ctx.strokeStyle=t.dark; ctx.lineWidth=1.6; ctx.stroke();
    }
    if(r.end==='tank'&&r.tank!==t){
      const pul=1+0.15*Math.sin(gameTime*12);
      ctx.strokeStyle='#ff2d55'; ctx.lineWidth=2.5;
      ctx.beginPath(); ctx.arc(r.tank.x,r.tank.y-TANK_LIFT,20*pul,0,TAU); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(r.tank.x-26,r.tank.y-TANK_LIFT); ctx.lineTo(r.tank.x-14,r.tank.y-TANK_LIFT); ctx.moveTo(r.tank.x+14,r.tank.y-TANK_LIFT); ctx.lineTo(r.tank.x+26,r.tank.y-TANK_LIFT);
      ctx.moveTo(r.tank.x,r.tank.y-TANK_LIFT-26); ctx.lineTo(r.tank.x,r.tank.y-TANK_LIFT-14); ctx.moveTo(r.tank.x,r.tank.y-TANK_LIFT+14); ctx.lineTo(r.tank.x,r.tank.y-TANK_LIFT+26); ctx.stroke();
    }
  }
  ctx.font='bold 8.5px "Trebuchet MS",sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  for(const t of tanks){
    if(!t.alive) continue;
    const label=t.human?'MANUAL':(t.pers.label.toUpperCase()+' | '+t.ctl.mode);
    const w=ctx.measureText(label).width+10, x=t.x, y=t.y+28;
    ctx.fillStyle='rgba(255,255,255,.92)'; rr(ctx,x-w/2,y-6.5,w,13,6.5); ctx.fill();
    ctx.strokeStyle=t.color; ctx.lineWidth=1.4; ctx.stroke();
    ctx.fillStyle=t.dark; ctx.fillText(label,x,y+0.5);
  }
}
function drawPlayerMarker(){
  const t=tanks[0]; if(!t.alive) return;
  const x=t.x, y=t.y-TANK_LIFT-26+Math.sin(gameTime*5)*2;
  const label=t.human?'TU':'IA';
  ctx.fillStyle='#ffffff'; rr(ctx,x-13,y-9,26,14,7); ctx.fill();
  ctx.strokeStyle=t.color; ctx.lineWidth=2; ctx.stroke();
  ctx.fillStyle=t.color; ctx.beginPath(); ctx.moveTo(x-4,y+5); ctx.lineTo(x+4,y+5); ctx.lineTo(x,y+10); ctx.closePath(); ctx.fill();
  ctx.font='bold 9px "Trebuchet MS",sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle=t.dark; ctx.fillText(label,x,y-1.5);
}
function render(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,cv.width,cv.height);
  const sx=(Math.random()*2-1)*shake*0.6, sy=(Math.random()*2-1)*shake*0.6;
  ctx.setTransform(ps,0,0,ps,(view.ox+sx*view.s)*dpr,(view.oy+sy*view.s)*dpr);
  const ex=W+2*(FR+FM), ey=H+2*(FR+FM)+14;
  ctx.drawImage(floorCv,-FR-FM,-FR-FM,ex,ey);
  // brillos animados de charcos
  ctx.strokeStyle='rgba(255,255,255,.6)'; ctx.lineWidth=1.2; ctx.beginPath();
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    if(grid[r*COLS+c]!==PIT) continue;
    const ph=gameTime*2+c*1.7+r*0.9, ox=Math.sin(ph)*5;
    ctx.moveTo(c*T+12+ox,r*T+T*0.75); ctx.lineTo(c*T+20+ox,r*T+T*0.75);
    ctx.moveTo(c*T+22-ox,r*T+T*0.3); ctx.lineTo(c*T+28-ox,r*T+T*0.3);
  }
  ctx.stroke();
  ctx.drawImage(trackCv,0,0,W,H);
  for(const d of decals){
    ctx.save(); ctx.translate(d.x,d.y); ctx.rotate(d.a);
    ctx.fillStyle='rgba(110,60,20,.28)'; ctx.beginPath(); ctx.arc(0,0,20,0,TAU); ctx.fill();
    ctx.strokeStyle=d.dark; ctx.globalAlpha=0.75; ctx.lineWidth=5; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(-10,-10); ctx.lineTo(10,10); ctx.moveTo(10,-10); ctx.lineTo(-10,10); ctx.stroke();
    ctx.globalAlpha=1; ctx.restore();
  }
  // sombras de bloques
  ctx.fillStyle='rgba(120,70,20,.22)'; ctx.beginPath();
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){ const v=grid[r*COLS+c]; if(v===WOOD||v===CORK) ctx.rect(c*T+8,r*T+4,T,T); }
  ctx.fill();
  for(const k of crates){ const s=1/(1+k.z/90); ctx.fillStyle='rgba(95,55,15,'+(0.25*s)+')'; ctx.beginPath(); ctx.ellipse(k.x+3,k.y+4,12*s,8*s,0,0,TAU); ctx.fill(); }
  for(const t of tanks) if(t.alive) drawTankShadow(t);
  ctx.fillStyle='rgba(95,55,15,.22)';
  for(const b of bullets){ ctx.beginPath(); ctx.ellipse(b.x+3,b.y+3,4,3,0,0,TAU); ctx.fill(); }
  if(!billiard) drawAimLines();
  for(const m of mines) drawMine(m);
  // orden por profundidad
  drawList.length=0;
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){ const v=grid[r*COLS+c]; if(v===WOOD||v===CORK) drawList.push({k:(r+1)*T-0.5,ty:0,c,r,v}); }
  for(const t of tanks) if(t.alive) drawList.push({k:t.y+TANK_R,ty:1,o:t});
  for(const k of crates) drawList.push({k:k.y+8,ty:2,o:k});
  for(const b of bullets) drawList.push({k:b.y,ty:3,o:b});
  drawList.sort((a,b)=>a.k-b.k);
  for(const d of drawList){
    if(d.ty===0){
      const spr=d.v===WOOD?sprites.wood:sprites.cork[Math.max(1,corkHp[d.r*COLS+d.c])];
      ctx.drawImage(spr,d.c*T-1,d.r*T-LIFT-1,T+2,T+LIFT+2);
    } else if(d.ty===1) drawTank(d.o);
    else if(d.ty===2) drawCrate(d.o);
    else drawBullet(d.o);
  }
  drawParticles();
  if(billiard) drawLasers();
  drawPlayerMarker();
}

/* =====================================================================
   HUD
   ===================================================================== */
const hudEl=document.getElementById('hud'), barEl=document.getElementById('bar'), feedEl=document.getElementById('feed'), bannerEl=document.getElementById('banner');
const cardsEl=document.getElementById('cards');
function tankSVG(d){
  return '<svg width="38" height="30" viewBox="0 0 40 32"><rect x="2" y="3" width="30" height="7" rx="3.5" fill="#4a4f6e"/><rect x="2" y="22" width="30" height="7" rx="3.5" fill="#4a4f6e"/><rect x="4" y="8" width="26" height="16" rx="5" fill="'+d.color+'"/><circle cx="16" cy="16" r="6.5" fill="'+d.light+'" stroke="'+d.dark+'" stroke-width="2"/><rect x="19" y="14" width="19" height="4.5" rx="2" fill="'+d.dark+'"/></svg>';
}
cardsEl.innerHTML=TANK_DEFS.map((d,i)=>'<div class="card panel" id="card'+i+'" style="--c:'+d.color+';--d:'+d.dark+'">'+tankSVG(d)+
  '<div><div class="cname">'+d.name+(i===0?' <em id="youTag">PILOTO IA</em>':'')+'</div><div class="cstat" id="st'+i+'">EN JUEGO</div></div>'+
  '<div class="cnum"><div><small>BAJAS</small><b id="k'+i+'">0</b></div><div><small>VICT.</small><b id="w'+i+'">0</b></div></div></div>').join('');
const cardEls=[],stEls=[],kEls=[],wEls=[];
for(let i=0;i<4;i++){ cardEls.push(document.getElementById('card'+i)); stEls.push(document.getElementById('st'+i)); kEls.push(document.getElementById('k'+i)); wEls.push(document.getElementById('w'+i)); }
const sSurv=document.getElementById('sSurv'), sKills=document.getElementById('sKills'), sRound=document.getElementById('sRound'), sMap=document.getElementById('sMap'), sFps=document.getElementById('sFps');
const youTag=document.getElementById('youTag'), pilotTxt=document.getElementById('pilotTxt'), bPilot=document.getElementById('bPilot'), bLaser=document.getElementById('bLaser');
let fpsShown=60;
function updateHUD(){
  let alive=0, kills=0, maxW=0;
  for(const t of tanks){ if(t.alive) alive++; kills+=t.kills; maxW=Math.max(maxW,t.wins); }
  tanks.forEach((t,i)=>{
    cardEls[i].classList.toggle('dead',!t.alive);
    cardEls[i].classList.toggle('win',maxW>0&&t.wins===maxW);
    stEls[i].textContent=t.alive?(t.triple>0?'MUNICION TRIPLE':(t.human?'EN JUEGO | MANUAL':'EN JUEGO | '+t.pers.label.toUpperCase())):'FUERA DE COMBATE';
    kEls[i].textContent=t.kills; wEls[i].textContent=t.wins;
  });
  sSurv.textContent=alive+'/4'; sKills.textContent=kills; sRound.textContent=roundNum;
  sMap.textContent=layoutIdx>=0?LAYOUTS[layoutIdx].name:'-';
  sFps.textContent=fpsShown;
  const h=tanks[0].human;
  youTag.textContent=h?'TU MANDAS':'PILOTO IA';
  pilotTxt.textContent=h?'Piloto IA: APAGADO (activar)':'Piloto IA: ACTIVO';
  bPilot.classList.toggle('off',h);
  bLaser.classList.toggle('on',billiard);
}
let bannerTimer=null;
function showBanner(text,color,secs){
  bannerEl.textContent=text; bannerEl.style.setProperty('--bc',color);
  bannerEl.classList.add('show');
  if(bannerTimer) clearTimeout(bannerTimer);
  bannerTimer=setTimeout(()=>bannerEl.classList.remove('show'),(secs||2)*1000);
}
function addFeed(html){
  const el=document.createElement('div'); el.className='fe'; el.innerHTML=html;
  feedEl.prepend(el);
  while(feedEl.children.length>5) feedEl.removeChild(feedEl.lastChild);
  setTimeout(()=>el.classList.add('out'),4200);
  setTimeout(()=>{ if(el.parentNode) el.parentNode.removeChild(el); },4800);
}

/* =====================================================================
   ENTRADA
   ===================================================================== */
function takeControl(){
  if(!tanks[0].human){ tanks[0].human=true; updateHUD(); }
}
function toWorld(cx,cy){ input.wx=(cx-view.ox)/view.s; input.wy=(cy-view.oy)/view.s; input.has=true; }
const KEYMAP={KeyW:'u',ArrowUp:'u',KeyS:'d',ArrowDown:'d',KeyA:'l',ArrowLeft:'l',KeyD:'r',ArrowRight:'r'};
window.addEventListener('keydown',e=>{
  audioInit();
  const k=KEYMAP[e.code];
  if(k){ keys[k]=true; takeControl(); e.preventDefault(); return; }
  if(e.code==='Space'){ e.preventDefault(); if(!e.repeat){ takeControl(); input.mineReq=true; } return; }
  if(e.repeat) return;
  if(e.code==='KeyL') toggleLaser();
  else if(e.code==='KeyC') dropCratesBtn();
  else if(e.code==='KeyR') restartBattle();
  else if(e.code==='KeyP') togglePilot();
});
window.addEventListener('keyup',e=>{ const k=KEYMAP[e.code]; if(k) keys[k]=false; });
window.addEventListener('blur',()=>{ keys.u=keys.d=keys.l=keys.r=false; input.fire=false; });
document.addEventListener('pointerdown',()=>audioInit(),true);
cv.addEventListener('mousemove',e=>toWorld(e.clientX,e.clientY));
cv.addEventListener('mousedown',e=>{
  audioInit(); toWorld(e.clientX,e.clientY); takeControl();
  if(e.button===2) input.mineReq=true; else if(e.button===0) input.fire=true;
});
window.addEventListener('mouseup',e=>{ if(e.button===0) input.fire=false; });
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('touchstart',e=>{ e.preventDefault(); audioInit(); const t=e.touches[0]; toWorld(t.clientX,t.clientY); takeControl(); input.touch=true; input.fire=true; },{passive:false});
cv.addEventListener('touchmove',e=>{ e.preventDefault(); const t=e.touches[0]; toWorld(t.clientX,t.clientY); },{passive:false});
cv.addEventListener('touchend',e=>{ e.preventDefault(); if(e.touches.length===0){ input.touch=false; input.fire=false; } },{passive:false});

function toggleLaser(){ billiard=!billiard; updateHUD(); }
function dropCratesBtn(){ dropCrates(4,false); addFeed('<b style="color:#c96c14">Cajas de MUNICION TRIPLE</b> en camino'); }
function togglePilot(){ tanks[0].human=!tanks[0].human; if(!tanks[0].human){ tanks[0].mem={}; input.fire=false; } updateHUD(); }
bLaser.addEventListener('click',toggleLaser);
document.getElementById('bCrates').addEventListener('click',dropCratesBtn);
document.getElementById('bReset').addEventListener('click',restartBattle);
bPilot.addEventListener('click',togglePilot);

/* =====================================================================
   RESIZE (usa window.devicePixelRatio)
   ===================================================================== */
function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  vw=window.innerWidth; vh=window.innerHeight;
  cv.width=Math.round(vw*dpr); cv.height=Math.round(vh*dpr);
  const top=hudEl.offsetHeight+8, bot=barEl.offsetHeight+8;
  const availW=vw-16, availH=Math.max(140,vh-top-bot);
  const totW=W+2*FR, totH=H+2*FR+12;
  view.s=Math.max(0.2,Math.min(availW/totW,availH/totH));
  view.ox=(vw-W*view.s)/2;
  view.oy=top+(availH-totH*view.s)/2+FR*view.s;
  ps=view.s*dpr;
  feedEl.style.top=(top+4)+'px';
  buildSprites(); buildFloor();
}
window.addEventListener('resize',resize);

/* =====================================================================
   BUCLE PRINCIPAL
   ===================================================================== */
let last=performance.now(), fpsFrames=0, fpsTime=0, hudT=0;
function frame(now){
  requestAnimationFrame(frame);
  const raw=(now-last)/1000; last=now;
  fpsFrames++; fpsTime+=raw;
  if(fpsTime>=0.5){ fpsShown=Math.round(fpsFrames/fpsTime); fpsFrames=0; fpsTime=0; }
  const dt=clamp(raw,0.001,0.05);
  update(dt);
  render();
  hudT-=raw; if(hudT<=0){ hudT=0.25; updateHUD(); }
}
resize();
newRound();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
