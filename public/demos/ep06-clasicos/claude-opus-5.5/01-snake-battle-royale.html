<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#43c8f5;font-family:"Trebuchet MS","Arial Rounded MT Bold","Segoe UI",Verdana,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none;color:#1b2a5e}

.panel{background:rgba(255,255,255,.95);border:3px solid #1b2a5e;border-radius:16px;box-shadow:0 5px 0 #1b2a5e,0 12px 26px rgba(20,40,90,.25)}
#topLeft{position:absolute;top:14px;left:14px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
#brand{display:flex;align-items:center;gap:10px;padding:8px 16px 8px 10px}
#brand svg{width:46px;height:46px;flex:none}

#brand .sub{font-size:11px;font-weight:700;color:#1b2a5e;opacity:.75;margin-top:4px;letter-spacing:.5px}
.pill{display:flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;border:3px solid #1b2a5e;font-weight:900;font-size:12.5px;box-shadow:0 4px 0 #1b2a5e;background:#ffd23f;color:#1b2a5e;max-width:420px}
.pill .dot{width:10px;height:10px;border-radius:50%;background:#ff3b5c;box-shadow:0 0 0 3px rgba(255,59,92,.3);animation:blink 1s infinite;flex:none}
.pill.ai{animation:wiggle 2.4s ease-in-out infinite}
.pill.manual{background:#5ef08a}
.pill.manual .dot{background:#2f7bff;box-shadow:0 0 0 3px rgba(47,123,255,.3)}
@keyframes blink{50%{opacity:.25}}
@keyframes wiggle{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
#board{position:absolute;top:14px;right:14px;width:292px;padding:10px 12px 9px}
#board .bh{display:flex;align-items:center;gap:8px;font-weight:900;font-size:14px;letter-spacing:.5px;margin-bottom:6px}
#board .bh svg{width:22px;height:22px}
#board .live{margin-left:auto;background:#ff3b5c;color:#fff;font-size:10px;padding:2px 8px;border-radius:999px;animation:blink 1.2s infinite}
.cols,.row{display:grid;grid-template-columns:24px 1fr 58px 42px;align-items:center;gap:6px}

.row.me{background:#e6efff;box-shadow:inset 0 0 0 2px #2f7bff}
.row.dead{opacity:.55}
.row .rk{width:22px;height:22px;border-radius:50%;background:#1b2a5e;color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center}

#feed{position:absolute;top:14px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px}

.fi.out{opacity:0;transform:translateY(-10px)}
@keyframes fin{from{transform:scale(.4);opacity:0}}
#banner{position:absolute;top:24%;left:50%;transform:translate(-50%,-50%) scale(0);font-size:44px;font-weight:900;color:var(--c,#ff3fa4);white-space:nowrap;letter-spacing:1px;opacity:0;
 text-shadow:3px 0 0 #fff,-3px 0 0 #fff,0 3px 0 #fff,0 -3px 0 #fff,3px 3px 0 #fff,-3px -3px 0 #fff,3px -3px 0 #fff,-3px 3px 0 #fff,0 8px 0 #1b2a5e}

#respawn{position:absolute;left:50%;top:62%;transform:translate(-50%,-50%);padding:12px 28px;background:#fff;border:4px solid #1b2a5e;border-radius:20px;box-shadow:0 6px 0 #1b2a5e;font-weight:900;font-size:26px;color:#ff3b5c;display:none;text-align:center}

kbd{display:inline-block;background:#1b2a5e;color:#fff;border-radius:5px;padding:1px 6px;font-family:inherit;font-size:10.5px;margin:0 2px}

 #board{width:214px;padding:8px}.row{font-size:12px}.cols,.row{grid-template-columns:20px 1fr 44px 32px}

 .btn{font-size:12px;padding:8px 10px}.btn.gold{font-size:12px;padding:9px 12px}
 #banner{font-size:24px}
}

<script>
/* =====================================================================
   CEREBRO IA EXPORTABLE  -  window.MIXIUH_BRAIN
   ---------------------------------------------------------------------
   decide(state) -> { angle, boost, mode, tx, ty, look }
   state = {
     self:   { id, x, y, angle, speed, baseSpeed, radius, length, bodyLength,
               turnRate, boosting, alive, ghost, aggro?, body:[{x,y}, ...] },
     snakes: [ objetos con el mismo formato (incluye a self) ],
     foods:  [ { x, y, r, v, type(0 manzana,1 estrella,2 capsula,3 orbe,4 gigante,5 dorada),
               z, eaten, gone } ],
     arena:  { w, h },
     time:   segundos
   }
   Estrategia: sensores de rayos analiticos (28 direcciones) contra cuerpos
   rivales + muros + proyeccion de cabezas rivales; busqueda de racimos de
   fruta en rejilla; EMBOSCADA con turbo (cruzar frente a la cabeza rival);
   CICLO (enroscarse alrededor de rivales pequenos); ESCAPE si hay encierro.
   ===================================================================== */
window.MIXIUH_BRAIN = (function(){
  'use strict';
  const TAU=Math.PI*2, PI=Math.PI, NC=28, CAP=6000, CELL=200;
  const OX=new Float32Array(CAP), OY=new Float32Array(CAP), OR=new Float32Array(CAP);
  const cAng=new Float32Array(NC), cFree=new Float32Array(NC);
  const mem=new Map();
  let on=0, grid=null, gc=0, gr=0;
  const cl=(v,a,b)=>v<a?a:(v>b?b:v);
  function wrap(a){a%=TAU;if(a>PI)a-=TAU;else if(a<-PI)a+=TAU;return a;}
  function idx(off){return ((Math.round((wrap(off)+PI)/TAU*NC))%NC+NC)%NC;}
  function ray(hx,hy,ux,uy,R,maxD,aw,ah){
    let free=maxD; const m=R+3;
    if(ux>1e-6){const t=(aw-m-hx)/ux;if(t<free)free=t;}else if(ux<-1e-6){const t=(m-hx)/ux;if(t<free)free=t;}
    if(uy>1e-6){const t=(ah-m-hy)/uy;if(t<free)free=t;}else if(uy<-1e-6){const t=(m-hy)/uy;if(t<free)free=t;}
    for(let i=0;i<on;i++){
      const vx=OX[i]-hx, vy=OY[i]-hy, t=vx*ux+vy*uy;
      if(t<=0) continue;
      const rr=OR[i]+R+6; if(t-rr>free) continue;
      const pp=vx*uy-vy*ux, p2=pp*pp, r2=rr*rr;
      if(p2>=r2) continue;
      const hit=t-Math.sqrt(r2-p2); if(hit<free) free=hit;
    }
    return free>0?free:0;
  }
  function rival(o,me){return o&&o!==me&&o.id!==me.id&&o.alive&&!(o.ghost>0);}

  function decide(state){
    const me=state&&state.self;
    const out={angle:me?me.angle:0,boost:false,mode:'COMIDA',tx:me?me.x:0,ty:me?me.y:0,look:me?me.angle:0};
    if(!me||!me.alive) return out;
    const aw=state.arena?state.arena.w:3200, ah=state.arena?state.arena.h:2200;
    const snakes=state.snakes||[], foods=state.foods||[];
    const hx=me.x, hy=me.y, R=me.radius||16, myLen=me.length||10;
    const sp=me.speed||200, base=me.baseSpeed||sp, aggro=(me.aggro!=null)?me.aggro:0.6;
    const now=state.time||0;
    let m=mem.get(me.id);
    if(!m){m={target:null,coilDir:1,cd:0,lastT:now,lastMode:'',hold:0,ambT:0};mem.set(me.id,m);}
    const dtm=Math.min(0.1,Math.max(0,now-m.lastT)); m.lastT=now;
    if(m.cd>0)m.cd-=dtm; if(m.hold>0)m.hold-=dtm;
    const SENSE=360+R*8;

    /* --- obstaculos cercanos (prefiltro) --- */
    on=0;
    for(let s=0;s<snakes.length;s++){
      const o=snakes[s]; if(!rival(o,me)) continue;
      const b=o.body||[], orad=o.radius||16;
      for(let i=0;i<b.length&&on<CAP-8;i++){
        const p=b[i], dx=p.x-hx, dy=p.y-hy;
        if(dx>SENSE||dx<-SENSE||dy>SENSE||dy<-SENSE) continue;
        OX[on]=p.x;OY[on]=p.y;OR[on]=orad;on++;
      }
      const dx=o.x-hx, dy=o.y-hy;
      if(dx*dx+dy*dy<SENSE*SENSE*1.4&&on<CAP-4){
        const ca=Math.cos(o.angle), sa=Math.sin(o.angle), os=o.speed||base;
        for(let k=1;k<=3;k++){const la=os*0.17*k;OX[on]=o.x+ca*la;OY[on]=o.y+sa*la;OR[on]=orad*(1+0.22*k);on++;}
      }
    }

    /* --- sensores de rayos --- */
    let open=0, bestOpenA=me.angle, bestOpenS=-1e9;
    for(let k=0;k<NC;k++){
      const off=-PI+k*TAU/NC, a=me.angle+off;
      cAng[k]=a;
      const f=ray(hx,hy,Math.cos(a),Math.sin(a),R,SENSE,aw,ah);
      cFree[k]=f;
      if(f>SENSE*0.55) open++;
      const os=f-Math.abs(off)*55;
      if(os>bestOpenS){bestOpenS=os;bestOpenA=a;}
    }
    const caution=1.15-aggro*0.3;
    const safe=(R*1.5+sp*0.34+12)*caution;
    const fwd=cFree[NC>>1];
    let desired=null, boost=false, mode='COMIDA', tx=hx, ty=hy;

    /* 1) ESCAPE */
    const trapped=open/NC<0.28;
    if(trapped||fwd<safe*0.9){
      mode='ESCAPE'; desired=bestOpenA;
      tx=hx+Math.cos(desired)*220; ty=hy+Math.sin(desired)*220;
      if(trapped&&myLen>26&&cFree[idx(bestOpenA-me.angle)]>SENSE*0.7) boost=true;
    }

    /* 2) EMBOSCADA: cruzar con turbo frente a la cabeza rival */
    if(desired===null&&m.cd<=0&&myLen>26){
      let best=null, bs=0; const range=420+aggro*240;
      for(let s=0;s<snakes.length;s++){
        const o=snakes[s]; if(!rival(o,me)) continue;
        const d=Math.hypot(o.x-hx,o.y-hy);
        if(d>range||d<R+o.radius+10) continue;
        const os=Math.max(80,o.speed||base);
        const lead=110+o.radius*3+os*0.3;
        const ix=o.x+Math.cos(o.angle)*lead, iy=o.y+Math.sin(o.angle)*lead;
        const mg=R*4+40;

/* ---------------- Estado global ---------------- */
const snakes=[], foods=[], parts=[], floats=[], DECOR=[];
const counts={apple:0,star:0,cap:0,gold:0};
const keys={};
const mouse={x:0,y:0,down:false,type:'mouse'};

function inView(x,y,m){return x>view.x0-m&&x<view.x1+m&&y>view.y0-m&&y<view.y1+m;}
function audible(x,y,isPlayer){
  if(silent||!Sfx.ctx||!Sfx.on) return 0;
  if(isPlayer) return 1;
  return inView(x,y,40)?0.35:0;
}

/* ---------------- Particulas y textos ---------------- */
function addPart(x,y,vx,vy,life,size,c,kind){
  if(parts.length>1600) return;
  parts.push({x:x,y:y,vx:vx,vy:vy,life:life,max:life,size:size,c:c,kind:kind,rot:Math.random()*TAU,vr:rand(-10,10)});
}
function burst(x,y,colors,n,speed,kind,life){
  if(!inView(x,y,200)) return;
  for(let i=0;i<n;i++){const a=Math.random()*TAU,s=rand(speed*0.3,speed);addPart(x,y,Math.cos(a)*s,Math.sin(a)*s,rand(life*0.6,life),rand(4,9),colors[(Math.random()*colors.length)|0],kind);}
}
function ring(x,y,c,size){if(inView(x,y,size))addPart(x,y,0,0,0.55,size,c,2);}
function floatText(x,y,t,c,size){
  if(silent||!inView(x,y,60)) return;
  if(floats.length>60) floats.shift();
  floats.push({x:x,y:y,t:t,c:c,life:1.1,max:1.1,size:size||18});
}
function updateParticles(dt){
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i]; p.life-=dt;
    if(p.life<=0){parts[i]=parts[parts.length-1];parts.pop();continue;}
    p.x+=p.vx*dt;p.y+=p.vy*dt;
    const d=Math.exp(-(p.kind===1?1.6:3)*dt);p.vx*=d;p.vy*=d;p.rot+=p.vr*dt;
  }
  for(let i=floats.length-1;i>=0;i--){floats[i].life-=dt;if(floats[i].life<=0)floats.splice(i,1);}
}

/* ---------------- Comida ---------------- */
function addFood(type,x,y,o){
  if(foods.length>=MAX_FOOD&&(type===FT.ORB||type===FT.APPLE)) return null;
  const f={type:type,x:x,y:y,r:10,v:1,z:0,vz:0,vx:0,vy:0,eaten:false,gone:false,et:0,eater:null,life:-1,
    ph:Math.random()*TAU,sc:0,spr:null,counted:true,landed:true,bounced:false};
  switch(type){
    case FT.APPLE: f.r=11;f.v=1;f.spr=SPR.apple;f.counted=false;counts.apple++;break;
    case FT.STAR: f.r=13;f.v=5;f.spr=SPR.star;f.counted=false;counts.star++;break;
    case FT.CAP: f.r=13;f.v=1;f.spr=SPR.cap;f.counted=false;counts.cap++;break;
    case FT.ORB: f.r=5.5;f.v=o.v;f.spr=o.snake.orbSpr;f.life=26;break;
    case FT.GIANT: f.r=o.r;f.v=o.v;f.spr=o.snake.giantSpr;f.life=38;break;
    case FT.GOLD: f.r=13;f.v=5;f.spr=SPR.gold;f.life=50;f.counted=false;counts.gold++;break;
  }
  if(o){
    if(o.vx) f.vx=o.vx; if(o.vy) f.vy=o.vy;
    if(o.z){f.z=o.z;f.landed=false;}
    if(o.vz){f.vz=o.vz;f.landed=false;}
    if(o.sc!==undefined) f.sc=o.sc;
  }
  foods.push(f); return f;
}
function releaseCount(f){
  if(f.counted) return; f.counted=true;
  if(f.type===FT.APPLE) counts.apple--; else if(f.type===FT.STAR) counts.star--;
  else if(f.type===FT.CAP) counts.cap--; else if(f.type===FT.GOLD) counts.gold--;
}
function removeFood(i){
  const f=foods[i]; releaseCount(f); f.gone=true;
  const last=foods.pop(); if(i<foods.length) foods[i]=last;
}
function spawnNatural(type){addFood(type,rand(90,AW-90),rand(90,AH-90));}
function landFx(f){
  if(!inView(f.x,f.y,40)) return;
  for(let i=0;i<5;i++){const a=Math.random()*TAU;addPart(f.x,f.y,Math.cos(a)*rand(60,160),Math.sin(a)*rand(60,160),0.45,rand(5,9),i%2?'#fff27a':'#ffffff',3);}
  const v=audible(f.x,f.y,false); if(v) Sfx.land(1);
}
function updateFoods(dt){
  let budget=4;
  while(counts.apple<TARGET.apple&&budget-->0) spawnNatural(FT.APPLE);
  if(counts.star<TARGET.star) spawnNatural(FT.STAR);
  if(counts.cap<TARGET.cap) spawnNatural(FT.CAP);
  for(let i=foods.length-1;i>=0;i--){
    const f=foods[i];
    if(f.eaten){
      f.et+=dt; const e=f.eater, k=Math.min(1,dt*20);
      f.x+=(e.x-f.x)*k; f.y+=(e.y-f.y)*k;
      if(f.et>=0.15) removeFood(i);
      continue;
    }
    if(f.sc<1) f.sc=Math.min(1,f.sc+dt*3.5);
    if(!f.landed){
      f.vz-=1500*dt; f.z+=f.vz*dt;
      if(f.z<=0){
        f.z=0;
        if(f.vz<-260){f.vz=-f.vz*0.38;if(f.type===FT.GOLD&&!f.bounced){f.bounced=true;landFx(f);}}
        else{f.vz=0;f.landed=true;}
      }
    }
    if(f.vx!==0||f.vy!==0){
      f.x+=f.vx*dt; f.y+=f.vy*dt;
      const d=Math.exp(-2.6*dt); f.vx*=d; f.vy*=d;
      if(Math.abs(f.vx)<4&&Math.abs(f.vy)<4){f.vx=0;f.vy=0;}
      f.x=clamp(f.x,f.r+4,AW-f.r-4); f.y=clamp(f.y,f.r+4,AH-f.r-4);
    }
    if(f.life>0){f.life-=dt;if(f.life<=0){removeFood(i);continue;}}
  }
}

/* ---------------- Serpiente ---------------- */
class Snake{
  constructor(id,pal){
    this.id=id; this.name=pal.name; this.color=pal.base; this.accent=pal.accent; this.dark=shade(pal.base,-.55);
    this.isPlayer=!!pal.player; this.aggro=pal.aggro;
    this.sprA=ballSprite(pal.base); this.sprB=ballSprite(pal.accent); this.glow=glowSprite(pal.base);
    this.orbSpr=orbSprite(pal.base);
    this.giantSpr=appleSprite(pal.base,shade(pal.base,-.42),'#3ccf4e',rgba(pal.base,.45),true);
    this.x=0;this.y=0;this.angle=0;this.targetAngle=0;this.lookAngle=0;this.lookTarget=0;
    this.speed=BASE_SPEED;this.baseSpeed=BASE_SPEED;
    this.len=60;this.radius=18;this.alive=false;this.ghost=0;this.respawnT=0;this.capT=0;
    this.boosting=false;this.wasBoost=false;this.dropT=0;this.trailT=0;
    this.kills=0;this.deaths=0;this.mode='COMIDA';this.tx=0;this.ty=0;
    this.path=[];this.body=[];this.pool=[];
    this.minX=0;this.maxX=0;this.minY=0;this.maxY=0;
    this.blinkT=rand(1,4);this.blink=0;this.tongueT=rand(1,3);this.tongue=0;
  }
  get length(){return this.len;}
  get bodyLength(){return bodyLenFor(this.len);}
  get turnRate(){return 4.5-Math.min(1.6,(this.radius-11)*0.075);}
  needPts(){return Math.ceil(this.bodyLength/SP)+3;}
  spawn(x,y,ang,len,backFn){
    this.x=x;this.y=y;this.angle=ang;this.targetAngle=ang;this.lookAngle=ang;this.lookTarget=ang;
    this.len=len;this.radius=radiusFor(len);this.speed=BASE_SPEED;this.alive=true;this.capT=0;
    this.boosting=false;this.wasBoost=false;this.dropT=0;
    this.path.length=0;
    const need=this.needPts();
    for(let i=1;i<=need;i++){
      const s=i*SP, p=backFn?backFn(s):{x:x-Math.cos(ang)*s,y:y-Math.sin(ang)*s};
      this.path.push({x:p.x,y:p.y});
    }
    this.sampleBody();
  }
  movePath(){
    const path=this.path, need=this.needPts();
    let p0=path[0], dx=this.x-p0.x, dy=this.y-p0.y, d=Math.hypot(dx,dy), guard=0;
    while(d>=SP&&guard++<60){
      const np=path.length>need?path.pop():{x:0,y:0};
      np.x=p0.x+dx/d*SP; np.y=p0.y+dy/d*SP;
      path.unshift(np); p0=np;
      dx=this.x-p0.x; dy=this.y-p0.y; d=Math.hypot(dx,dy);
    }
    if(path.length>need) path.length=need;
  }
  sampleBody(){
    const R=this.radius, gap=Math.max(5,R*0.55), path=this.path, hx=this.x, hy=this.y;
    const p0=path[0], d0=Math.hypot(hx-p0.x,hy-p0.y);
    const L=Math.min(this.bodyLength,d0+(path.length-1)*SP);
    const body=this.body, pool=this.pool;
    body.length=0;
    let minX=hx,maxX=hx,minY=hy,maxY=hy,j=0;
    for(let s=0;s<=L;s+=gap){
      let x,y;
      if(s<=d0){const t=d0>0?s/d0:0;x=hx+(p0.x-hx)*t;y=hy+(p0.y-hy)*t;}
      else{const k=(s-d0)/SP,i=k|0,f=k-i,a=path[i],b=path[i+1]||a;x=a.x+(b.x-a.x)*f;y=a.y+(b.y-a.y)*f;}
      let o=pool[j]; if(!o){o={x:0,y:0};pool[j]=o;}
      o.x=x;o.y=y;body.push(o);j++;
      if(x<minX)minX=x;else if(x>maxX)maxX=x;
      if(y<minY)minY=y;else if(y>maxY)maxY=y;
    }
    this.minX=minX;this.maxX=maxX;this.minY=minY;this.maxY=maxY;
  }
  update(dt){
    if(!this.alive){this.respawnT-=dt;if(this.respawnT<=0)respawnSnake(this);return;}
    if(this.ghost>0) this.ghost=Math.max(0,this.ghost-dt);
    if(this.capT>0) this.capT=Math.max(0,this.capT-dt);
    let want=false;
    if(this.isPlayer&&control!=='ai'){
      if(control==='keys'){
        const kx=((keys.ArrowRight||keys.KeyD)?1:0)-((keys.ArrowLeft||keys.KeyA)?1:0);
        const ky=((keys.ArrowDown||keys.KeyS)?1:0)-((keys.ArrowUp||keys.KeyW)?1:0);
        if(kx||ky) this.targetAngle=Math.atan2(ky,kx);
      } else {
        const wx=cam.x+(mouse.x-W/2)/cam.scale, wy=cam.y+(mouse.y-H/2)/cam.scale;
        const dx=wx-this.x, dy=wy-this.y;
        if(dx*dx+dy*dy>64) this.targetAngle=Math.atan2(dy,dx);
      }
      want=!!(keys.Space||uiTurbo||(control==='mouse'&&mouse.down&&mouse.type==='mouse'));
      this.mode='MANUAL'; this.lookTarget=this.targetAngle;
    } else {
      let o=null;
      try{o=brainDecide(this);}catch(e){o=null;}
      if(o&&isFinite(o.angle)){
        this.targetAngle=o.angle; want=!!o.boost; this.mode=o.mode||'IA';
        this.lookTarget=isFinite(o.look)?o.look:o.angle; this.tx=o.tx; this.ty=o.ty;
      }
      if(this.isPlayer&&(keys.Space||uiTurbo)) want=true;
    }
    const diff=wrapA(this.targetAngle-this.angle), mt=this.turnRate*dt*(this.boosting?0.9:1);
    this.angle=wrapA(this.angle+clamp(diff,-mt,mt));
    this.lookAngle=wrapA(this.lookAngle+wrapA(this.lookTarget-this.lookAngle)*Math.min(1,dt*10));
    const paid=want&&this.len>MIN_BOOST_LEN;
    this.boosting=this.capT>0||paid;
    if(this.boosting&&!this.wasBoost){const v=audible(this.x,this.y,this.isPlayer);if(v)Sfx.boost(v);}
    this.wasBoost=this.boosting;
    const ts=BASE_SPEED*(this.boosting?2:1)*(this.capT>0&&paid?1.15:1);
    this.speed+=(ts-this.speed)*Math.min(1,dt*7);
    this.x+=Math.cos(this.angle)*this.speed*dt;
    this.y+=Math.sin(this.angle)*this.speed*dt;
    if(paid&&this.capT<=0){
      this.dropT-=dt;
      if(this.dropT<=0){
        this.dropT=0.085; this.len=Math.max(10,this.len-0.55);
        const tl=this.body.length?this.body[this.body.length-1]:this;
        addFood(FT.ORB,tl.x+rand(-5,5),tl.y+rand(-5,5),{snake:this,v:0.42,sc:0.3});
      }
    } else this.dropT=Math.min(this.dropT,0.02);
    this.radius+=(radiusFor(this.len)-this.radius)*Math.min(1,dt*3);
    this.movePath(); this.sampleBody();
    if(this.boosting){
      this.trailT-=dt;
      if(this.trailT<=0){
        this.trailT=0.04;
        const tl=this.body[this.body.length-1];
        if(tl&&inView(tl.x,tl.y,60)){
          const rb=this.capT>0;
          addPart(tl.x,tl.y,rand(-50,50),rand(-50,50),0.5,rand(4,7),rb?RAINBOW[(Math.random()*RAINBOW.length)|0]:this.accent,rb?3:0);
        }
      }
    }
    this.blinkT-=dt; if(this.blinkT<=0){this.blink=0.14;this.blinkT=rand(2,5);} if(this.blink>0)this.blink-=dt;
    this.tongueT-=dt; if(this.tongueT<=0){this.tongue=0.35;this.tongueT=rand(1.5,4);} if(this.tongue>0)this.tongue-=dt;
  }
}

const BSTATE={self:null,snakes:snakes,foods:foods,arena:{w:AW,h:AH},time:0};
function brainDecide(s){
  const B=window.MIXIUH_BRAIN;

/* ---------------- Comer / chocar / morir ---------------- */
function eat(s,f){
  f.eaten=true; f.eater=s; f.et=0; releaseCount(f);
  s.len+=f.v;
  const v=audible(f.x,f.y,s.isPlayer);
  switch(f.type){
    case FT.STAR:
      floatText(f.x,f.y,'+5','#ff9500',24); burst(f.x,f.y,['#ffe14a','#ffffff','#ffb300'],10,220,3,0.6); if(v)Sfx.star(v);break;
    case FT.CAP:
      s.capT=4.5; floatText(f.x,f.y,'TURBO!','#00a8e8',22); burst(f.x,f.y,RAINBOW,12,240,3,0.6); if(v)Sfx.capsule(v);break;
    case FT.GOLD:
      floatText(f.x,f.y,'+5','#e0a000',22); burst(f.x,f.y,['#fff27a','#ffffff'],8,200,3,0.5); if(v)Sfx.star(v*0.8);break;
    case FT.GIANT:
      if(s.isPlayer) floatText(f.x,f.y,'+'+Math.max(1,Math.round(f.v)),s.color,18); if(v)Sfx.eat(v);break;
    default:
      if(v)Sfx.eat(v*0.8);
  }
}
function eatCheck(s,dt){
  const R=s.radius, hx=s.x, hy=s.y, reach=R+55;
  for(let i=0;i<foods.length;i++){
    const f=foods[i]; if(f.eaten||f.z>18) continue;
    const dx=f.x-hx; if(dx>reach||dx<-reach) continue;
    const dy=f.y-hy; if(dy>reach||dy<-reach) continue;
    const d2=dx*dx+dy*dy, er=R+f.r+5;
    if(d2<er*er) eat(s,f);
    else if(d2<reach*reach){const k=Math.min(1,dt*4.5)*0.6;f.x-=dx*k;f.y-=dy*k;}
  }
}
function collisions(){
  const dead=[];
  for(let ai=0;ai<snakes.length;ai++){
    const a=snakes[ai]; if(!a.alive||a.ghost>0) continue;
    const R=a.radius, w=R*0.55;
    if(a.x<w||a.x>AW-w||a.y<w||a.y>AH-w){dead.push([a,null]);continue;}
    for(let bi=0;bi<snakes.length;bi++){
      const b=snakes[bi]; if(b===a||!b.alive||b.ghost>0) continue;
      const m=R+b.radius;
      if(a.x<b.minX-m||a.x>b.maxX+m||a.y<b.minY-m||a.y>b.maxY+m) continue;
      const body=b.body, hr=R*0.72+b.radius*0.86, hr2=hr*hr;
      let hit=-1;
      for(let i=0;i<body.length;i++){const p=body[i],dx=p.x-a.x,dy=p.y-a.y;if(dx*dx+dy*dy<hr2){hit=i;break;}}
      if(hit<0) continue;
      if(hit<=1){
        if(a.len<b.len) dead.push([a,b]); else if(a.len>b.len) dead.push([b,a]); else {dead.push([a,b]);dead.push([b,a]);}
      } else dead.push([a,b]);
      break;
    }
  }
  const done=new Set();
  for(let i=0;i<dead.length;i++){
    const s=dead[i][0], k=dead[i][1];
    if(done.has(s)||!s.alive) continue;
    done.add(s); killSnake(s,k);
  }
}
function nameTag(s){return '<span style="color:'+s.color+'">'+s.name+'</span>';}
function killSnake(s,killer){
  s.alive=false; s.respawnT=2.0; s.deaths++; s.boosting=false;
  if(killer&&killer!==s) killer.kills++;
  const b=s.body, n=b.length;
  const total=Math.max(12,s.len*0.75), cnt=Math.min(70,Math.max(8,Math.ceil(n/2))), per=total/cnt;
  for(let j=0;j<cnt;j++){
    const p=b[Math.min(n-1,Math.floor(j/cnt*n))]||s, a=Math.random()*TAU, sp=rand(30,170);
    addFood(FT.GIANT,p.x+rand(-8,8),p.y+rand(-8,8),{snake:s,v:per,r:clamp(10+per*1.6,12,22),vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,vz:rand(260,560)});
  }
  for(let j=0;j<n;j+=4){const p=b[j];burst(p.x,p.y,[s.color,s.accent,'#ffffff','#ffd23f'],3,260,1,1.1);}
  burst(s.x,s.y,[s.color,s.accent,'#ffffff','#ffd23f'],26,420,1,1.3);
  ring(s.x,s.y,s.color,140); ring(s.x,s.y,'#ffffff',90);
  const v=audible(s.x,s.y,s.isPlayer||(killer&&killer.isPlayer));
  if(v) Sfx.death(v);
  if(inView(s.x,s.y,100)) cam.shake=Math.max(cam.shake,s.isPlayer?18:9);
  if(silent) return;
  feed(killer?nameTag(killer)+' eliminó a '+nameTag(s):nameTag(s)+' chocó contra el muro');
  if(killer&&killer.isPlayer){banner('¡ELIMINASTE A '+s.name+'!','#2f7bff');Sfx.kill();}

function respawnSnake(s){
  let best={x:AW/2,y:AH/2}, bestD=-1;
  for(let t=0;t<40;t++){
    const x=rand(450,AW-450), y=rand(450,AH-450);
    let md=1e12;
    for(let k=0;k<snakes.length;k++){
      const o=snakes[k]; if(o===s||!o.alive) continue;
      const b=o.body;
      for(let i=0;i<b.length;i+=3){const dx=b[i].x-x,dy=b[i].y-y,d=dx*dx+dy*dy;if(d<md)md=d;}
    }
    if(md>bestD){bestD=md;best={x:x,y:y};}
  }
  const ang=Math.atan2(AH/2-best.y,AW/2-best.x)+rand(-0.7,0.7);
  s.spawn(best.x,best.y,ang,RESPAWN_LEN,null);
  s.ghost=1.6;

/* ---------------- Lluvia dorada ---------------- */

/* ---------------- Camara ---------------- */
function camTarget(){
  if(cam.mode==='player'){
    const p=player;
    return {x:p.alive?p.x:cam.x,y:p.alive?p.y:cam.y,s:Math.min(W,H)/(880+p.radius*18)};
  }
  return {x:AW/2,y:AH/2,s:Math.min(W/(AW+220),H/(AH+220))};
}
function camSnap(){const t=camTarget();cam.x=t.x;cam.y=t.y;cam.scale=t.s;}
function updateCam(dt){
  const t=camTarget(), k=1-Math.exp(-dt*4.5), ks=1-Math.exp(-dt*3);
  cam.x+=(t.x-cam.x)*k; cam.y+=(t.y-cam.y)*k; cam.scale+=(t.s-cam.scale)*ks;
  cam.shake=Math.max(0,cam.shake-dt*40);
}

/* ---------------- Update ---------------- */
function update(dt){
  time+=dt;
  if(rainCd>0) rainCd-=dt;
  for(let i=0;i<snakes.length;i++) snakes[i].update(dt);
  for(let i=0;i<snakes.length;i++) if(snakes[i].alive) eatCheck(snakes[i],dt);
  collisions();
  updateFoods(dt);
  updateParticles(dt);
  updateCam(dt);
}

/* ---------------- Render ---------------- */
function drawFoods(){
  const x0=view.x0,y0=view.y0,x1=view.x1,y1=view.y1;
  for(let i=0;i<foods.length;i++){
    const f=foods[i], m=f.r*3;
    if(f.x<x0-m||f.x>x1+m||f.y<y0-m||f.y-f.z>y1+m) continue;
    let sc=f.sc<1?Math.max(0,easeBack(f.sc)):1;
    if(f.eaten) sc*=Math.max(0,1-f.et/0.15);
    let alpha=1; if(f.life>0&&f.life<2.5) alpha=0.25+0.75*Math.abs(Math.sin(f.life*7));
    const bob=f.type<=2?Math.sin(time*3.2+f.ph)*2.2:0;
    ctx.globalAlpha=alpha;
    const shS=f.r*2.3*sc/(1+f.z*0.004);
    ctx.drawImage(SPR.shadow,f.x-shS/2,f.y+f.r*0.55-shS*0.3,shS,shS*0.6);
    let size=f.r*2*f.spr.k*sc;
    const dx=f.x, dy=f.y-f.z+bob;
    if(f.type===FT.STAR){
      size*=1+0.08*Math.sin(time*6+f.ph);
      ctx.save();ctx.translate(dx,dy);ctx.rotate(Math.sin(time*2+f.ph)*0.35);
      ctx.drawImage(f.spr,-size/2,-size/2,size,size);ctx.restore();
    } else ctx.drawImage(f.spr,dx-size/2,dy-size/2,size,size);
  }
  ctx.globalAlpha=1;
}
function drawSnakeShadow(s){
  const b=s.body,n=b.length,R=s.radius,off=R*0.35;
  for(let i=n-1;i>=0;i-=2){
    const p=b[i]; if(!inView(p.x,p.y,R*3)) continue;
    const r=i>n*0.6?R*(1-0.5*(i-n*0.6)/(n*0.4)):R;
    ctx.drawImage(SPR.shadow,p.x-r*1.3+off*0.6,p.y-r*0.9+off,r*2.6,r*1.8);
  }
}
function drawSnake(s){
  const b=s.body,n=b.length,R=s.radius;
  if(n<2) return;
  ctx.globalAlpha=s.ghost>0?0.45+0.35*Math.abs(Math.sin(time*14)):1;
  if(s.boosting){
    const gs=R*3.6;
    for(let i=n-1;i>=0;i-=2){const p=b[i];if(inView(p.x,p.y,gs))ctx.drawImage(s.glow,p.x-gs/2,p.y-gs/2,gs,gs);}
  }
  const k=s.sprA.k, tailStart=Math.floor(n*0.6);
  for(let i=n-1;i>=1;i--){
    const p=b[i]; if(!inView(p.x,p.y,R*2)) continue;
    const r=i>tailStart?R*(1-0.5*(i-tailStart)/(n-tailStart)):R;
    const spr=(i%6)<3?s.sprA:s.sprB, sz=r*2*k;
    ctx.drawImage(spr,p.x-sz/2,p.y-sz/2,sz,sz);
  }
  drawHead(s);
  if(s.ghost>0){ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(s.x,s.y,R*1.9+Math.sin(time*10)*3,0,TAU);ctx.stroke();}
  ctx.globalAlpha=1;
}
function drawHead(s){
  const R=s.radius*1.16, x=s.x, y=s.y, ca=Math.cos(s.angle), sa=Math.sin(s.angle);
  if(s.tongue>0){
    const ext=Math.sin((1-s.tongue/0.35)*PI), L=R*(0.35+0.75*ext);
    const bx=x+ca*R*0.85, by=y+sa*R*0.85, tx=bx+ca*L, ty=by+sa*L, fl=R*0.28;
    ctx.strokeStyle='#ff2d55';ctx.lineWidth=Math.max(2,R*0.13);ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(tx,ty);
    ctx.moveTo(tx,ty);ctx.lineTo(tx+Math.cos(s.angle+0.5)*fl,ty+Math.sin(s.angle+0.5)*fl);
    ctx.moveTo(tx,ty);ctx.lineTo(tx+Math.cos(s.angle-0.5)*fl,ty+Math.sin(s.angle-0.5)*fl);
    ctx.stroke();
  }
  const sz=R*2*s.sprA.k;
  ctx.drawImage(s.sprA,x-sz/2,y-sz/2,sz,sz);
  ctx.fillStyle=s.dark;
  for(let sg=-1;sg<=1;sg+=2){ctx.beginPath();ctx.arc(x+ca*R*0.8-sa*R*0.2*sg,y+sa*R*0.8+ca*R*0.2*sg,Math.max(1,R*0.07),0,TAU);ctx.fill();}
  const eR=R*0.37, fw=R*0.3, sd=R*0.5, lc=Math.cos(s.lookAngle), ls=Math.sin(s.lookAngle);
  const angry=s.boosting||s.mode==='EMBOSCADA'||s.mode==='CICLO';
  for(let sg=-1;sg<=1;sg+=2){
    const nx=-sa*sg, ny=ca*sg;
    const ex=x+ca*fw+nx*sd, ey=y+sa*fw+ny*sd;
    ctx.fillStyle='rgba(255,120,170,.4)';
    ctx.beginPath();ctx.arc(ex-ca*eR*1.1+nx*eR*0.35,ey-sa*eR*1.1+ny*eR*0.35,eR*0.5,0,TAU);ctx.fill();
    ctx.fillStyle='#ffffff';ctx.beginPath();ctx.arc(ex,ey,eR,0,TAU);ctx.fill();
    ctx.lineWidth=Math.max(1.5,R*0.08);ctx.strokeStyle=s.dark;ctx.stroke();
    if(s.blink>0){
      ctx.fillStyle=s.color;ctx.beginPath();ctx.arc(ex,ey,eR*0.95,0,TAU);ctx.fill();
      ctx.beginPath();ctx.moveTo(ex-ca*eR*0.7,ey-sa*eR*0.7);ctx.lineTo(ex+ca*eR*0.7,ey+sa*eR*0.7);ctx.stroke();
    } else {
      const px=ex+lc*eR*0.42, py=ey+ls*eR*0.42;
      ctx.fillStyle='#1b1b2f';ctx.beginPath();ctx.arc(px,py,eR*0.56,0,TAU);ctx.fill();
      ctx.fillStyle='#ffffff';ctx.beginPath();ctx.arc(px-eR*0.18,py-eR*0.2,eR*0.19,0,TAU);ctx.fill();
    }
    if(angry){
      ctx.strokeStyle=s.dark;ctx.lineWidth=Math.max(2,R*0.13);ctx.lineCap='round';
      ctx.beginPath();
      ctx.moveTo(ex+ca*eR*1.25+nx*eR*0.95,ey+sa*eR*1.25+ny*eR*0.95);
      ctx.lineTo(ex+ca*eR*0.7-nx*eR*0.75,ey+sa*eR*0.7-ny*eR*0.75);
      ctx.stroke();
    }
  }
}
function drawParticles(){
  for(let i=0;i<parts.length;i++){
    const p=parts[i], a=p.life/p.max;
    if(p.kind===2){
      ctx.globalAlpha=a;ctx.strokeStyle=p.c;ctx.lineWidth=6*a+1;
      ctx.beginPath();ctx.arc(p.x,p.y,p.size*(1-a)+6,0,TAU);ctx.stroke();continue;
    }
    ctx.globalAlpha=a<0.35?a/0.35:1;ctx.fillStyle=p.c;
    if(p.kind===0){ctx.beginPath();ctx.arc(p.x,p.y,p.size*(0.4+0.6*a),0,TAU);ctx.fill();}
    else if(p.kind===1){const w=p.size*Math.abs(Math.cos(p.rot))+1;ctx.fillRect(p.x-w/2,p.y-p.size*0.35,w,p.size*0.7);}
    else{const s=p.size*(0.5+a*0.5);ctx.fillRect(p.x-s,p.y-s*0.18,2*s,s*0.36);ctx.fillRect(p.x-s*0.18,p.y-s,s*0.36,2*s);}

}
function drawWorld(){
  const x0=view.x0,y0=view.y0,x1=view.x1,y1=view.y1;

function drawScreen(){

function render(){

    if(f.type===FT.STAR||f.type===FT.GOLD){mctx.fillStyle='#ffb300';mctx.fillRect(ox+f.x*s-1.2,oy+f.y*s-1.2,2.4,2.4);}

    mctx.strokeStyle=sn.isPlayer?'#1b2a5e':sn.color;mctx.lineWidth=1.5;mctx.stroke();
    if(sn.isPlayer){mctx.strokeStyle='#1b2a5e';mctx.beginPath();mctx.arc(ox+sn.x*s,oy+sn.y*s,6+Math.sin(time*6)*2,0,TAU);mctx.stroke();}

  let txt,cls,fill;
  if(!p.alive){txt='---';cls='';fill=0;}
  else if(p.capT>0){txt='CÁPSULA '+p.capT.toFixed(1)+'s';cls='cap';fill=p.capT/4.5;}
  else if(p.boosting){txt='ACTIVO x2';cls='on';fill=clamp((p.len-MIN_BOOST_LEN)/80,0.03,1);}
  else{txt=p.len>MIN_BOOST_LEN?'LISTO':'SIN MASA';cls='';fill=clamp((p.len-MIN_BOOST_LEN)/80,0,1);}
  const fs=(fill*100).toFixed(0)+'%';
  if(txt!==lastTurboTxt){turboState.textContent=txt;lastTurboTxt=txt;}
  if(cls!==lastTurboCls){turboEl.className='panel'+(cls?' '+cls:'');lastTurboCls=cls;}
  if(fs!==lastFill){turboFill.style.width=fs;lastFill=fs;}
  const rt=p.alive?'':'<span>REAPARECES EN '+Math.max(0,p.respawnT).toFixed(1)+'</span><small>Escudo de reaparición activo 1.6 s</small>';
  if(rt!==lastResp){respawnEl.innerHTML=rt;respawnEl.style.display=p.alive?'none':'block';lastResp=rt;}
  bRain.classList.toggle('cd',rainCd>0);
}

/* ---------------- Input ---------------- */
function takeControl(kind){
  if(control!==kind){
    const was=control; control=kind; updatePilotUI();
    if(was==='ai') banner('¡TOMASTE EL CONTROL!','#2f7bff');
  }
}
function togglePilot(){control=control==='ai'?'keys':'ai';updatePilotUI();banner(control==='ai'?'PILOTO IA ACTIVADO':'CONTROL MANUAL','#8a4dff');}
function toggleCam(){cam.mode=cam.mode==='player'?'full':'player';updateCamUI();}
function toggleSound(){Sfx.on=!Sfx.on;bSound.classList.toggle('muted',!Sfx.on);}
const DIRS={ArrowUp:1,ArrowDown:1,ArrowLeft:1,ArrowRight:1,KeyW:1,KeyA:1,KeyS:1,KeyD:1};
window.addEventListener('keydown',function(e){
  Sfx.init();
  if(DIRS[e.code]||e.code==='Space') e.preventDefault();
  keys[e.code]=true;
  if(DIRS[e.code]) takeControl('keys');
  if(e.repeat) return;
  if(e.code==='KeyC') toggleCam();
  else if(e.code==='KeyG') goldenRain();
  else if(e.code==='KeyP') togglePilot();
  else if(e.code==='KeyM') toggleSound();
});
window.addEventListener('keyup',function(e){keys[e.code]=false;});
window.addEventListener('blur',function(){for(const k in keys)keys[k]=false;uiTurbo=false;mouse.down=false;});
canvas.addEventListener('pointerdown',function(e){
  Sfx.init();
  mouse.x=e.clientX;mouse.y=e.clientY;mouse.down=true;mouse.type=e.pointerType||'mouse';
  takeControl('mouse');
});
window.addEventListener('pointermove',function(e){if(e.target===canvas||control==='mouse'){mouse.x=e.clientX;mouse.y=e.clientY;}});
window.addEventListener('pointerup',function(){mouse.down=false;});
window.addEventListener('pointercancel',function(){mouse.down=false;});
canvas.addEventListener('contextmenu',function(e){e.preventDefault();});
function bindBtn(id,fn){
  const b=$(id);
  b.addEventListener('pointerdown',function(e){e.stopPropagation();});
  b.addEventListener('click',function(){Sfx.init();Sfx.ui();fn();b.blur();});
  return b;
}
bindBtn('bCam',toggleCam);
bindBtn('bRain',goldenRain);
bindBtn('bPilot',togglePilot);
bindBtn('bSound',toggleSound);
const bTurbo=$('bTurbo');
bTurbo.addEventListener('pointerdown',function(e){e.stopPropagation();Sfx.init();uiTurbo=true;});
['pointerup','pointerleave','pointercancel'].forEach(function(ev){bTurbo.addEventListener(ev,function(){uiTurbo=false;});});
window.addEventListener('resize',resize);

/* ---------------- Init ---------------- */
const PALETTES=[
  {name:'MIXIUH',base:'#2f7bff',accent:'#ffd23f',player:true,aggro:0.65},
  {name:'NOVA',base:'#ff3fa4',accent:'#ffe0f1',aggro:0.95},
  {name:'MANGO',base:'#ff8a1f',accent:'#fff04a',aggro:0.4},
  {name:'ZIGZAG',base:'#8a4dff',accent:'#4af2ff',aggro:0.75}
];
function init(){
  resize();
  makePatterns();
  for(let i=0;i<260;i++) DECOR.push({x:rand(30,AW-30),y:rand(30,AH-30),t:(Math.random()*SPR.deco.length)|0,s:rand(0.7,1.3)});
  for(let i=0;i<PALETTES.length;i++) snakes.push(new Snake(i,PALETTES[i]));
  player=snakes[0];
  const C={x:AW/2,y:AH/2}, RAD=420, lens=[70,64,82,76];
  snakes.forEach(function(s,k){
    const phi=k*PI/2+PI/4;
    s.spawn(C.x+Math.cos(phi)*RAD,C.y+Math.sin(phi)*RAD,phi+PI/2,lens[k],function(d){
      const a=phi-d/RAD; return {x:C.x+Math.cos(a)*RAD,y:C.y+Math.sin(a)*RAD};
    });
  });
  for(let i=0;i<TARGET.apple;i++) spawnNatural(FT.APPLE);
  for(let i=0;i<TARGET.star;i++) spawnNatural(FT.STAR);
  for(let i=0;i<TARGET.cap;i++) spawnNatural(FT.CAP);
  for(let i=0;i<90;i++){const a=Math.random()*TAU,r=rand(120,760);addFood(FT.APPLE,C.x+Math.cos(a)*r,C.y+Math.sin(a)*r);}
  for(let i=0;i<8;i++){const a=Math.random()*TAU,r=rand(150,600);addFood(FT.STAR,C.x+Math.cos(a)*r,C.y+Math.sin(a)*r);}
  for(let i=0;i<foods.length;i++) foods[i].sc=1;
  camSnap();
  silent=true;
  for(let i=0;i<45;i++) update(1/60);
  silent=false;
  camSnap();
  updatePilotUI(); updateCamUI(); renderBoard();
  render(); drawMini();
  window.MIXIUH_ARENA={snakes:snakes,foods:foods,cam:cam,goldenRain:goldenRain,arena:{w:AW,h:AH}};
}
let lastNow=performance.now();
function loop(now){
  let dt=(now-lastNow)/1000; lastNow=now;
  if(!(dt>0)) dt=1/60; if(dt>0.05) dt=0.05;
  update(dt); render(); hud(dt);
  requestAnimationFrame(loop);
}
init();
requestAnimationFrame(function(t){lastNow=t;requestAnimationFrame(loop);});
})();
</script>
