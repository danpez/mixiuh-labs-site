<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>La Rueda de Falkirk — Principio de Arquimedes (Escocia)</title>
  <style>
    :root {
      --bg-deep: #060A12;
      --bg-panel: #0F172A;
      --accent-magenta: #E879F9;
      --accent-cyan: #22D3EE;
      --accent-emerald: #10B981;
      --accent-amber: #FBBF24;
      --text-primary: #F8FAFC;
      --text-secondary: #94A3B8;
      --border-subtle: rgba(148, 163, 184, 0.22);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-deep);
      color: var(--text-primary);
      font-family: 'Inter', 'SF Pro Display', 'Segoe UI', system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .stage {
      position: relative;
      width: min(100vw, calc(100vh * 16 / 9));
      height: min(100vh, calc(100vw * 9 / 16));
      background: var(--bg-deep);
      overflow: hidden;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.72);
    }

    #falkirk-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .control-dock {
      position: absolute;
      left: 1.85%;
      right: 1.85%;
      bottom: 1.65%;
      height: 10.2%;
      background: rgba(15, 23, 42, 0.94);
      border: 1.5px solid rgba(34, 211, 238, 0.34);
      border-radius: 14px;
      padding: 0 1.4%;
      display: grid;
      grid-template-columns: 1.15fr 1.15fr 1.35fr auto auto;
      align-items: center;
      gap: 1.3%;
      backdrop-filter: blur(10px);
    }

    .control-group {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
      min-width: 0;
    }

    .control-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      font-family: 'JetBrains Mono', 'SF Mono', 'Menlo', 'Consolas', monospace;
      font-size: clamp(10px, 0.78vw, 14px);
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .label-a {
      color: var(--accent-magenta);
    }

    .label-b {
      color: var(--accent-cyan);
    }

    .value-pill {
      padding: 2px 8px;
      border-radius: 6px;
      background: rgba(6, 10, 18, 0.85);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      font-size: clamp(11px, 0.86vw, 15px);
      white-space: nowrap;
    }

    .range-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .range-bound {
      font-family: 'JetBrains Mono', 'SF Mono', 'Menlo', 'Consolas', monospace;
      font-size: clamp(9px, 0.65vw, 12px);
      color: var(--text-secondary);
      white-space: nowrap;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 7px;
      border-radius: 999px;
      background: #060A12;
      border: 1px solid #334155;
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--accent-cyan);
      border: 2px solid var(--text-primary);
      box-shadow: 0 0 10px rgba(34, 211, 238, 0.6);
      cursor: pointer;
    }

    #slider-boat-a::-webkit-slider-thumb {
      background: var(--accent-magenta);
      box-shadow: 0 0 10px rgba(232, 121, 249, 0.65);
    }

    input[type="range"]::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--accent-cyan);
      border: 2px solid var(--text-primary);
      cursor: pointer;
    }

    #slider-boat-a::-moz-range-thumb {
      background: var(--accent-magenta);
    }

    .btn {
      height: 62%;
      min-height: 44px;
      padding: 0 18px;
      border-radius: 10px;
      border: 1.6px solid transparent;
      font-family: 'JetBrains Mono', 'SF Mono', 'Menlo', 'Consolas', monospace;
      font-size: clamp(10px, 0.80vw, 14px);
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: transform 0.12s ease, background-color 0.16s ease, border-color 0.16s ease;
      white-space: nowrap;
      user-select: none;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-archimedes {
      width: 100%;
      background: rgba(16, 185, 129, 0.16);
      border-color: var(--accent-emerald);
      color: var(--accent-emerald);
    }

    .btn-archimedes:hover {
      background: rgba(16, 185, 129, 0.25);
    }

    .btn-archimedes.off {
      background: rgba(232, 121, 249, 0.20);
      border-color: var(--accent-magenta);
      color: var(--accent-magenta);
    }

    .btn-archimedes.off:hover {
      background: rgba(232, 121, 249, 0.30);
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: currentColor;
      flex-shrink: 0;
    }

    .btn-play {
      min-width: 138px;
      background: rgba(34, 211, 238, 0.16);
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
    }

    .btn-play:hover {
      background: rgba(34, 211, 238, 0.26);
    }

    .btn-play.paused {
      background: rgba(251, 191, 36, 0.18);
      border-color: var(--accent-amber);
      color: var(--accent-amber);
    }

    .btn-reset {
      min-width: 112px;
      background: rgba(148, 163, 184, 0.10);
      border-color: rgba(148, 163, 184, 0.38);
      color: var(--text-secondary);
    }

    .btn-reset:hover {
      background: rgba(148, 163, 184, 0.20);
      color: var(--text-primary);
    }

    .icon-svg {
      width: 15px;
      height: 15px;
      fill: currentColor;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <main class="stage">
    <canvas id="falkirk-canvas" width="1920" height="1080" aria-label="Simulacion de la Rueda de Falkirk en Escocia"></canvas>

    <section class="control-dock" aria-label="Controles de simulacion de la Rueda de Falkirk">
      <div class="control-group">
        <div class="control-header">
          <label for="slider-boat-a" class="label-a">Peso Barco Gondola A</label>
          <span id="value-boat-a" class="value-pill">180 t</span>
        </div>
        <div class="range-wrap">
          <span class="range-bound">40 t</span>
          <input id="slider-boat-a" type="range" min="40" max="250" step="5" value="180" />
          <span class="range-bound">250 t</span>
        </div>
      </div>

      <div class="control-group">
        <div class="control-header">
          <label for="slider-boat-b" class="label-b">Peso Barco Gondola B</label>
          <span id="value-boat-b" class="value-pill">50 t</span>
        </div>
        <div class="range-wrap">
          <span class="range-bound">0 t</span>
          <input id="slider-boat-b" type="range" min="0" max="250" step="5" value="50" />
          <span class="range-bound">250 t</span>
        </div>
      </div>

      <button id="btn-archimedes" type="button" class="btn btn-archimedes" aria-pressed="true">
        <span class="status-dot" aria-hidden="true"></span>
        <span id="label-archimedes">Arquimedes: ON</span>
      </button>

      <button id="btn-toggle-run" type="button" class="btn btn-play" aria-pressed="true">
        <svg id="icon-run" class="icon-svg" viewBox="0 0 16 16" aria-hidden="true">
          <rect x="3" y="2" width="3.5" height="12" rx="1"></rect>
          <rect x="9.5" y="2" width="3.5" height="12" rx="1"></rect>
        </svg>
        <span id="label-run">Pausar</span>
      </button>

      <button id="btn-reset" type="button" class="btn btn-reset">
        <span>Reiniciar</span>
      </button>
    </section>
  </main>

  <script type="module">
    import {
      FALKIRK_CONSTANTS,
      clamp,
      createSimulationState,
    } from './physics.js';
    import { createFalkirkRenderer } from './renderer.js';

    const canvas = document.getElementById('falkirk-canvas');
    const sliderBoatA = document.getElementById('slider-boat-a');
    const sliderBoatB = document.getElementById('slider-boat-b');
    const valueBoatA = document.getElementById('value-boat-a');
    const valueBoatB = document.getElementById('value-boat-b');
    const btnArchimedes = document.getElementById('btn-archimedes');
    const labelArchimedes = document.getElementById('label-archimedes');
    const btnToggleRun = document.getElementById('btn-toggle-run');
    const labelRun = document.getElementById('label-run');
    const iconRun = document.getElementById('icon-run');
    const btnReset = document.getElementById('btn-reset');

    const state = createSimulationState({
      boatATonnes: Number(sliderBoatA.value),
      boatBTonnes: Number(sliderBoatB.value),
      archimedesEnabled: true,
      isRunning: true,
    });

    const renderer = createFalkirkRenderer({
      canvas,
      state,
    });

    function syncControlUI() {
      valueBoatA.textContent = `${Math.round(state.boatATonnes)} t`;
      valueBoatB.textContent = `${Math.round(state.boatBTonnes)} t`;

      if (state.archimedesEnabled) {
        btnArchimedes.classList.remove('off');
        btnArchimedes.setAttribute('aria-pressed', 'true');
        labelArchimedes.textContent = 'Arquimedes: ON';
      } else {
        btnArchimedes.classList.add('off');
        btnArchimedes.setAttribute('aria-pressed', 'false');
        labelArchimedes.textContent = 'Arquimedes: OFF (Bloqueada)';
      }

      if (state.isRunning) {
        btnToggleRun.classList.remove('paused');
        btnToggleRun.setAttribute('aria-pressed', 'true');
        labelRun.textContent = 'Pausar';
        iconRun.innerHTML =
          '<rect x="3" y="2" width="3.5" height="12" rx="1"></rect><rect x="9.5" y="2" width="3.5" height="12" rx="1"></rect>';
      } else {
        btnToggleRun.classList.add('paused');
        btnToggleRun.setAttribute('aria-pressed', 'false');
        labelRun.textContent = 'Girar';
        iconRun.innerHTML = '<polygon points="3,2 14,8 3,14"></polygon>';
      }
    }

    sliderBoatA.addEventListener('input', () => {
      state.boatATonnes = clamp(
        Number(sliderBoatA.value),
        FALKIRK_CONSTANTS.MIN_BOAT_A_TONNES,
        FALKIRK_CONSTANTS.MAX_BOAT_TONNES
      );
      syncControlUI();
      renderer.renderNow();
    });

    sliderBoatB.addEventListener('input', () => {
      state.boatBTonnes = clamp(
        Number(sliderBoatB.value),
        FALKIRK_CONSTANTS.MIN_BOAT_B_TONNES,
        FALKIRK_CONSTANTS.MAX_BOAT_TONNES
      );
      syncControlUI();
      renderer.renderNow();
    });

    btnArchimedes.addEventListener('click', () => {
      state.archimedesEnabled = !state.archimedesEnabled;
      syncControlUI();
      renderer.renderNow();
    });

    btnToggleRun.addEventListener('click', () => {
      state.isRunning = !state.isRunning;
      syncControlUI();
      renderer.renderNow();
    });

    btnReset.addEventListener('click', () => {
      state.timeSeconds = 0;
      state.phase = 'rotating';
      state.phaseElapsed = 0;
      state.halfTurnIndex = 0;
      state.wheelAngleDeg = 0;
      state.angularVelocityDegPerSec = 0;
      state.energyKwh = 0;
      state.completedHalfTurns = 0;
      state.boatCycleSeed = 0;
      state.gateOpenRatio = 0;
      state.displacementFlowIntensity = 0;
      state.isRunning = true;
      syncControlUI();
      renderer.renderNow();
    });

    // Global audit hook required by specification
    window.__auditFalkirk = () => renderer.getAuditMetrics();

    syncControlUI();
  </script>
</body>
</html>
