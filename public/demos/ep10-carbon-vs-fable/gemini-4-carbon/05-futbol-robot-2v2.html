        ctx.shadowBlur = 14;
        ctx.stroke();
        ctx.restore();

        // Postes iluminados
        for (let p = 0; p < GOAL_POSTS.length; p++) {
          const post = GOAL_POSTS[p];
          const pCol = post.x === 0 ? COLORS.cyan : COLORS.orange;
          ctx.beginPath();
          ctx.arc(post.x, post.y, POST_R, 0, Math.PI * 2);
          ctx.fillStyle = "#F8FAFC";
          ctx.shadowColor = pCol;
          ctx.shadowBlur = 14;
          ctx.fill();
          ctx.lineWidth = 2.5;
          ctx.strokeStyle = pCol;
          ctx.stroke();
        }
        ctx.restore();

        // Ondas de choque en paredes cuando el balon rebota
        for (let i = 0; i < state.wallRipples.length; i++) {
          const w = state.wallRipples[i];
          ctx.save();
          ctx.globalAlpha = clamp(w.alpha, 0, 1);
          ctx.strokeStyle = w.color;
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.arc(w.x, w.y, w.r, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }
      }

      function drawBoostPads(activeOverrides) {
        for (let i = 0; i < state.boostPads.length; i++) {
          const pad = state.boostPads[i];
          const isActive = activeOverrides ? activeOverrides[i] : pad.active;

          ctx.save();
          ctx.translate(pad.x, pad.y);

          // Base octogonal de la pastilla
          ctx.beginPath();
          for (let k = 0; k < 8; k++) {
            const a = (k * Math.PI) / 4 + Math.PI / 8;
            const r = 19;
            const px = Math.cos(a) * r;
            const py = Math.sin(a) * r;
            if (k === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          }
          ctx.closePath();
          ctx.fillStyle = "rgba(15, 23, 42, 0.88)";
          ctx.fill();
          ctx.lineWidth = 1.8;
          ctx.strokeStyle = isActive ? "rgba(251, 191, 36, 0.75)" : "rgba(148, 163, 184, 0.25)";
          ctx.stroke();

          if (isActive) {
            const pulseR = 12.5 + Math.sin(pad.pulse) * 2.2;
            ctx.shadowColor = COLORS.gold;
            ctx.shadowBlur = 18;
            ctx.beginPath();
            ctx.arc(0, 0, pulseR, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(251, 191, 36, 0.26)";
            ctx.fill();

            ctx.beginPath();
            ctx.arc(0, 0, 8.5, 0, Math.PI * 2);
            ctx.fillStyle = COLORS.gold;
            ctx.fill();

            // Rayo vectorial central (cero emojis)
            ctx.shadowBlur = 0;
            ctx.fillStyle = "#060A12";
            ctx.beginPath();
            ctx.moveTo(1.5, -6);
            ctx.lineTo(-4.2, 0.8);
            ctx.lineTo(-0.3, 0.8);
            ctx.lineTo(-1.8, 6);
            ctx.lineTo(4.2, -0.8);
            ctx.lineTo(0.3, -0.8);
            ctx.closePath();
            ctx.fill();
          } else {
            // Anillo de recarga progresiva
            const progress = clamp(1 - pad.cooldown / BOOST_RESPAWN_TIME, 0, 1);
            ctx.beginPath();
            ctx.arc(0, 0, 12, -Math.PI * 0.5, -Math.PI * 0.5 + Math.PI * 2 * progress);
            ctx.strokeStyle = "rgba(251, 191, 36, 0.55)";
            ctx.lineWidth = 2.6;
            ctx.stroke();
          }

          ctx.restore();
        }
      }

      /**
       * Dibuja sutilmente las lineas punteadas de prediccion balistica de la IA
       * mostrando rebotes futuros contra la pared y vectores de intercepcion.
       */
      function drawBallisticPredictionHUD() {
        if (!state.showPrediction || state.phase !== "PLAYING") return;

        const planL = aiVisualPlans.left;
        const planR = aiVisualPlans.right;
        const basePlan = planL || planR;
        if (!basePlan || !basePlan.predPoints || basePlan.predPoints.length < 2) return;

        const ballSpd = Math.hypot(state.ball.vx, state.ball.vy);
        if (ballSpd < 15) return;

        ctx.save();

        // 1. Curva punteada de la trayectoria balistica futura del balon y sus rebotes
        ctx.setLineDash([6, 6]);
        ctx.lineDashOffset = -(simClock * 38) % 12;
        ctx.lineWidth = 2.0;
        ctx.strokeStyle = "rgba(16, 185, 129, 0.42)";
        ctx.beginPath();
        const pts = basePlan.predPoints;
        ctx.moveTo(pts[0].x, pts[0].y);
        for (let i = 1; i < pts.length; i++) {
          ctx.lineTo(pts[i].x, pts[i].y);
        }
        ctx.stroke();

        // Nodos romboidales en cada rebote calculado contra pared / esquina curva
        ctx.setLineDash([]);
        for (let i = 0; i < basePlan.bounces.length; i++) {
          const b = basePlan.bounces[i];
          ctx.save();
          ctx.translate(b.x, b.y);
          ctx.rotate(Math.PI * 0.25);
          ctx.fillStyle = "rgba(251, 191, 36, 0.85)";
          ctx.strokeStyle = "#060A12";
          ctx.lineWidth = 1.5;
          ctx.fillRect(-4.5, -4.5, 9, 9);
          ctx.strokeRect(-4.5, -4.5, 9, 9);
          ctx.restore();
        }

        // 2. Linea punteada sutil de intercepcion para EQUIPO CIAN
        if (planL && planL.interceptPt && state.leftBots[planL.attackerIdx]) {
          const bot = state.leftBots[planL.attackerIdx];
          const ip = planL.interceptPt;
          ctx.setLineDash([4, 6]);
          ctx.lineWidth = 1.6;
          ctx.strokeStyle = "rgba(34, 211, 238, 0.34)";
          ctx.beginPath();
          ctx.moveTo(bot.x, bot.y);
          ctx.lineTo(ip.x, ip.y);
          ctx.stroke();

          ctx.setLineDash([]);
          ctx.strokeStyle = "rgba(34, 211, 238, 0.68)";
          ctx.beginPath();
          ctx.arc(ip.x, ip.y, 7.5, 0, Math.PI * 2);
          ctx.stroke();
        }

        // 3. Linea punteada sutil de intercepcion para EQUIPO NARANJA
        if (planR && planR.interceptPt && state.rightBots[planR.attackerIdx]) {
          const bot = state.rightBots[planR.attackerIdx];
          const ip = planR.interceptPt;
          ctx.setLineDash([4, 6]);
          ctx.lineWidth = 1.6;
          ctx.strokeStyle = "rgba(251, 146, 60, 0.34)";
          ctx.beginPath();
          ctx.moveTo(bot.x, bot.y);
          ctx.lineTo(ip.x, ip.y);
          ctx.stroke();

          ctx.setLineDash([]);
          ctx.strokeStyle = "rgba(251, 146, 60, 0.68)";
          ctx.beginPath();
          ctx.arc(ip.x, ip.y, 7.5, 0, Math.PI * 2);
          ctx.stroke();
        }

        ctx.restore();
      }

      function drawRobotCar(bot, roleTag) {
        const isLeft = bot.side === "left";
        const mainColor = isLeft ? COLORS.cyan : COLORS.orange;
        const darkTrim = isLeft ? "#083344" : "#431407";

        ctx.save();
        ctx.translate(bot.x, bot.y);
        ctx.rotate(bot.angle);

        // Sombra suave bajo el chasis
        ctx.fillStyle = "rgba(0, 0, 0, 0.45)";
        ctx.beginPath();
        ctx.roundRect(-24, -17, 48, 34, 9);
        ctx.fill();

        // Llamarada de plasma directa en las toberas cuando usa Boost
        if (bot.isBoosting) {
          const flicker = 16 + Math.random() * 14;
          const grad = ctx.createLinearGradient(-22, 0, -22 - flicker, 0);
          grad.addColorStop(0, "#FFFFFF");
          grad.addColorStop(0.35, COLORS.gold);
          grad.addColorStop(1, "rgba(244, 63, 94, 0)");
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.moveTo(-21, -10);
          ctx.lineTo(-22 - flicker, -6);
          ctx.lineTo(-19, -3);
          ctx.moveTo(-21, 10);
          ctx.lineTo(-22 - flicker, 6);
          ctx.lineTo(-19, 3);
          ctx.fill();
        }

        // 4 Ruedas articuladas (las delanteras giran con steer)
        const wheelPositions = [
          { x: 13, y: -15.5, front: true },
          { x: 13, y: 15.5, front: true },
          { x: -13, y: -15.5, front: false },
          { x: -13, y: 15.5, front: false }
        ];
        for (let w = 0; w < wheelPositions.length; w++) {
          const wp = wheelPositions[w];
          ctx.save();
          ctx.translate(wp.x, wp.y);
          if (wp.front) ctx.rotate((bot.steerVis || 0) * 0.42);
          ctx.fillStyle = "#0F172A";
          ctx.strokeStyle = mainColor;
          ctx.lineWidth = 1.3;
          ctx.beginPath();
          ctx.roundRect(-6, -3.2, 12, 6.4, 2);
          ctx.fill();
          ctx.stroke();
          ctx.restore();
        }

        // Chasis aerodinamico blindado
        ctx.shadowColor = mainColor;
        ctx.shadowBlur = bot.isBoosting ? 18 : 9;
        ctx.fillStyle = darkTrim;
        ctx.strokeStyle = mainColor;
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        ctx.moveTo(24, 0);
        ctx.lineTo(15, -13);
        ctx.lineTo(-17, -14);
        ctx.lineTo(-22, -9);
        ctx.lineTo(-22, 9);
        ctx.lineTo(-17, 14);
        ctx.lineTo(15, 13);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.shadowBlur = 0;

        // Cabina energetica y franjas de rol
        ctx.fillStyle = mainColor;
        ctx.beginPath();
        ctx.moveTo(14, 0);
        ctx.lineTo(4, -7.5);
        ctx.lineTo(-9, -7.5);
        ctx.lineTo(-13, 0);
        ctx.lineTo(-9, 7.5);
        ctx.lineTo(4, 7.5);
        ctx.closePath();
        ctx.fill();

        // Visor oscuro interior
        ctx.fillStyle = "#060A12";
        ctx.beginPath();
        ctx.moveTo(9, 0);
        ctx.lineTo(2, -4.8);
        ctx.lineTo(-6, -4.8);
        ctx.lineTo(-8, 0);
        ctx.lineTo(-6, 4.8);
        ctx.lineTo(2, 4.8);
        ctx.closePath();
        ctx.fill();

        // Insignia geometrica de rol (flecha Delantero vs escudo Portero)
        ctx.fillStyle = COLORS.white;
        if (roleTag === "PORTERO/DEF") {
          ctx.fillRect(-4.5, -2.5, 5, 5);
        } else {
          ctx.beginPath();
          ctx.moveTo(4, 0);
          ctx.lineTo(-3, -3.2);
          ctx.lineTo(-3, 3.2);
          ctx.closePath();
          ctx.fill();
        }

        ctx.restore();

        // Etiqueta flotante minimalista con barra de Boost 100% sobre el auto
        ctx.save();
        ctx.translate(bot.x, bot.y - 31);
        ctx.font = "700 10px 'JetBrains Mono', monospace";
        ctx.textAlign = "center";
        ctx.fillStyle = "rgba(248, 250, 252, 0.86)";
        const shortRole = roleTag === "PORTERO/DEF" ? "DEF" : "DEL";
        ctx.fillText(bot.name + " [" + shortRole + "]", 0, -5);

        ctx.fillStyle = "rgba(15, 23, 42, 0.9)";
        ctx.fillRect(-18, -2, 36, 4);
        ctx.fillStyle = COLORS.gold;
        ctx.fillRect(-18, -2, 36 * clamp((bot.boost || 0) / 100, 0, 1), 4);
        ctx.restore();
      }

      function drawEnergyBall(ballObj, drawTrail) {
        // Estela de velocidad del balon energetico
        if (drawTrail && state.ball.trail.length > 1) {
          for (let i = 1; i < state.ball.trail.length; i++) {
            const p0 = state.ball.trail[i - 1];
            const p1 = state.ball.trail[i];
            const ratio = i / state.ball.trail.length;
            const trailColor = ballObj.lastSide === "left"
              ? "rgba(34, 211, 238, " + (ratio * 0.42).toFixed(3) + ")"
              : ballObj.lastSide === "right"
                ? "rgba(251, 146, 60, " + (ratio * 0.42).toFixed(3) + ")"
                : "rgba(16, 185, 129, " + (ratio * 0.36).toFixed(3) + ")";

            ctx.strokeStyle = trailColor;
            ctx.lineWidth = BALL_R * 1.55 * ratio;
            ctx.lineCap = "round";
            ctx.beginPath();
            ctx.moveTo(p0.x, p0.y);
            ctx.lineTo(p1.x, p1.y);
            ctx.stroke();
          }
        }

        const accent = ballObj.lastSide === "left"
          ? COLORS.cyan
          : ballObj.lastSide === "right"
            ? COLORS.orange
            : COLORS.emerald;

        ctx.save();
        ctx.translate(ballObj.x, ballObj.y);

        // Halo energetico exterior
        ctx.shadowColor = accent;
        ctx.shadowBlur = 22;
        const radGrad = ctx.createRadialGradient(-5, -5, 3, 0, 0, BALL_R);
        radGrad.addColorStop(0, "#FFFFFF");
        radGrad.addColorStop(0.45, "#E2E8F0");
        radGrad.addColorStop(0.82, "#1E293B");
        radGrad.addColorStop(1, accent);

        ctx.beginPath();
        ctx.arc(0, 0, BALL_R, 0, Math.PI * 2);
        ctx.fillStyle = radGrad;
        ctx.fill();
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = accent;
        ctx.stroke();
        ctx.shadowBlur = 0;

        // Nucleo geodesico giratorio
        ctx.rotate(ballObj.rot || 0);
        ctx.strokeStyle = "#0F172A";
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        for (let k = 0; k < 6; k++) {
          const a = (k * Math.PI) / 3;
          const px = Math.cos(a) * (BALL_R * 0.56);
          const py = Math.sin(a) * (BALL_R * 0.56);
          if (k === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.stroke();

        for (let k = 0; k < 6; k++) {
          const a = (k * Math.PI) / 3;
          ctx.beginPath();
          ctx.moveTo(Math.cos(a) * (BALL_R * 0.56), Math.sin(a) * (BALL_R * 0.56));
          ctx.lineTo(Math.cos(a) * BALL_R, Math.sin(a) * BALL_R);
          ctx.stroke();
        }

        ctx.beginPath();
        ctx.arc(0, 0, 5.5, 0, Math.PI * 2);
        ctx.fillStyle = accent;
        ctx.fill();

        ctx.restore();
      }

      function drawParticlesAndShockwaves() {
        for (let i = 0; i < state.particles.length; i++) {
          const p = state.particles[i];
          const alpha = clamp(p.life / p.maxLife, 0, 1);
          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size * (0.45 + 0.55 * alpha), 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        for (let i = 0; i < state.shockwaves.length; i++) {
          const s = state.shockwaves[i];
          ctx.save();
          ctx.globalAlpha = clamp(s.alpha, 0, 1);
          ctx.strokeStyle = s.color;
          ctx.lineWidth = 5;
          ctx.shadowColor = s.color;
          ctx.shadowBlur = 20;
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }
      }

      function drawOverlays() {
        if ((state.phase === "GOAL_CELEBRATION" || state.phase === "REPLAY") && state.lastGoalInfo) {
          const info = state.lastGoalInfo;
          const isReplay = state.phase === "REPLAY";

          ctx.save();
          if (isReplay) {
            // Marco estilo camara de repeticion instantanea
            ctx.strokeStyle = info.color;
            ctx.lineWidth = 4;
            ctx.strokeRect(-GOAL_DEPTH + 6, 6, FIELD_W + GOAL_DEPTH * 2 - 12, FIELD_H - 12);

            ctx.fillStyle = "rgba(6, 10, 18, 0.88)";
            ctx.strokeStyle = COLORS.coral;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.roundRect(24, 22, 315, 42, 8);
            ctx.fill();
            ctx.stroke();

            const blink = Math.sin(performance.now() * 0.012) > 0;
            if (blink) {
              ctx.fillStyle = COLORS.coral;
              ctx.beginPath();
              ctx.arc(46, 43, 6.5, 0, Math.PI * 2);
              ctx.fill();
            }

            ctx.fillStyle = COLORS.white;
            ctx.font = "800 14px 'JetBrains Mono', monospace";
            ctx.textAlign = "left";
            ctx.fillText("REPETICION DE GOL // 0.78X", 62, 48);
          }

          // Placa central del destello de gol
          const boxW = 540;
          const boxH = 104;
          const bx = FIELD_W * 0.5 - boxW * 0.5;
          const by = isReplay ? FIELD_H - 132 : FIELD_H * 0.5 - boxH * 0.5;

          ctx.fillStyle = "rgba(6, 10, 18, 0.90)";
          ctx.strokeStyle = info.color;
          ctx.lineWidth = 3;
          ctx.shadowColor = info.color;
          ctx.shadowBlur = 26;
          ctx.beginPath();
          ctx.roundRect(bx, by, boxW, boxH, 14);
          ctx.fill();
          ctx.stroke();
          ctx.shadowBlur = 0;

          ctx.textAlign = "center";
          ctx.fillStyle = info.color;
          ctx.font = "900 32px 'Inter', sans-serif";
          ctx.fillText(info.teamLabel, FIELD_W * 0.5, by + 48);

          ctx.fillStyle = COLORS.white;
          ctx.font = "700 15px 'JetBrains Mono', monospace";
          ctx.fillText(
            "AUTOR: " + info.scorer + "   //   POTENCIA: " + info.kmh + " KM/H",
            FIELD_W * 0.5,
            by + 80
          );
          ctx.restore();
        }
      }

      function renderArena() {
        const cw = canvas.width;
        const ch = canvas.height;
        ctx.clearRect(0, 0, cw, ch);

        const totalWorldW = FIELD_W + GOAL_DEPTH * 2 + 56;
        const totalWorldH = FIELD_H + 56;
        const scale = Math.min(cw / totalWorldW, ch / totalWorldH);

        const offsetX = (cw - FIELD_W * scale) * 0.5;
        const offsetY = (ch - FIELD_H * scale) * 0.5;

        const shakeX = state.cameraShake > 0.2 ? (Math.random() - 0.5) * state.cameraShake * 2 : 0;
        const shakeY = state.cameraShake > 0.2 ? (Math.random() - 0.5) * state.cameraShake * 2 : 0;

        ctx.save();
        ctx.translate(offsetX + shakeX, offsetY + shakeY);
        ctx.scale(scale, scale);

        const isReplay = state.phase === "REPLAY" && state.replayBuffer.length > 0;
        const replaySnap = isReplay
          ? state.replayBuffer[Math.floor(clamp(state.replayPlaybackIdx, 0, state.replayBuffer.length - 1))]
          : null;

        drawPitch();
        drawBoostPads(replaySnap ? replaySnap.pads : null);
        drawBallisticPredictionHUD();

        if (replaySnap) {
          for (let i = 0; i < replaySnap.bots.length; i++) {
            const rb = replaySnap.bots[i];
            drawRobotCar(rb, i % 2 === 0 ? "DELANTERO" : "PORTERO/DEF");
          }
          drawEnergyBall(replaySnap.ball, false);
        } else {
          const rolesL = (aiVisualPlans.left && aiVisualPlans.left.roleLabels) || ["DELANTERO", "PORTERO/DEF"];
          const rolesR = (aiVisualPlans.right && aiVisualPlans.right.roleLabels) || ["DELANTERO", "PORTERO/DEF"];

          for (let i = 0; i < state.leftBots.length; i++) {
            drawRobotCar(state.leftBots[i], state.humanControlsLeft0 && i === 0 ? "HUMANO" : rolesL[i]);
          }
          for (let i = 0; i < state.rightBots.length; i++) {
            drawRobotCar(state.rightBots[i], rolesR[i]);
          }
          drawEnergyBall(state.ball, true);
        }

        drawParticlesAndShockwaves();
        drawOverlays();

        ctx.restore();
      }

      function formatClock(sec) {
        const s = Math.max(0, Math.ceil(sec));
        const m = Math.floor(s / 60);
        const rem = s % 60;
        return String(m).padStart(2, "0") + ":" + String(rem).padStart(2, "0");
      }

      let fpsFrames = 0;
      let fpsAccum = 0;
      let measuredFps = 60;

      function updateHUD(rawDt) {
        fpsFrames++;
        fpsAccum += rawDt;
        if (fpsAccum >= 0.45) {
          measuredFps = Math.round(fpsFrames / fpsAccum);
          fpsFrames = 0;
          fpsAccum = 0;
          dom.fpsReadout.textContent = clamp(measuredFps, 1, 144) + " FPS // IA HOOK OK";
        }

        dom.scoreLeft.textContent = String(state.scoreLeft);
        dom.scoreRight.textContent = String(state.scoreRight);

        if (state.overtime) {
          dom.matchPhase.textContent = "GOL DE ORO // PARTIDO 0" + state.matchNumber;
          dom.clock.textContent = "+" + formatClock(state.timeLeft);
          dom.clock.className = "match-clock crit";
        } else {
          dom.matchPhase.textContent = "ARENA 2V2 // PARTIDO 0" + state.matchNumber;
          dom.clock.textContent = formatClock(state.timeLeft);
          dom.clock.className = state.timeLeft <= 10
            ? "match-clock crit"
            : state.timeLeft <= 25
              ? "match-clock warn"
              : "match-clock";
        }

        const kmh = Math.round(Math.hypot(state.ball.vx, state.ball.vy) * 0.165);
        dom.ballSpeed.textContent = "BALON: " + String(kmh).padStart(3, "0") + " KM/H";

        let activeCount = 0;
        for (let i = 0; i < state.boostPads.length; i++) {
          if (state.boostPads[i].active) activeCount++;
        }
        dom.padsActive.textContent = activeCount + "/6";
        dom.touchesLeft.textContent = String(state.touchesLeft);
        dom.touchesRight.textContent = String(state.touchesRight);

        const planL = aiVisualPlans.left;
        const planR = aiVisualPlans.right;

        if (state.leftBots.length >= 2) {
          const b0 = Math.round(state.leftBots[0].boost);
          const b1 = Math.round(state.leftBots[1].boost);
          dom.boostL0.style.width = b0 + "%";
          dom.boostL1.style.width = b1 + "%";
          dom.boostTxtL0.textContent = b0 + "%";
          dom.boostTxtL1.textContent = b1 + "%";
          dom.roleL0.textContent = state.humanControlsLeft0 ? "PILOTO WASD" : ((planL && planL.roleLabels[0]) || "DELANTERO");
          dom.roleL1.textContent = (planL && planL.roleLabels[1]) || "PORTERO/DEF";
          dom.stateL0.textContent = state.humanControlsLeft0 ? "CONTROL MANUAL" : ((planL && planL.stateLabels[0]) || "ACTIVO");
          dom.stateL1.textContent = (planL && planL.stateLabels[1]) || "ACTIVO";
        }

        if (state.rightBots.length >= 2) {
          const b0 = Math.round(state.rightBots[0].boost);
          const b1 = Math.round(state.rightBots[1].boost);
          dom.boostR0.style.width = b0 + "%";
          dom.boostR1.style.width = b1 + "%";
          dom.boostTxtR0.textContent = b0 + "%";
          dom.boostTxtR1.textContent = b1 + "%";
          dom.roleR0.textContent = (planR && planR.roleLabels[0]) || "DELANTERO";
          dom.roleR1.textContent = (planR && planR.roleLabels[1]) || "PORTERO/DEF";
          dom.stateR0.textContent = (planR && planR.stateLabels[0]) || "ACTIVO";
          dom.stateR1.textContent = (planR && planR.stateLabels[1]) || "ACTIVO";
        }
      }

      document.getElementById("btnImpulseBall").addEventListener("click", function () {
        if (state.phase !== "PLAYING") return;
        const angles = [-2.45, -0.72, 0.72, 2.45, -1.15, 1.15];
        const a = angles[Math.floor(Math.random() * angles.length)];
        const spd = 760 + Math.random() * 190;
        state.ball.vx = Math.cos(a) * spd;
        state.ball.vy = Math.sin(a) * spd;
        addShockwave(state.ball.x, state.ball.y, COLORS.emerald, 140);
        spawnBurst(state.ball.x, state.ball.y, 18, 90, 290, COLORS.emerald, 3.8);
        audio.hitBall(900);
      });

      document.getElementById("btnTogglePred").addEventListener("click", function () {
        state.showPrediction = !state.showPrediction;
        this.classList.toggle("active-cyan", state.showPrediction);
        document.getElementById("txtTogglePred").textContent = state.showPrediction
          ? "PREDICCION: ON"
          : "PREDICCION: OFF";
      });

      document.getElementById("btnSimSpeed").addEventListener("click", function () {
        if (state.simSpeed === 1) state.simSpeed = 2;
        else if (state.simSpeed === 2) state.simSpeed = 0.5;
        else state.simSpeed = 1;
        document.getElementById("txtSimSpeed").textContent = "VELOCIDAD: " + state.simSpeed + "X";
      });

      document.getElementById("btnControlMode").addEventListener("click", function () {
        state.humanControlsLeft0 = !state.humanControlsLeft0;
        this.classList.toggle("active-gold", !state.humanControlsLeft0);
        this.classList.toggle("active-cyan", state.humanControlsLeft0);
        document.getElementById("txtControlMode").textContent = state.humanControlsLeft0
          ? "PILOTO: WASD + ESPACIO"
          : "MODO: IA VS IA 2V2";
      });

      document.getElementById("btnAudio").addEventListener("click", function () {
        audio.init();
        audio.enabled = !audio.enabled;
        this.classList.toggle("active-emerald", audio.enabled);
        document.getElementById("txtAudio").textContent = audio.enabled
          ? "AUDIO FX: ON"
          : "AUDIO FX: OFF";
        if (audio.enabled) audio.pickupBoost();
      });

      /* =========================================================================
       * 11. ARRANQUE INMEDIATO DESDE 0.0S A 60 FPS
       * ========================================================================= */
      resetFullMatch();
      // Ejecutar un primer calculo tactico instantaneo en t = 0.0s para poblar prediccion
      window.computeSoccerTeamAI(buildWorldStateFor("left"), "left");
      window.computeSoccerTeamAI(buildWorldStateFor("right"), "right");
      renderArena();
      updateHUD(1 / 60);

      let lastTimestamp = performance.now();
      function mainLoop(now) {
        const rawDt = Math.min(0.05, Math.max(0.001, (now - lastTimestamp) * 0.001));
        lastTimestamp = now;

        updateSimulation(rawDt);
        renderArena();
        updateHUD(rawDt);

        requestAnimationFrame(mainLoop);
      }
      requestAnimationFrame(mainLoop);
    })();
  </script>
</body>
</html>
