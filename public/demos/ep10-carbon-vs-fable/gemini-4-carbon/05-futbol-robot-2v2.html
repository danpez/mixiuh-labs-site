<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MIXIUH LABS // FUTBOL ROBOT 2V2 — PREDICCION BALISTICA</title>
  <style>
    :root {
      --bg-void: #060A12;
      --bg-panel: #0F172A;
      --bg-panel-alt: #131E35;
      --border-dim: #1E293B;
      --cyan: #22D3EE;
      --cyan-dim: rgba(34, 211, 238, 0.16);
      --orange: #FB923C;
      --orange-dim: rgba(251, 146, 60, 0.16);
      --emerald: #10B981;
      --gold: #FBBF24;
      --coral: #F43F5E;
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 48%, #0B1324 0%, var(--bg-void) 76%);
      color: var(--text-main);
      font-family: "Inter", "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }

    .app-shell {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
      padding: 10px 16px;
      gap: 8px;
    }

    /* TOP SCOREBOARD & TELEMETRY BAR */
    .top-hud {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 14px;
      height: 78px;
      min-height: 78px;
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.96) 0%, rgba(9, 14, 26, 0.96) 100%);
      border: 1px solid var(--border-dim);
      border-radius: 14px;
      padding: 8px 18px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }

    .team-wing {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .team-wing.right {
      flex-direction: row-reverse;
      text-align: right;
    }

    .team-badge {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      border-radius: 10px;
      font-weight: 800;
      letter-spacing: 0.06em;
      font-size: 14px;
      white-space: nowrap;
    }

    .team-badge.cyan {
      background: var(--cyan-dim);
      border: 1px solid rgba(34, 211, 238, 0.45);
      color: var(--cyan);
      box-shadow: 0 0 18px rgba(34, 211, 238, 0.14);
    }

    .team-badge.orange {
      background: var(--orange-dim);
      border: 1px solid rgba(251, 146, 60, 0.45);
      color: var(--orange);
      box-shadow: 0 0 18px rgba(251, 146, 60, 0.14);
    }

    .bot-cards {
      display: flex;
      gap: 10px;
      flex: 1;
      min-width: 0;
    }

    .team-wing.right .bot-cards {
      justify-content: flex-end;
    }

    .bot-card {
      background: rgba(6, 10, 18, 0.72);
      border: 1px solid var(--border-dim);
      border-radius: 9px;
      padding: 6px 10px;
      min-width: 158px;
      max-width: 215px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .bot-card-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .bot-role-tag {
      font-family: "JetBrains Mono", "SF Mono", Consolas, monospace;
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 4px;
      background: rgba(148, 163, 184, 0.14);
      color: var(--text-muted);
      white-space: nowrap;
    }

    .bot-state-text {
      font-family: "JetBrains Mono", "SF Mono", Consolas, monospace;
      font-size: 10px;
      color: var(--emerald);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .boost-track {
      width: 100%;
      height: 6px;
      background: rgba(30, 41, 59, 0.9);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }

    .boost-fill {
      height: 100%;
      border-radius: 999px;
      transition: width 60ms linear;
      background: linear-gradient(90deg, #F59E0B 0%, var(--gold) 65%, #FEF08A 100%);
      box-shadow: 0 0 8px rgba(251, 191, 36, 0.65);
    }

    /* SCORE & CLOCK CENTERPIECE */
    .center-score-box {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 4px 18px;
      background: rgba(6, 10, 18, 0.86);
      border: 1px solid #26354D;
      border-radius: 12px;
    }

    .score-num {
      font-family: "JetBrains Mono", "SF Mono", Consolas, monospace;
      font-size: 42px;
      font-weight: 900;
      line-height: 1;
      min-width: 48px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .score-num.cyan {
      color: var(--cyan);
      text-shadow: 0 0 20px rgba(34, 211, 238, 0.55);
    }

    .score-num.orange {
      color: var(--orange);
      text-shadow: 0 0 20px rgba(251, 146, 60, 0.55);
    }

    .clock-stack {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 146px;
      gap: 2px;
    }

    .match-kicker {
      font-family: "JetBrains Mono", "SF Mono", Consolas, monospace;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .match-clock {
      font-family: "JetBrains Mono", "SF Mono", Consolas, monospace;
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 0.06em;
      line-height: 1.05;
      color: var(--text-main);
      font-variant-numeric: tabular-nums;
    }

    .match-clock.warn {
      color: var(--gold);
      text-shadow: 0 0 14px rgba(251, 191, 36, 0.5);
    }

    .match-clock.crit {
      color: var(--coral);
      text-shadow: 0 0 16px rgba(244, 63, 94, 0.65);
    }

    .speed-readout {
      font-family: "JetBrains Mono", "SF Mono", Consolas, monospace;
      font-size: 11px;
      font-weight: 700;
      color: var(--emerald);
      letter-spacing: 0.05em;
    }

    /* MAIN ARENA VIEWPORT */
    .arena-stage {
      flex: 1;
      min-height: 0;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 50%, rgba(15, 23, 42, 0.68) 0%, rgba(6, 10, 18, 0.95) 85%);
      border: 1px solid var(--border-dim);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: inset 0 0 60px rgba(0, 0, 0, 0.75);
    }

    #arenaCanvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* BOTTOM CONTROL DECK */
    .bottom-deck {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      height: 56px;
      min-height: 56px;
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.95) 0%, rgba(10, 15, 28, 0.98) 100%);
      border: 1px solid var(--border-dim);
      border-radius: 12px;
      padding: 6px 14px;
    }

    .controls-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: nowrap;
    }

    .ctrl-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      height: 38px;
      padding: 0 13px;
      border-radius: 8px;
      border: 1px solid #293850;
      background: var(--bg-panel-alt);
      color: var(--text-main);
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: all 120ms ease;
      white-space: nowrap;
    }

    .ctrl-btn:hover {
      border-color: var(--cyan);
      background: #192846;
      transform: translateY(-1px);
    }

    .ctrl-btn:active {
      transform: translateY(0);
    }

    .ctrl-btn.active-emerald {
      border-color: rgba(16, 185, 129, 0.65);
      background: rgba(16, 185, 129, 0.14);
      color: #6EE7B7;
    }

    .ctrl-btn.active-cyan {
      border-color: rgba(34, 211, 238, 0.65);
      background: rgba(34, 211, 238, 0.14);
      color: var(--cyan);
    }

    .ctrl-btn.active-gold {
      border-color: rgba(251, 191, 36, 0.65);
      background: rgba(251, 191, 36, 0.14);
      color: var(--gold);
    }

    .ctrl-btn svg {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
    }

    .telemetry-strip {
      display: flex;
      align-items: center;
      gap: 14px;
      font-family: "JetBrains Mono", "SF Mono", Consolas, monospace;
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .telemetry-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 7px;
      background: rgba(6, 10, 18, 0.72);
      border: 1px solid #1E293B;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--emerald);
      box-shadow: 0 0 8px var(--emerald);
    }

    @media (max-width: 1380px) {
      .bot-card {
        min-width: 120px;
      }
      .telemetry-strip .hide-compact {
        display: none;
      }
    }
  </style>
</head>

  <script>
    (function () {
      "use strict";

      /* =========================================================================
       * 1. CONSTANTES FISICAS Y GEOMETRIA DE LA CANCHA NEON
       * ========================================================================= */
      const FIELD_W = 1280;
      const FIELD_H = 736;
      const GOAL_HALF_H = 126;
      const GOAL_DEPTH = 74;
      const CORNER_R = 122;
      const POST_R = 8;

      const BALL_R = 23;
      const BOT_R = 22;
      const MATCH_DURATION = 90.0;

      const CAR_ACCEL = 790;
      const CAR_REV_ACCEL = 600;
      const CAR_BOOST_ACCEL = 700;
      const CAR_MAX_SPEED = 465;
      const CAR_MAX_BOOST_SPEED = 720;
      const CAR_MAX_REV_SPEED = 295;
      const CAR_TURN_RATE = 4.65;
      const CAR_DRIFT_TURN_RATE = 5.45;

      const BALL_DRAG = 0.24;
      const BALL_RESTITUTION = 0.88;
      const BALL_MAX_SPEED = 1040;
      const BOOST_RESPAWN_TIME = 6.5;

      const COLORS = {
        bgVoid: "#060A12",
        panel: "#0F172A",
        cyan: "#22D3EE",
        cyanGlow: "rgba(34, 211, 238, 0.55)",
        orange: "#FB923C",
        orangeGlow: "rgba(251, 146, 60, 0.55)",
        emerald: "#10B981",
        gold: "#FBBF24",
        coral: "#F43F5E",
        white: "#F8FAFC"
      };

      /* =========================================================================
       * 2. UTILIDADES MATEMATICAS Y PREDICCION BALISTICA PURA
       * ========================================================================= */
      function clamp(v, lo, hi) {
        return v < lo ? lo : v > hi ? hi : v;
      }

      function lerp(a, b, t) {
        return a + (b - a) * t;
      }

      function wrapAngle(a) {
        while (a > Math.PI) a -= Math.PI * 2;
        while (a < -Math.PI) a += Math.PI * 2;
        return a;
      }

      /**
       * Simulador balistico puro que calcula trayectoria futura y rebotes elasticos
       * contra paredes rectas y esquinas curvas antes de interceptar.
       */
      function simulateBallisticTrajectory(ballInput, fieldW, fieldH, goalHalfH, horizonSec, stepDt) {
        const W = fieldW || FIELD_W;
        const H = fieldH || FIELD_H;
        const gHalf = goalHalfH || GOAL_HALF_H;
        const cR = Math.min(W, H) * (CORNER_R / FIELD_H);
        const r = (ballInput && ballInput.r > 0) ? ballInput.r : BALL_R;
        const midY = H * 0.5;

        let x = Number(ballInput.x) || W * 0.5;
        let y = Number(ballInput.y) || midY;
        let vx = Number(ballInput.vx) || 0;
        let vy = Number(ballInput.vy) || 0;

        const points = [{ x, y, vx, vy, t: 0, bounced: false }];
        const bounces = [];
        let goalScoredSide = null;
        let leftThreatY = midY;
        let rightThreatY = midY;
        let leftThreatTime = Infinity;
        let rightThreatTime = Infinity;

        const steps = Math.max(1, Math.floor(horizonSec / stepDt));

        for (let i = 1; i <= steps; i++) {
          const t = i * stepDt;
          const damp = Math.max(0, 1 - BALL_DRAG * stepDt);
          vx *= damp;
          vy *= damp;
          x += vx * stepDt;
          y += vy * stepDt;

          let bounced = false;
          const inGoalMouthY = Math.abs(y - midY) < (gHalf - r * 0.28);

          // Comprobar entrada de gol
          if (inGoalMouthY && x < -r * 0.35) {
            goalScoredSide = "left";
            if (t < leftThreatTime) {
              leftThreatTime = t;
              leftThreatY = y;
            }
            points.push({ x, y, vx, vy, t, bounced: false });
            break;
          }
          if (inGoalMouthY && x > W + r * 0.35) {
            goalScoredSide = "right";
            if (t < rightThreatTime) {
              rightThreatTime = t;
              rightThreatY = y;
            }
            points.push({ x, y, vx, vy, t, bounced: false });
            break;
          }

          // Rebotes en las 4 esquinas curvas
          const inCornerX = (x < cR) || (x > W - cR);
          const inCornerY = (y < cR) || (y > H - cR);

          if (inCornerX && inCornerY) {
            const cx = x < cR ? cR : W - cR;
            const cy = y < cR ? cR : H - cR;
            const dx = x - cx;
            const dy = y - cy;
            const dist = Math.hypot(dx, dy);
            const maxDist = Math.max(4, cR - r);
            if (dist > maxDist) {
              const nx = -dx / dist;
              const ny = -dy / dist;
              x = cx - nx * maxDist;
              y = cy - ny * maxDist;
              const vn = vx * nx + vy * ny;
              if (vn < 0) {
                vx -= (1 + BALL_RESTITUTION) * vn * nx;
                vy -= (1 + BALL_RESTITUTION) * vn * ny;
                bounced = true;
              }
            }
          } else {
            // Paredes superior e inferior
            if (y < r) {
              y = r;
              if (vy < 0) {
                vy = -vy * BALL_RESTITUTION;
                bounced = true;
              }
            } else if (y > H - r) {
              y = H - r;
              if (vy > 0) {
                vy = -vy * BALL_RESTITUTION;
                bounced = true;
              }
            }

            // Paredes laterales fuera de la porteria
            if (!inGoalMouthY) {
              if (x < r) {
                x = r;
                if (vx < 0) {
                  vx = -vx * BALL_RESTITUTION;
                  bounced = true;
                }
              } else if (x > W - r) {
                x = W - r;
                if (vx > 0) {
                  vx = -vx * BALL_RESTITUTION;
                  bounced = true;
                }
              }
            }
          }

          if (x < W * 0.14 && t < leftThreatTime) {
            leftThreatTime = t;
            leftThreatY = clamp(y, midY - gHalf * 0.9, midY + gHalf * 0.9);
          }
          if (x > W * 0.86 && t < rightThreatTime) {
            rightThreatTime = t;
            rightThreatY = clamp(y, midY - gHalf * 0.9, midY + gHalf * 0.9);
          }

          if (bounced && bounces.length < 5) {
            bounces.push({ x, y, t });
          }
          points.push({ x, y, vx, vy, t, bounced });
        }

        return {
          points,
          bounces,
          goalScoredSide,
          leftThreatY,
          rightThreatY,
          leftThreatTime,
          rightThreatTime
        };
      }

      /* =========================================================================
       * 3. CONTROLADOR TACTICO PURO IA VS IA (window.computeSoccerTeamAI)
       * ========================================================================= */
      const aiVisualPlans = {
        left: null,
        right: null
      };

      /**
       * Calcula la distancia y normal interior hacia la pared o esquina curva mas cercana.
       */
      function getWallClearance(px, py, W, H, gHalf, cR) {
        const midY = H * 0.5;
        // Esquinas curvas primero
        if ((px < cR || px > W - cR) && (py < cR || py > H - cR)) {
          const cx = px < cR ? cR : W - cR;
          const cy = py < cR ? cR : H - cR;
          const dx = px - cx;
          const dy = py - cy;
          const d = Math.hypot(dx, dy) || 1;
          return {
            dist: Math.max(0, cR - d),
            nx: -dx / d,
            ny: -dy / d
          };
        }

        let minDist = py;
        let nx = 0;
        let ny = 1;

        if (H - py < minDist) {
          minDist = H - py;
          nx = 0;
          ny = -1;
        }

        const inGoalY = Math.abs(py - midY) < gHalf * 0.88;
        if (!inGoalY) {
          if (px < minDist) {
            minDist = px;
            nx = 1;
            ny = 0;
          }
          if (W - px < minDist) {
            minDist = W - px;
            nx = -1;
            ny = 0;
          }
        }

        return { dist: Math.max(0, minDist), nx, ny };
      }

      /**
       * Limita cualquier punto objetivo tactico para mantener margen seguro lejos de esquinas.
       */
      function clampTacticalPoint(tx, ty, W, H, gHalf, cR, margin, allowRightGoal, allowLeftGoal) {
        const midY = H * 0.5;
        let x = tx;
        let y = clamp(ty, margin, H - margin);

        const inMouth = Math.abs(y - midY) < gHalf * 0.78;
        const minX = (allowLeftGoal && inMouth) ? -margin * 0.5 : margin;
        const maxX = (allowRightGoal && inMouth) ? W + margin * 0.5 : W - margin;
        x = clamp(x, minX, maxX);

        if ((x < cR || x > W - cR) && (y < cR || y > H - cR)) {
          const cx = x < cR ? cR : W - cR;
          const cy = y < cR ? cR : H - cR;
          const dx = x - cx;
          const dy = y - cy;
          const d = Math.hypot(dx, dy) || 1;
          const limitR = Math.max(12, cR - margin);
          if (d > limitR) {
            x = cx + (dx / d) * limitR;
            y = cy + (dy / d) * limitR;
          }
        }
        return { x, y };
      }

      /**
       * Convierte un punto objetivo tactico en comandos puros { throttle, steer, boost }
       * con prevencion de orbitas cerradas y escape instantaneo de paredes/esquinas.
       */
      function computeDriveCommand(bot, targetX, targetY, holdAngle, wantBoost, W, H, gHalf, cR) {
        const fx = Math.cos(bot.angle);
        const fy = Math.sin(bot.angle);
        const forwardSpeed = bot.vx * fx + bot.vy * fy;

        // Si el robot esta dentro de una porteria y su objetivo esta fuera, salir primero por el centro del arco
        let effTargetX = targetX;
        let effTargetY = targetY;
        const midY = H * 0.5;
        if (bot.x < H * 0.02 && targetX > H * 0.05) {
          effTargetX = H * 0.065;
          effTargetY = clamp(bot.y, midY - gHalf * 0.52, midY + gHalf * 0.52);
        } else if (bot.x > W - H * 0.02 && targetX < W - H * 0.05) {
          effTargetX = W - H * 0.065;
          effTargetY = clamp(bot.y, midY - gHalf * 0.52, midY + gHalf * 0.52);
        }

        const dx = effTargetX - bot.x;
        const dy = effTargetY - bot.y;
        const dist = Math.hypot(dx, dy);

        // Escape reflejo puro si el morro se frena contra una pared o esquina (forwardSpeed con signo evita oscilacion)
        const wall = getWallClearance(bot.x, bot.y, W, H, gHalf, cR);
        const wallDot = fx * wall.nx + fy * wall.ny;
        if (wall.dist < H * 0.054 && wallDot < -0.48 && forwardSpeed < 95 && dist > H * 0.045) {
          const crossWall = fx * wall.ny - fy * wall.nx;
          return {
            throttle: -0.95,
            steer: crossWall >= 0 ? 0.88 : -0.88,
            boost: false
          };
        }

        // Modo estacionamiento direccional (Portero listo en la linea de sombra)
        if (holdAngle !== null && dist < W * 0.028) {
          const faceErr = wrapAngle(holdAngle - bot.angle);
          const forwardProj = dx * fx + dy * fy;
          return {
            throttle: clamp(forwardProj / (W * 0.025), -0.35, 0.35),
            steer: clamp(faceErr * 2.4, -1, 1),
            boost: false
          };
        }

        const desiredAngle = Math.atan2(dy, dx);
        const angleErr = wrapAngle(desiredAngle - bot.angle);
        const absErr = Math.abs(angleErr);
        const steer = clamp(angleErr * 2.45, -1, 1);

        // Prevencion de orbita circular: si el objetivo esta muy cerca y de lado/atras,
        // reducir aceleracion para girar cerrado con derrape sin rodearlo eternamente.
        if (dist < H * 0.165 && absErr > 1.05) {
          if (dist < H * 0.085 && absErr > 2.25 && wall.dist > H * 0.12) {
            return {
              throttle: -0.75,
              steer: clamp(-angleErr * 1.4, -1, 1),
              boost: false
            };
          }
          return {
            throttle: 0.30,
            steer: angleErr > 0 ? 1 : -1,
            boost: false
          };
        }

        if (absErr > 1.42) {
          return {
            throttle: 0.52,
            steer: angleErr > 0 ? 1 : -1,
            boost: false
          };
        }

        const useBoost = Boolean(wantBoost && absErr < 0.36 && bot.boost > 8 && dist > H * 0.05);
        return {
          throttle: 1.0,
          steer,
          boost: useBoost
        };
      }

      window.computeSoccerTeamAI = function computeSoccerTeamAI(worldState, side) {
        if (!worldState || !worldState.ball) {
          return [
            { throttle: 0, steer: 0, boost: false },
            { throttle: 0, steer: 0, boost: false }
          ];
        }

        const W = Number(worldState.fieldW) || FIELD_W;
        const H = Number(worldState.fieldH) || FIELD_H;
        const gHalf = Number(worldState.goalHalfH) || (H * 0.171);
        const cR = Math.min(W, H) * (CORNER_R / FIELD_H);
        const midX = W * 0.5;
        const midY = H * 0.5;
        const isLeft = side !== "right";
        const attackDir = isLeft ? 1 : -1;

        const rawMy = Array.isArray(worldState.myBots) ? worldState.myBots : [];
        const rawOpp = Array.isArray(worldState.oppBots) ? worldState.oppBots : [];
        const rawPads = Array.isArray(worldState.boostPads) ? worldState.boostPads : [];

        // Autodeteccion de sistema de coordenadas ([0..W, 0..H] vs centrado [-W/2..W/2, -H/2..H/2])
        let isCenteredOrigin = false;
        if (rawPads.length > 0) {
          let sumX = 0;
          let sumY = 0;
          for (let i = 0; i < rawPads.length; i++) {
            sumX += Number(rawPads[i].x) || 0;
            sumY += Number(rawPads[i].y) || 0;
          }
          if (Math.abs(sumX / rawPads.length) < W * 0.18 && Math.abs(sumY / rawPads.length) < H * 0.18) {
            isCenteredOrigin = true;
          }
        } else {
          const checkEntities = [worldState.ball].concat(rawMy, rawOpp);
          for (let i = 0; i < checkEntities.length; i++) {
            const e = checkEntities[i];
            if (e && ((Number(e.y) || 0) < -H * 0.08 || (Number(e.x) || 0) < -W * 0.12)) {
              isCenteredOrigin = true;
              break;
            }
          }
        }

        const offX = isCenteredOrigin ? midX : 0;
        const offY = isCenteredOrigin ? midY : 0;

        // Detectar escala de boost (0..1 vs 0..100)
        let maxRawBoost = 0;
        for (let i = 0; i < rawMy.length; i++) {
          const bVal = Number(rawMy[i] && rawMy[i].boost) || 0;
          if (bVal > maxRawBoost) maxRawBoost = bVal;
        }
        for (let i = 0; i < rawOpp.length; i++) {
          const bVal = Number(rawOpp[i] && rawOpp[i].boost) || 0;
          if (bVal > maxRawBoost) maxRawBoost = bVal;
        }
        const boostScale = (maxRawBoost > 0 && maxRawBoost <= 1.001) ? 100 : 1;

        const ball = {
          x: (Number(worldState.ball.x) || 0) + offX,
          y: (Number(worldState.ball.y) || 0) + offY,
          vx: Number(worldState.ball.vx) || 0,
          vy: Number(worldState.ball.vy) || 0,
          r: Number(worldState.ball.r) || (H * 0.031)
        };

        const myBots = rawMy.map(function (b, idx) {
          return {
            idx,
            x: (Number(b && b.x) || 0) + offX,
            y: (Number(b && b.y) || 0) + offY,
            vx: Number(b && b.vx) || 0,
            vy: Number(b && b.vy) || 0,
            angle: Number(b && b.angle) || (isLeft ? 0 : Math.PI),
            boost: (Number(b && b.boost) || 0) * boostScale
          };
        });

        if (myBots.length === 0) {
          return [
            { throttle: 0, steer: 0, boost: false },
            { throttle: 0, steer: 0, boost: false }
          ];
        }

        const oppBots = rawOpp.map(function (b) {
          return {
            x: (Number(b && b.x) || 0) + offX,
            y: (Number(b && b.y) || 0) + offY,
            vx: Number(b && b.vx) || 0,
            vy: Number(b && b.vy) || 0,
            angle: Number(b && b.angle) || 0,
            boost: (Number(b && b.boost) || 0) * boostScale
          };
        });

        const boostPads = rawPads.map(function (p) {
          return {
            x: (Number(p && p.x) || 0) + offX,
            y: (Number(p && p.y) || 0) + offY,
            active: Boolean(p && p.active)
          };
        });

        // Prediccion balistica multi-rebote (2.35s a 30 muestras/seg)
        const pred = simulateBallisticTrajectory(ball, W, H, gHalf, 2.35, 1 / 30);

        const ownGoalX = isLeft ? 0 : W;
        const oppGoalX = isLeft ? W : 0;
        const botRadiusEst = H * 0.03;
        const safeMargin = botRadiusEst * 1.45;

        // Analizar posicion del portero enemigo para apuntar al hueco libre de la porteria rival
        let oppKeeperY = midY;
        if (oppBots.length > 0) {
          let bestOppDist = Infinity;
          for (let i = 0; i < oppBots.length; i++) {
            const dGoal = Math.abs(oppBots[i].x - oppGoalX);
            if (dGoal < bestOppDist) {
              bestOppDist = dGoal;
              oppKeeperY = oppBots[i].y;
            }
          }
        }

        const ballSpeed = Math.hypot(ball.vx, ball.vy);
        let aimGoalY = oppKeeperY > midY ? (midY - gHalf * 0.48) : (midY + gHalf * 0.48);
        // En saque inicial quieto, romper simetria apuntando con angulo diagonal limpio
        if (ballSpeed < 8 && Math.hypot(ball.x - midX, ball.y - midY) < W * 0.035) {
          aimGoalY = midY - gHalf * 0.38;
        }

        // Funcion para encontrar el punto optimo de intercepcion balistica de un bot
        function findBestIntercept(bot, preferPostBounce) {
          const effSpeed = (H * 0.62) * (bot.boost > 20 ? 1.28 : 1.0);
          let chosen = pred.points[pred.points.length - 1];
          let seenBounce = false;

          for (let i = 0; i < pred.points.length; i++) {
            const pt = pred.points[i];
            if (pt.bounced) seenBounce = true;

            // Si la bola va rapido hacia una pared cercana, esperar el rebote limpio en vez de chocar la pared
            const nearSideWall = (pt.y < cR * 0.52 || pt.y > H - cR * 0.52);
            if (preferPostBounce && !seenBounce && nearSideWall && ballSpeed > H * 0.36 && i < 24) {
              continue;
            }

            const toGoalX = oppGoalX - pt.x;
            const toGoalY = aimGoalY - pt.y;
            const toGoalLen = Math.hypot(toGoalX, toGoalY) || 1;
            const strikeX = pt.x - (toGoalX / toGoalLen) * (ball.r + botRadiusEst * 0.85);
            const strikeY = pt.y - (toGoalY / toGoalLen) * (ball.r + botRadiusEst * 0.85);

            const d = Math.hypot(strikeX - bot.x, strikeY - bot.y);
            const angPenalty = Math.abs(wrapAngle(Math.atan2(strikeY - bot.y, strikeX - bot.x) - bot.angle)) * 0.085;
            const eta = d / effSpeed + angPenalty;

            if (eta <= pt.t + 0.06) {
              chosen = pt;
              break;
            }
          }
          return chosen;
        }

        // Seleccion dinamica de roles entre Delantero (attacker) y Portero/Defensa (defender)
        let attackerIdx = 0;
        let defenderIdx = myBots.length > 1 ? 1 : -1;

        if (myBots.length >= 2) {
          const b0 = myBots[0];
          const b1 = myBots[1];
          const b0OnSide = (ball.x - b0.x) * attackDir >= -ball.r * 0.5;
          const b1OnSide = (ball.x - b1.x) * attackDir >= -ball.r * 0.5;
          const score0 = Math.hypot(ball.x - b0.x, ball.y - b0.y) + (b0OnSide ? 0 : W * 0.34) - W * 0.055;
          const score1 = Math.hypot(ball.x - b1.x, ball.y - b1.y) + (b1OnSide ? 0 : W * 0.34);

          if (score1 < score0) {
            attackerIdx = 1;
            defenderIdx = 0;
          }
        }

        const commands = new Array(myBots.length);
        const roleLabels = new Array(myBots.length);
        const stateLabels = new Array(myBots.length);

        // --- LOGICA DEL DELANTERO (INTERCEPTOR BALISTICO + REMATE) ---
        const atk = myBots[attackerIdx];
        const atkIntercept = findBestIntercept(atk, true);
        roleLabels[attackerIdx] = "DELANTERO";

        const goalVecX = oppGoalX - atkIntercept.x;
        const goalVecY = aimGoalY - atkIntercept.y;
        const goalVecLen = Math.hypot(goalVecX, goalVecY) || 1;
        const ux = goalVecX / goalVecLen;
        const uy = goalVecY / goalVecLen;

        let atkTargetX = atkIntercept.x - ux * (ball.r + botRadiusEst * 0.88);
        let atkTargetY = atkIntercept.y - uy * (ball.r + botRadiusEst * 0.88);
        let atkWantBoost = false;
        let atkAllowGoalEntry = false;

        const atkDistBall = Math.hypot(ball.x - atk.x, ball.y - atk.y);
        const atkWrongSide = (atkIntercept.x - atk.x) * attackDir < -ball.r * 0.35;

        if (atkWrongSide) {
          // Rodear limpiamente el balon sin empujarlo jamas hacia propia puerta
          stateLabels[attackerIdx] = "REPLIEGUE CURVO";
          const detourSign = (atk.y >= atkIntercept.y)
            ? (atkIntercept.y + H * 0.22 < H - safeMargin ? 1 : -1)
            : (atkIntercept.y - H * 0.22 > safeMargin ? -1 : 1);
          atkTargetX = atkIntercept.x - attackDir * (W * 0.105);
          atkTargetY = atkIntercept.y + detourSign * (H * 0.185);
          atkWantBoost = atk.boost > 35 && Math.hypot(atkTargetX - atk.x, atkTargetY - atk.y) > W * 0.18;
        } else if (atkDistBall < W * 0.115 && ((ball.x - atk.x) * ux + (ball.y - atk.y) * uy) > 0) {
          // Ventana de disparo directo a porteria
          stateLabels[attackerIdx] = "DISPARO POTENTE";
          atkTargetX = ball.x + ux * ball.r * 0.45;
          atkTargetY = ball.y + uy * ball.r * 0.45;
          atkWantBoost = true;
          atkAllowGoalEntry = true;
        } else {
          stateLabels[attackerIdx] = atkIntercept.t > 0.32 ? "PREDICCION REBOTE" : "ATAQUE BALON";
          atkWantBoost = Math.hypot(atkTargetX - atk.x, atkTargetY - atk.y) > W * 0.15;

          // Recoger pastilla dorada 100% oportuna en ruta si tiene poco turbo
          if (atk.boost < 32 && Math.abs(ball.x - ownGoalX) > W * 0.32) {
            const toTgtLen = Math.hypot(atkTargetX - atk.x, atkTargetY - atk.y) || 1;
            for (let p = 0; p < boostPads.length; p++) {
              const pad = boostPads[p];
              if (!pad.active) continue;
              const pdx = pad.x - atk.x;
              const pdy = pad.y - atk.y;
              const pDist = Math.hypot(pdx, pdy);
              const align = (pdx * (atkTargetX - atk.x) + pdy * (atkTargetY - atk.y)) / ((pDist || 1) * toTgtLen);
              if (pDist < W * 0.15 && align > 0.58) {
                atkTargetX = pad.x;
                atkTargetY = pad.y;
                stateLabels[attackerIdx] = "RECARGA TURBO";
                break;
              }
            }
          }
        }

        // --- LOGICA DEL PORTERO / DEFENSA (SWEEPER-KEEPER) ---
        let defTargetX = ownGoalX + attackDir * (W * 0.065);
        let defTargetY = midY;
        let defHoldAngle = null;
        let defWantBoost = false;
        let defInterceptVis = null;

        if (defenderIdx !== -1) {
          const def = myBots[defenderIdx];
          roleLabels[defenderIdx] = "PORTERO/DEF";

          const ballDistOwnGoalX = (ball.x - ownGoalX) * attackDir;
          const ballHeadingHome = (ball.vx * attackDir) < -35;
          const threatY = isLeft ? pred.leftThreatY : pred.rightThreatY;
          const threatTime = isLeft ? pred.leftThreatTime : pred.rightThreatTime;

          const defBehindBall = (ball.x - def.x) * attackDir > -ball.r * 0.25;

          if (ballDistOwnGoalX < W * 0.26 && defBehindBall) {
            // Despeje explosivo fuera del area de peligro
            const clearPt = findBestIntercept(def, false);
            defInterceptVis = clearPt;
            const clearTargetY = clearPt.y < midY ? H * 0.18 : H * 0.82;
            const cVecX = oppGoalX - clearPt.x;
            const cVecY = clearTargetY - clearPt.y;
            const cLen = Math.hypot(cVecX, cVecY) || 1;
            defTargetX = clearPt.x - (cVecX / cLen) * (ball.r + botRadiusEst * 0.8);
            defTargetY = clearPt.y - (cVecY / cLen) * (ball.r + botRadiusEst * 0.8);
            defWantBoost = true;
            stateLabels[defenderIdx] = "DESPEJE AREA";
          } else if (ballDistOwnGoalX < W * 0.54 || ballHeadingHome || threatTime < 1.8) {
            // Sombra activa cubriendo la proyeccion balistica sobre el arco propio
            const shadowY = threatTime < 2.2
              ? threatY
              : clamp(lerp(midY, ball.y + ball.vy * 0.28, 0.72), midY - gHalf * 0.82, midY + gHalf * 0.82);
            defTargetX = ownGoalX + attackDir * (W * 0.062);
            defTargetY = clamp(shadowY, midY - gHalf * 0.82, midY + gHalf * 0.82);
            defHoldAngle = Math.atan2(ball.y - def.y, ball.x - def.x);
            defWantBoost = Math.hypot(defTargetX - def.x, defTargetY - def.y) > W * 0.14;
            stateLabels[defenderIdx] = "SOMBRA ARCO";
            defInterceptVis = { x: defTargetX, y: defTargetY, t: 0.4 };
          } else {
            // Apoyo adelantado en mediocampo o recarga segura de Boost 100%
            let pickedPad = null;
            if (def.boost < 58) {
              let bestPadDist = W * 0.26;
              for (let p = 0; p < boostPads.length; p++) {
                const pad = boostPads[p];
                if (!pad.active) continue;
                const padOwnX = (pad.x - ownGoalX) * attackDir;
                if (padOwnX < W * 0.54) {
                  const d = Math.hypot(pad.x - def.x, pad.y - def.y);
                  if (d < bestPadDist) {
                    bestPadDist = d;
                    pickedPad = pad;
                  }
                }
              }
            }

            if (pickedPad) {
              defTargetX = pickedPad.x;
              defTargetY = pickedPad.y;
              defWantBoost = false;
              stateLabels[defenderIdx] = "TURBO 100%";
            } else {
              const midSample = pred.points[Math.min(18, pred.points.length - 1)];
              defTargetX = ownGoalX + attackDir * (W * 0.31);
              defTargetY = clamp(lerp(midY, midSample.y, 0.48), H * 0.20, H * 0.80);
              defHoldAngle = Math.atan2(ball.y - def.y, ball.x - def.x);
              defWantBoost = Math.hypot(defTargetX - def.x, defTargetY - def.y) > W * 0.22 && def.boost > 50;
              stateLabels[defenderIdx] = "APOYO MEDIO";
            }
            defInterceptVis = { x: defTargetX, y: defTargetY, t: 0.5 };
          }

          // Separacion suave entre companeros para evitar estorbarse
          const teamDx = def.x - atk.x;
          const teamDy = def.y - atk.y;
          const teamDist = Math.hypot(teamDx, teamDy);
          if (teamDist < H * 0.14 && teamDist > 0.001) {
            const push = (H * 0.14 - teamDist) * 0.85;
            defTargetX += (teamDx / teamDist) * push;
            defTargetY += (teamDy / teamDist) * push;
          }

          const clampedDef = clampTacticalPoint(
            defTargetX,
            defTargetY,
            W,
            H,
            gHalf,
            cR,
            safeMargin,
            false,
            false
          );
          commands[defenderIdx] = computeDriveCommand(
            def,
            clampedDef.x,
            clampedDef.y,
            defHoldAngle,
            defWantBoost,
            W,
            H,
            gHalf,
            cR
          );
        }

        const clampedAtk = clampTacticalPoint(
          atkTargetX,
          atkTargetY,
          W,
          H,
          gHalf,
          cR,
          safeMargin,
          isLeft && atkAllowGoalEntry,
          !isLeft && atkAllowGoalEntry
        );
        commands[attackerIdx] = computeDriveCommand(
          atk,
          clampedAtk.x,
          clampedAtk.y,
          null,
          atkWantBoost,
          W,
          H,
          gHalf,
          cR
        );

        // Guardar telemetria visual de prediccion para el HUD sin mutar worldState
        if (!isCenteredOrigin && Math.abs(W - FIELD_W) < 2) {
          aiVisualPlans[isLeft ? "left" : "right"] = {
            predPoints: pred.points,
            bounces: pred.bounces,
            attackerIdx,
            defenderIdx,
            interceptPt: atkIntercept,
            defPt: defInterceptVis,
            aimGoalY,
            roleLabels,
            stateLabels
          };
        }

        // Rellenar cualquier bot extra si un arnes externo enviara >2 bots
        for (let i = 0; i < myBots.length; i++) {
          if (!commands[i]) {
            commands[i] = computeDriveCommand(myBots[i], ball.x, ball.y, null, false, W, H, gHalf, cR);
          }
        }

        return commands;
      };

      /* =========================================================================
       * 4. SINTETIZADOR PROCEDURAL WEBAUDIO (CERO ARCHIVOS EXTERNOS)
       * ========================================================================= */
      const audio = {
        enabled: false,
        ctx: null,
        init() {
          if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) this.ctx = new AudioCtx();
          }
          if (this.ctx && this.ctx.state === "suspended") {
            this.ctx.resume();
          }
        },
        playTone(freqStart, freqEnd, duration, type, gainVal) {
          if (!this.enabled || !this.ctx) return;
          try {
            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = type || "sine";
            osc.frequency.setValueAtTime(freqStart, now);
            osc.frequency.exponentialRampToValueAtTime(Math.max(25, freqEnd), now + duration);
            gain.gain.setValueAtTime(gainVal || 0.08, now);
            gain.gain.exponentialRampToValueAtTime(0.0008, now + duration);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + duration);
          } catch (_) {
            // Silenciar si el navegador bloquea audio antes de interaccion
          }
        },
        hitBall(power) {
          const norm = clamp(power / 800, 0.2, 1);
          this.playTone(150 + norm * 160, 48, 0.14, "triangle", 0.09 * norm);
        },
        wallBounce(speed) {
          const norm = clamp(speed / 700, 0.15, 1);
          this.playTone(340 + norm * 240, 140, 0.08, "sine", 0.05 * norm);
        },
        postClang() {
          this.playTone(920, 420, 0.22, "sawtooth", 0.08);
        },
        pickupBoost() {
          this.playTone(420, 980, 0.18, "sine", 0.07);
        },
        carBump() {
          this.playTone(120, 52, 0.10, "square", 0.05);
        },
        goalHorn(isLeft) {
          if (!this.enabled || !this.ctx) return;
          const root = isLeft ? 220 : 196;
          this.playTone(root, root * 1.01, 0.55, "sawtooth", 0.08);
          this.playTone(root * 1.25, root * 1.26, 0.55, "sawtooth", 0.07);
          this.playTone(root * 1.5, root * 1.52, 0.65, "triangle", 0.08);
        }
      };

      /* =========================================================================
       * 5. ESTADO COMPLETO DE LA ARENA Y MOTOR FISICO 60 FPS
       * ========================================================================= */
      const PAD_LAYOUT = [
        { x: 210, y: 126 },
        { x: 210, y: FIELD_H - 126 },
        { x: FIELD_W * 0.5, y: 84 },
        { x: FIELD_W * 0.5, y: FIELD_H - 84 },
        { x: FIELD_W - 210, y: 126 },
        { x: FIELD_W - 210, y: FIELD_H - 126 }
      ];

      const state = {
        paused: false,
        simSpeed: 1,
        showPrediction: true,
        humanControlsLeft0: false,
        matchNumber: 1,
        timeLeft: MATCH_DURATION,
        overtime: false,
        scoreLeft: 0,
        scoreRight: 0,
        touchesLeft: 0,
        touchesRight: 0,
        kickoffSeed: 1,
        phase: "PLAYING", // PLAYING | GOAL_CELEBRATION | REPLAY
        phaseTimer: 0,
        lastGoalInfo: null,
        cameraShake: 0,
        ball: {
          x: FIELD_W * 0.5,
          y: FIELD_H * 0.5,
          vx: 0,
          vy: 0,
          r: BALL_R,
          spin: 0,
          rot: 0,
          lastSide: null,
          lastBotName: "",
          trail: []
        },
        leftBots: [],
        rightBots: [],
        boostPads: [],
        particles: [],
        skidMarks: [],
        wallRipples: [],
        shockwaves: [],
        replayBuffer: [],
        replayPlaybackIdx: 0
      };

      function createBot(side, index, x, y, angle) {
        const prefix = side === "left" ? "CIAN" : "NARANJA";
        return {
          side,
          index,
          name: prefix + "-0" + (index + 1),
          x,
          y,
          vx: 0,
          vy: 0,
          angle,
          steerVis: 0,
          boost: 100,
          isBoosting: false,
          drifting: false,
          lastTouchTime: -10
        };
      }

      function setupFormation(launchBallImmediately) {
        const midX = FIELD_W * 0.5;
        const midY = FIELD_H * 0.5;

        state.leftBots = [
          createBot("left", 0, midX - 245, midY + 42, -0.10),
          createBot("left", 1, 118, midY - 26, 0.0)
        ];

        state.rightBots = [
          createBot("right", 0, midX + 245, midY - 42, Math.PI - 0.10),
          createBot("right", 1, FIELD_W - 118, midY + 26, Math.PI)
        ];

        state.ball.x = midX;
        state.ball.y = midY;
        state.ball.spin = 0;
        state.ball.trail = [];

        if (launchBallImmediately) {
          // Saque energetico vivo desde t = 0.0s para accion y prediccion balistica inmediata
          const dirX = (state.kickoffSeed % 2 === 0) ? 1 : -1;
          const dirY = (state.kickoffSeed % 3 === 0) ? 1 : -1;
          state.kickoffSeed++;
          state.ball.vx = dirX * 155;
          state.ball.vy = dirY * 235;
        } else {
          state.ball.vx = 0;
          state.ball.vy = 0;
        }
      }

      function resetBoostPads() {
        state.boostPads = PAD_LAYOUT.map(function (p) {
          return {
            x: p.x,
            y: p.y,
            active: true,
            cooldown: 0,
            pulse: Math.random() * Math.PI * 2
          };
        });
      }

      function resetFullMatch() {
        state.scoreLeft = 0;
        state.scoreRight = 0;
        state.touchesLeft = 0;
        state.touchesRight = 0;
        state.timeLeft = MATCH_DURATION;
        state.overtime = false;
        state.phase = "PLAYING";
        state.phaseTimer = 0;
        state.particles = [];
        state.skidMarks = [];
        state.wallRipples = [];
        state.shockwaves = [];
        state.replayBuffer = [];
        resetBoostPads();
        setupFormation(true);
      }

      // Exponer hook de auditoria inmediatamente
      window.__auditSoccer = function __auditSoccer() {
        return {
          scoreLeft: state.scoreLeft,
          scoreRight: state.scoreRight,
          ballSpeed: Math.hypot(state.ball.vx, state.ball.vy),
          aiHookReady: typeof window.computeSoccerTeamAI === "function"
        };
      };

      /* =========================================================================
       * 6. PARTICULAS, ESTELAS DE FUEGO/PLASMA Y REPETICION DE GOL
       * ========================================================================= */
      function spawnParticle(x, y, vx, vy, life, size, color) {
        if (state.particles.length > 360) return;
        state.particles.push({ x, y, vx, vy, life, maxLife: life, size, color });
      }

      function spawnBurst(x, y, count, speedMin, speedMax, color, sizeBase) {
        for (let i = 0; i < count; i++) {
          const a = Math.random() * Math.PI * 2;
          const sp = speedMin + Math.random() * (speedMax - speedMin);
          spawnParticle(
            x,
            y,
            Math.cos(a) * sp,
            Math.sin(a) * sp,
            0.24 + Math.random() * 0.38,
            (sizeBase || 3.5) * (0.65 + Math.random() * 0.7),
            color
          );
        }
      }

      function addWallRipple(x, y, color, intensity) {
        state.wallRipples.push({
          x,
          y,
          color,
          r: 8,
          maxR: 46 + intensity * 38,
          alpha: clamp(0.45 + intensity * 0.45, 0.3, 0.95)
        });
      }

      function addShockwave(x, y, color, maxR) {
        state.shockwaves.push({
          x,
          y,
          color,
          r: 14,
          maxR: maxR || 260,
          alpha: 0.95
        });
      }

      function recordReplayFrame() {
        const snap = {
          ball: {
            x: state.ball.x,
            y: state.ball.y,
            rot: state.ball.rot,
            lastSide: state.ball.lastSide
          },
          bots: state.leftBots.concat(state.rightBots).map(function (b) {
            return {
              side: b.side,
              name: b.name,
              x: b.x,
              y: b.y,
              angle: b.angle,
              boost: b.boost,
              isBoosting: b.isBoosting,
              drifting: b.drifting
            };
          }),
          pads: state.boostPads.map(function (p) {
            return p.active;
          })
        };
        state.replayBuffer.push(snap);
        if (state.replayBuffer.length > 135) {
          state.replayBuffer.shift();
        }
      }

      /* =========================================================================
       * 7. ENTRADA DE TECLADO (MODO OPCIONAL JUGADOR EN CIAN-01)
       * ========================================================================= */
      const keys = Object.create(null);
      window.addEventListener("keydown", function (e) {
        keys[e.code] = true;
        if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].indexOf(e.code) !== -1 && state.humanControlsLeft0) {
          e.preventDefault();
        }
      });
      window.addEventListener("keyup", function (e) {
        keys[e.code] = false;
      });

      function getHumanCommand() {
        let throttle = 0;
        if (keys["KeyW"] || keys["ArrowUp"]) throttle += 1;
        if (keys["KeyS"] || keys["ArrowDown"]) throttle -= 1;
        let steer = 0;
        if (keys["KeyD"] || keys["ArrowRight"]) steer += 1;
        if (keys["KeyA"] || keys["ArrowLeft"]) steer -= 1;
        const boost = Boolean(keys["Space"] || keys["ShiftLeft"] || keys["ShiftRight"]);
        return { throttle, steer, boost };
      }

      /* =========================================================================
       * 8. PASO DE SIMULACION FISICA CON SUBSTEPS
       * ========================================================================= */
      function buildWorldStateFor(side) {
        const own = side === "left" ? state.leftBots : state.rightBots;
        const opp = side === "left" ? state.rightBots : state.leftBots;
        return {
          fieldW: FIELD_W,
          fieldH: FIELD_H,
          goalHalfH: GOAL_HALF_H,
          ball: {
            x: state.ball.x,
            y: state.ball.y,
            vx: state.ball.vx,
            vy: state.ball.vy,
            r: state.ball.r
          },
          myBots: own.map(function (b) {
            return { x: b.x, y: b.y, vx: b.vx, vy: b.vy, angle: b.angle, boost: b.boost };
          }),
          oppBots: opp.map(function (b) {
            return { x: b.x, y: b.y, vx: b.vx, vy: b.vy, angle: b.angle, boost: b.boost };
          }),
          boostPads: state.boostPads.map(function (p) {
            return { x: p.x, y: p.y, active: p.active };
          })
        };
      }

      const GOAL_POSTS = [
        { x: 0, y: FIELD_H * 0.5 - GOAL_HALF_H },
        { x: 0, y: FIELD_H * 0.5 + GOAL_HALF_H },
        { x: FIELD_W, y: FIELD_H * 0.5 - GOAL_HALF_H },
        { x: FIELD_W, y: FIELD_H * 0.5 + GOAL_HALF_H }
      ];

      function stepBotPhysics(bot, cmd, dt) {
        const throttle = clamp(Number(cmd && cmd.throttle) || 0, -1, 1);
        const steer = clamp(Number(cmd && cmd.steer) || 0, -1, 1);
        const wantBoost = Boolean(cmd && cmd.boost) && bot.boost > 0.5;

        bot.steerVis = lerp(bot.steerVis, steer, Math.min(1, dt * 14));

        const fx = Math.cos(bot.angle);
        const fy = Math.sin(bot.angle);
        const rx = -fy;
        const ry = fx;

        let vf = bot.vx * fx + bot.vy * fy;
        let vl = bot.vx * rx + bot.vy * ry;

        // Detectar derrape fisico real cuando gira fuerte a velocidad
        const isDrifting = Math.abs(steer) > 0.62 && Math.abs(vf) > 185;
        bot.drifting = isDrifting;

        const turnRate = isDrifting ? CAR_DRIFT_TURN_RATE : CAR_TURN_RATE;
        bot.angle = wrapAngle(bot.angle + steer * turnRate * dt);

        // Propulsion y frenado
        if (throttle > 0) {
          if (vf < 0) vf *= Math.exp(-5.0 * dt);
          vf += throttle * CAR_ACCEL * dt;
        } else if (throttle < 0) {
          if (vf > 0) vf *= Math.exp(-5.0 * dt);
          vf += throttle * CAR_REV_ACCEL * dt;
        } else {
          vf *= Math.exp(-2.2 * dt);
        }

        if (wantBoost) {
          vf += CAR_BOOST_ACCEL * dt;
          bot.boost = Math.max(0, bot.boost - 35 * dt);
          bot.isBoosting = true;
        } else {
          bot.boost = Math.min(100, bot.boost + 2.6 * dt);
          bot.isBoosting = false;
        }

        // Agarre lateral vs derrape fisico
        const lateralGrip = isDrifting ? 2.95 : 8.8;
        vl *= Math.exp(-lateralGrip * dt);
        vf *= Math.exp(-0.92 * dt);

        const nfX = Math.cos(bot.angle);
        const nfY = Math.sin(bot.angle);
        const nrX = -nfY;
        const nrY = nfX;

        bot.vx = nfX * vf + nrX * vl;
        bot.vy = nfY * vf + nrY * vl;

        const maxSpd = bot.isBoosting ? CAR_MAX_BOOST_SPEED : (vf < -10 ? CAR_MAX_REV_SPEED : CAR_MAX_SPEED);
        const curSpd = Math.hypot(bot.vx, bot.vy);
        if (curSpd > maxSpd) {
          bot.vx = (bot.vx / curSpd) * maxSpd;
          bot.vy = (bot.vy / curSpd) * maxSpd;
        }

        bot.x += bot.vx * dt;
        bot.y += bot.vy * dt;

        // Colision elastica del robot contra paredes curvas y porterias
        const midY = FIELD_H * 0.5;
        const inGoalY = Math.abs(bot.y - midY) < (GOAL_HALF_H - BOT_R * 0.55);

        if ((bot.x < CORNER_R || bot.x > FIELD_W - CORNER_R) && (bot.y < CORNER_R || bot.y > FIELD_H - CORNER_R)) {
          const cx = bot.x < CORNER_R ? CORNER_R : FIELD_W - CORNER_R;
          const cy = bot.y < CORNER_R ? CORNER_R : FIELD_H - CORNER_R;
          const dx = bot.x - cx;
          const dy = bot.y - cy;
          const d = Math.hypot(dx, dy) || 1;
          const maxR = CORNER_R - BOT_R;
          if (d > maxR) {
            const nx = -dx / d;
            const ny = -dy / d;
            bot.x = cx - nx * maxR;
            bot.y = cy - ny * maxR;
            const vn = bot.vx * nx + bot.vy * ny;
            if (vn < 0) {
              bot.vx -= 1.35 * vn * nx;
              bot.vy -= 1.35 * vn * ny;
            }
          }
        } else {
          if (bot.y < BOT_R) {
            bot.y = BOT_R;
            if (bot.vy < 0) bot.vy *= -0.35;
          } else if (bot.y > FIELD_H - BOT_R) {
            bot.y = FIELD_H - BOT_R;
            if (bot.vy > 0) bot.vy *= -0.35;
          }

          if (inGoalY) {
            const minX = -GOAL_DEPTH + BOT_R;
            const maxX = FIELD_W + GOAL_DEPTH - BOT_R;
            if (bot.x < minX) {
              bot.x = minX;
              if (bot.vx < 0) bot.vx *= -0.35;
            } else if (bot.x > maxX) {
              bot.x = maxX;
              if (bot.vx > 0) bot.vx *= -0.35;
            }
            if (bot.x < BOT_R * 0.4 || bot.x > FIELD_W - BOT_R * 0.4) {
              const gTopWall = midY - GOAL_HALF_H + BOT_R;
              const gBotWall = midY + GOAL_HALF_H - BOT_R;
              if (bot.y < gTopWall) {
                bot.y = gTopWall;
                if (bot.vy < 0) bot.vy *= -0.35;
              } else if (bot.y > gBotWall) {
                bot.y = gBotWall;
                if (bot.vy > 0) bot.vy *= -0.35;
              }
            }
          } else {
            if (bot.x < BOT_R) {
              bot.x = BOT_R;
              if (bot.vx < 0) bot.vx *= -0.35;
            } else if (bot.x > FIELD_W - BOT_R) {
              bot.x = FIELD_W - BOT_R;
              if (bot.vx > 0) bot.vx *= -0.35;
            }
          }
        }

        // Colision contra los 4 postes de las porterias
        for (let p = 0; p < GOAL_POSTS.length; p++) {
          const post = GOAL_POSTS[p];
          const dx = bot.x - post.x;
          const dy = bot.y - post.y;
          const d = Math.hypot(dx, dy);
          const minD = BOT_R + POST_R;
          if (d < minD && d > 0.0001) {
            const nx = dx / d;
            const ny = dy / d;
            bot.x = post.x + nx * minD;
            bot.y = post.y + ny * minD;
            const vn = bot.vx * nx + bot.vy * ny;
            if (vn < 0) {
              bot.vx -= 1.45 * vn * nx;
              bot.vy -= 1.45 * vn * ny;
            }
          }
        }
      }

      function emitCarTrails(bot) {
        const fx = Math.cos(bot.angle);
        const fy = Math.sin(bot.angle);
        const rx = -fy;
        const ry = fx;
        const speed = Math.hypot(bot.vx, bot.vy);

        // Estelas de fuego / plasma en los propulsores traseros
        if (bot.isBoosting || speed > 130) {
          const rearX = bot.x - fx * 22;
          const rearY = bot.y - fy * 22;
          const count = bot.isBoosting ? 2 : (Math.random() < 0.55 ? 1 : 0);
          for (let n = 0; n < count; n++) {
            const nozzleSign = n === 0 ? -1 : 1;
            const px = rearX + rx * (nozzleSign * 7);
            const py = rearY + ry * (nozzleSign * 7);
            const jetSpeed = bot.isBoosting ? 180 + Math.random() * 90 : 75 + Math.random() * 45;
            const spread = (Math.random() - 0.5) * 36;
            const pColor = bot.side === "left"
              ? (bot.isBoosting ? (Math.random() < 0.45 ? COLORS.gold : COLORS.cyan) : COLORS.cyan)
              : (bot.isBoosting ? (Math.random() < 0.5 ? COLORS.gold : COLORS.coral) : COLORS.orange);

            spawnParticle(
              px,
              py,
              -fx * jetSpeed + rx * spread,
              -fy * jetSpeed + ry * spread,
              bot.isBoosting ? 0.24 : 0.16,
              bot.isBoosting ? 5.2 : 3.2,
              pColor
            );
          }
        }

        // Huellas de neumaticos en el piso durante derrape fisico
        if (bot.drifting && speed > 180) {
          const rearAxleX = bot.x - fx * 14;
          const rearAxleY = bot.y - fy * 14;
          state.skidMarks.push({
            x1: rearAxleX + rx * 10,
            y1: rearAxleY + ry * 10,
            x2: rearAxleX - rx * 10,
            y2: rearAxleY - ry * 10,
            color: bot.side === "left" ? "rgba(34, 211, 238, 0.30)" : "rgba(251, 146, 60, 0.30)",
            alpha: 0.55
          });
          if (state.skidMarks.length > 220) state.skidMarks.shift();
        }
      }

      function resolveBotVsBotCollisions(allBots) {
        for (let i = 0; i < allBots.length; i++) {
          for (let j = i + 1; j < allBots.length; j++) {
            const a = allBots[i];
            const b = allBots[j];
            const dx = b.x - a.x;
            const dy = b.y - a.y;
            const d = Math.hypot(dx, dy);
            const minD = BOT_R * 2;
            if (d < minD && d > 0.0001) {
              const nx = dx / d;
              const ny = dy / d;
              const overlap = (minD - d) * 0.52;
              a.x -= nx * overlap;
              a.y -= ny * overlap;
              b.x += nx * overlap;
              b.y += ny * overlap;

              const rvx = b.vx - a.vx;
              const rvy = b.vy - a.vy;
              const rvn = rvx * nx + rvy * ny;
              if (rvn < 0) {
                const imp = -(1 + 0.74) * rvn * 0.5;
                a.vx -= imp * nx;
                a.vy -= imp * ny;
                b.vx += imp * nx;
                b.vy += imp * ny;

                if (Math.abs(rvn) > 150) {
                  const mx = (a.x + b.x) * 0.5;
                  const my = (a.y + b.y) * 0.5;
                  spawnBurst(mx, my, 8, 60, 210, COLORS.gold, 3.0);
                  state.cameraShake = Math.min(8, state.cameraShake + Math.abs(rvn) * 0.008);
                  audio.carBump();
                }
              }
            }
          }
        }
      }

      function stepBallAndTouches(allBots, dt, simClock) {
        const ball = state.ball;
        const midY = FIELD_H * 0.5;

        const damp = Math.exp(-BALL_DRAG * dt);
        ball.vx *= damp;
        ball.vy *= damp;
        ball.x += ball.vx * dt;
        ball.y += ball.vy * dt;
        ball.rot += (Math.hypot(ball.vx, ball.vy) * 0.014 + ball.spin) * dt;
        ball.spin *= Math.exp(-1.5 * dt);

        // Suave pendiente anti-estancamiento en los bordes curvos si el balon pierde velocidad
        const wallInfo = getWallClearance(ball.x, ball.y, FIELD_W, FIELD_H, GOAL_HALF_H, CORNER_R);
        const bSpd = Math.hypot(ball.vx, ball.vy);
        if (wallInfo.dist < BALL_R + 18 && bSpd < 95) {
          ball.vx += wallInfo.nx * 145 * dt;
          ball.vy += wallInfo.ny * 145 * dt;
        }

        // Choques coche vs balon
        let touchesThisStep = 0;
        for (let i = 0; i < allBots.length; i++) {
          const bot = allBots[i];
          const dx = ball.x - bot.x;
          const dy = ball.y - bot.y;
          const d = Math.hypot(dx, dy);
          const minD = BOT_R + ball.r;

          if (d < minD && d > 0.0001) {
            touchesThisStep++;
            const nx = dx / d;
            const ny = dy / d;
            ball.x = bot.x + nx * (minD + 0.5);
            ball.y = bot.y + ny * (minD + 0.5);

            const fx = Math.cos(bot.angle);
            const fy = Math.sin(bot.angle);
            const rvx = ball.vx - bot.vx;
            const rvy = ball.vy - bot.vy;
            const rvn = rvx * nx + rvy * ny;

            if (rvn < 0) {
              const massRatio = 1.38;
              const j = -(1 + 0.84) * rvn * massRatio / (1 + massRatio);
              ball.vx += j * nx;
              ball.vy += j * ny;
              bot.vx -= (j * 0.22) * nx;
              bot.vy -= (j * 0.22) * ny;
            }

            // Impulso extra de tiro frontal propulsado
            const botSpeed = Math.hypot(bot.vx, bot.vy);
            const noseAlign = Math.max(0, fx * nx + fy * ny);
            const powerBonus = (85 + botSpeed * 0.36 + (bot.isBoosting ? 125 : 0)) * (0.45 + 0.55 * noseAlign);
            const shotDirX = nx * 0.72 + fx * 0.28;
            const shotDirY = ny * 0.72 + fy * 0.28;
            const shotLen = Math.hypot(shotDirX, shotDirY) || 1;

            ball.vx += (shotDirX / shotLen) * powerBonus;
            ball.vy += (shotDirY / shotLen) * powerBonus;
            ball.spin = (fx * ny - fy * nx) * 6;

            if (simClock - bot.lastTouchTime > 0.14) {
              bot.lastTouchTime = simClock;
              if (bot.side === "left") state.touchesLeft++;
              else state.touchesRight++;
              ball.lastSide = bot.side;
              ball.lastBotName = bot.name;

              const hitColor = bot.side === "left" ? COLORS.cyan : COLORS.orange;
              spawnBurst(ball.x - nx * ball.r, ball.y - ny * ball.r, 10, 80, 260, hitColor, 3.6);
              audio.hitBall(Math.hypot(ball.vx, ball.vy));
            }
          }
        }

        // Resolucion de "pinch" cuando 2 autos comprimen el balon simultaneamente
        if (touchesThisStep >= 2) {
          const toCenterY = (midY - ball.y) >= 0 ? 1 : -1;
          if (Math.abs(ball.vy) < 120) {
            ball.vy += toCenterY * 260;
          }
          ball.vx *= 1.18;
          spawnBurst(ball.x, ball.y, 14, 120, 340, COLORS.gold, 4.2);
        }

        // Limitar velocidad maxima del balon
        const newBallSpd = Math.hypot(ball.vx, ball.vy);
        if (newBallSpd > BALL_MAX_SPEED) {
          ball.vx = (ball.vx / newBallSpd) * BALL_MAX_SPEED;
          ball.vy = (ball.vy / newBallSpd) * BALL_MAX_SPEED;
        }

        // Comprobar GOL antes de paredes laterales
        const inGoalMouthY = Math.abs(ball.y - midY) < (GOAL_HALF_H - ball.r * 0.2);
        if (inGoalMouthY && ball.x < -ball.r * 0.55) {
          triggerGoal("right");
          return;
        }
        if (inGoalMouthY && ball.x > FIELD_W + ball.r * 0.55) {
          triggerGoal("left");
          return;
        }

        // Rebotes en postes metalicos de porteria
        for (let p = 0; p < GOAL_POSTS.length; p++) {
          const post = GOAL_POSTS[p];
          const dx = ball.x - post.x;
          const dy = ball.y - post.y;
          const d = Math.hypot(dx, dy);
          const minD = ball.r + POST_R;
          if (d < minD && d > 0.0001) {
            const nx = dx / d;
            const ny = dy / d;
            ball.x = post.x + nx * minD;
            ball.y = post.y + ny * minD;
            const vn = ball.vx * nx + ball.vy * ny;
            if (vn < 0) {
              ball.vx -= (1 + 0.90) * vn * nx;
              ball.vy -= (1 + 0.90) * vn * ny;
              spawnBurst(post.x, post.y, 14, 90, 290, COLORS.gold, 3.5);
              addWallRipple(post.x, post.y, COLORS.gold, 0.9);
              audio.postClang();
            }
          }
        }

        // Rebotes elasticos en las 4 esquinas curvas y paredes neon
        if ((ball.x < CORNER_R || ball.x > FIELD_W - CORNER_R) && (ball.y < CORNER_R || ball.y > FIELD_H - CORNER_R)) {
          const cx = ball.x < CORNER_R ? CORNER_R : FIELD_W - CORNER_R;
          const cy = ball.y < CORNER_R ? CORNER_R : FIELD_H - CORNER_R;
          const dx = ball.x - cx;
          const dy = ball.y - cy;
          const d = Math.hypot(dx, dy) || 1;
          const maxR = CORNER_R - ball.r;
          if (d > maxR) {
            const nx = -dx / d;
            const ny = -dy / d;
            ball.x = cx - nx * maxR;
            ball.y = cy - ny * maxR;
            const vn = ball.vx * nx + ball.vy * ny;
            if (vn < 0) {
              ball.vx -= (1 + BALL_RESTITUTION) * vn * nx;
              ball.vy -= (1 + BALL_RESTITUTION) * vn * ny;
              if (Math.abs(vn) > 65) {
                addWallRipple(cx - nx * CORNER_R, cy - ny * CORNER_R, COLORS.emerald, Math.abs(vn) / 650);
                audio.wallBounce(Math.abs(vn));
              }
            }
          }
        } else {
          if (ball.y < ball.r) {
            ball.y = ball.r;
            if (ball.vy < 0) {
              const imp = Math.abs(ball.vy);
              ball.vy = -ball.vy * BALL_RESTITUTION;
              if (imp > 65) {
                addWallRipple(ball.x, 0, COLORS.cyan, imp / 650);
                audio.wallBounce(imp);
              }
            }
          } else if (ball.y > FIELD_H - ball.r) {
            ball.y = FIELD_H - ball.r;
            if (ball.vy > 0) {
              const imp = Math.abs(ball.vy);
              ball.vy = -ball.vy * BALL_RESTITUTION;
              if (imp > 65) {
                addWallRipple(ball.x, FIELD_H, COLORS.orange, imp / 650);
                audio.wallBounce(imp);
              }
            }
          }

          if (!inGoalMouthY) {
            if (ball.x < ball.r) {
              ball.x = ball.r;
              if (ball.vx < 0) {
                const imp = Math.abs(ball.vx);
                ball.vx = -ball.vx * BALL_RESTITUTION;
                if (imp > 65) {
                  addWallRipple(0, ball.y, COLORS.cyan, imp / 650);
                  audio.wallBounce(imp);
                }
              }
            } else if (ball.x > FIELD_W - ball.r) {
              ball.x = FIELD_W - ball.r;
              if (ball.vx > 0) {
                const imp = Math.abs(ball.vx);
                ball.vx = -ball.vx * BALL_RESTITUTION;
                if (imp > 65) {
                  addWallRipple(FIELD_W, ball.y, COLORS.orange, imp / 650);
                  audio.wallBounce(imp);
                }
              }
            }
          }
        }
      }

      function triggerGoal(scoringSide) {
        const isLeftScorer = scoringSide === "left";
        if (isLeftScorer) state.scoreLeft++;
        else state.scoreRight++;

        const shotKmh = Math.round(Math.hypot(state.ball.vx, state.ball.vy) * 0.165);
        const scorerName = (state.ball.lastSide === scoringSide && state.ball.lastBotName)
          ? state.ball.lastBotName
          : (isLeftScorer ? "EQUIPO CIAN" : "EQUIPO NARANJA");

        const goalX = isLeftScorer ? FIELD_W : 0;
        const goalY = state.ball.y;
        const color = isLeftScorer ? COLORS.cyan : COLORS.orange;

        addShockwave(goalX, goalY, color, 460);
        addShockwave(goalX, goalY, COLORS.gold, 280);
        spawnBurst(goalX, goalY, 55, 110, 560, color, 5.2);
        spawnBurst(goalX, goalY, 28, 90, 420, COLORS.gold, 4.5);
        state.cameraShake = 15;
        audio.goalHorn(isLeftScorer);

        // Onda expansiva fisica que empuja a los autos en el destello de gol
        const allBots = state.leftBots.concat(state.rightBots);
        for (let i = 0; i < allBots.length; i++) {
          const b = allBots[i];
          const dx = b.x - goalX;
          const dy = b.y - goalY;
          const d = Math.hypot(dx, dy) || 1;
          const push = clamp(560 - d * 0.45, 120, 520);
          b.vx += (dx / d) * push;
          b.vy += (dy / d) * push;
        }

        state.lastGoalInfo = {
          side: scoringSide,
          teamLabel: isLeftScorer ? "GOL DE EQUIPO CIAN" : "GOL DE EQUIPO NARANJA",
          scorer: scorerName,
          kmh: Math.max(42, shotKmh),
          color
        };

        state.phase = "GOAL_CELEBRATION";
        state.phaseTimer = 0.72;
      }

      let simClock = 0;

      function updateSimulation(rawDt) {
        if (state.paused) return;
        const dt = clamp(rawDt, 0.001, 0.04) * state.simSpeed;

        // Actualizar efectos visuales siempre vivos
        state.cameraShake = Math.max(0, state.cameraShake - dt * 28);

        for (let i = state.particles.length - 1; i >= 0; i--) {
          const p = state.particles[i];
          p.life -= dt;
          if (p.life <= 0) {
            state.particles.splice(i, 1);
          } else {
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.vx *= Math.exp(-3.2 * dt);
            p.vy *= Math.exp(-3.2 * dt);
          }
        }

        for (let i = state.skidMarks.length - 1; i >= 0; i--) {
          state.skidMarks[i].alpha -= dt * 0.22;
          if (state.skidMarks[i].alpha <= 0) state.skidMarks.splice(i, 1);
        }

        for (let i = state.wallRipples.length - 1; i >= 0; i--) {
          const w = state.wallRipples[i];
          w.r = lerp(w.r, w.maxR, Math.min(1, dt * 8));
          w.alpha -= dt * 1.45;
          if (w.alpha <= 0) state.wallRipples.splice(i, 1);
        }

        for (let i = state.shockwaves.length - 1; i >= 0; i--) {
          const s = state.shockwaves[i];
          s.r += (s.maxR - s.r) * Math.min(1, dt * 5.2);
          s.alpha -= dt * 1.15;
          if (s.alpha <= 0) state.shockwaves.splice(i, 1);
        }

        // Maquina de fases: CELEBRACION -> REPETICION DE GOL -> SAQUE
        if (state.phase === "GOAL_CELEBRATION") {
          state.phaseTimer -= dt;
          const slowDt = dt * 0.28;
          const allBots = state.leftBots.concat(state.rightBots);
          for (let i = 0; i < allBots.length; i++) {
            allBots[i].x += allBots[i].vx * slowDt;
            allBots[i].y += allBots[i].vy * slowDt;
          }
          if (state.phaseTimer <= 0) {
            if (state.overtime) {
              // Gol de oro termina el partido e inicia el siguiente
              state.matchNumber++;
              resetFullMatch();
              return;
            }
            if (state.replayBuffer.length > 25) {
              state.phase = "REPLAY";
              state.phaseTimer = 1.45;
              state.replayPlaybackIdx = 0;
            } else {
              state.phase = "PLAYING";
              resetBoostPads();
              setupFormation(true);
            }
          }
          return;
        }

        if (state.phase === "REPLAY") {
          state.phaseTimer -= dt;
          state.replayPlaybackIdx = Math.min(
            state.replayBuffer.length - 1,
            state.replayPlaybackIdx + dt * 60 * 0.78
          );
          if (state.phaseTimer <= 0) {
            state.phase = "PLAYING";
            state.replayBuffer = [];
            resetBoostPads();
            setupFormation(true);
          }
          return;
        }

        // Fase activa de juego 2v2
        simClock += dt;

        // Reloj de 90 segundos por partido
        if (!state.overtime) {
          state.timeLeft -= dt;
          if (state.timeLeft <= 0) {
            state.timeLeft = 0;
            if (state.scoreLeft === state.scoreRight) {
              state.overtime = true;
              addShockwave(FIELD_W * 0.5, FIELD_H * 0.5, COLORS.coral, 360);
            } else {
              state.matchNumber++;
              resetFullMatch();
              return;
            }
          }
        } else {
          state.timeLeft += dt;
        }

        // Recarga de las 6 pastillas doradas de Boost 100%
        const allBots = state.leftBots.concat(state.rightBots);
        for (let p = 0; p < state.boostPads.length; p++) {
          const pad = state.boostPads[p];
          pad.pulse += dt * 4.2;
          if (!pad.active) {
            pad.cooldown -= dt;
            if (pad.cooldown <= 0) {
              pad.active = true;
              pad.cooldown = 0;
              addWallRipple(pad.x, pad.y, COLORS.gold, 0.5);
            }
          } else {
            for (let b = 0; b < allBots.length; b++) {
              const bot = allBots[b];
              if (bot.boost < 99.5 && Math.hypot(bot.x - pad.x, bot.y - pad.y) < BOT_R + 18) {
                bot.boost = 100;
                pad.active = false;
                pad.cooldown = BOOST_RESPAWN_TIME;
                spawnBurst(pad.x, pad.y, 12, 65, 210, COLORS.gold, 3.8);
                audio.pickupBoost();
                break;
              }
            }
          }
        }

        // Invocar window.computeSoccerTeamAI para ambos equipos
        const cmdsLeft = window.computeSoccerTeamAI(buildWorldStateFor("left"), "left");
        const cmdsRight = window.computeSoccerTeamAI(buildWorldStateFor("right"), "right");

        if (state.humanControlsLeft0) {
          cmdsLeft[0] = getHumanCommand();
        }

        // Substeps fisicos para precision en alta velocidad
        const SUBSTEPS = 3;
        const subDt = dt / SUBSTEPS;
        for (let s = 0; s < SUBSTEPS; s++) {
          for (let i = 0; i < state.leftBots.length; i++) {
            stepBotPhysics(state.leftBots[i], cmdsLeft[i], subDt);
          }
          for (let i = 0; i < state.rightBots.length; i++) {
            stepBotPhysics(state.rightBots[i], cmdsRight[i], subDt);
          }
          resolveBotVsBotCollisions(allBots);
          stepBallAndTouches(allBots, subDt, simClock);
          if (state.phase !== "PLAYING") break;
        }

        // Estelas de vehiculos, balon y buffer de repeticion
        for (let i = 0; i < allBots.length; i++) {
          emitCarTrails(allBots[i]);
        }

        state.ball.trail.push({
          x: state.ball.x,
          y: state.ball.y,
          spd: Math.hypot(state.ball.vx, state.ball.vy)
        });
        if (state.ball.trail.length > 26) state.ball.trail.shift();

        recordReplayFrame();
      }

      /* =========================================================================
       * 9. RENDERIZADO 1080P60 EN CANVAS 2D (ESTETICA NEON DE LABORATORIO)
       * ========================================================================= */
      const canvas = document.getElementById("arenaCanvas");
      const ctx = canvas.getContext("2d");

      if (typeof ctx.roundRect !== "function") {
        CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, rad) {
          const r = Math.min(Number(rad) || 0, Math.abs(w) * 0.5, Math.abs(h) * 0.5);
          this.moveTo(x + r, y);
          this.arcTo(x + w, y, x + w, y + h, r);
          this.arcTo(x + w, y + h, x, y + h, r);
          this.arcTo(x, y + h, x, y, r);
          this.arcTo(x, y, x + w, y, r);
          this.closePath();
        };
      }

      function resizeCanvas() {
        const rect = canvas.parentElement.getBoundingClientRect();
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.max(1, Math.floor(rect.width * dpr));
        canvas.height = Math.max(1, Math.floor(rect.height * dpr));
      }
      window.addEventListener("resize", resizeCanvas);
      resizeCanvas();

      function traceFieldPath(c, W, H, gHalf, gDepth, cR) {
        const midY = H * 0.5;
        const gTop = midY - gHalf;
        const gBot = midY + gHalf;

        c.beginPath();
        c.moveTo(cR, 0);
        c.lineTo(W - cR, 0);
        c.arcTo(W, 0, W, cR, cR);
        c.lineTo(W, gTop);
        c.lineTo(W + gDepth, gTop);
        c.lineTo(W + gDepth, gBot);
        c.lineTo(W, gBot);
        c.lineTo(W, H - cR);
        c.arcTo(W, H, W - cR, H, cR);
        c.lineTo(cR, H);
        c.arcTo(0, H, 0, H - cR, cR);
        c.lineTo(0, gBot);
        c.lineTo(-gDepth, gBot);
        c.lineTo(-gDepth, gTop);
        c.lineTo(0, gTop);
        c.lineTo(0, cR);
        c.arcTo(0, 0, cR, 0, cR);
        c.closePath();
      }

      function drawPitch() {
        const midX = FIELD_W * 0.5;
        const midY = FIELD_H * 0.5;
        const gTop = midY - GOAL_HALF_H;
        const gBot = midY + GOAL_HALF_H;

        ctx.save();
        traceFieldPath(ctx, FIELD_W, FIELD_H, GOAL_HALF_H, GOAL_DEPTH, CORNER_R);
        ctx.clip();

        // Fondo de cancha oscuro con iluminacion sutil por equipo
        const turfGrad = ctx.createLinearGradient(0, 0, FIELD_W, 0);
        turfGrad.addColorStop(0, "#071626");
        turfGrad.addColorStop(0.22, "#08101E");
        turfGrad.addColorStop(0.5, "#0A1324");
        turfGrad.addColorStop(0.78, "#08101E");
        turfGrad.addColorStop(1, "#21110B");
        ctx.fillStyle = turfGrad;
        ctx.fillRect(-GOAL_DEPTH, 0, FIELD_W + GOAL_DEPTH * 2, FIELD_H);

        // Franjas de cesped sintetico de laboratorio
        ctx.fillStyle = "rgba(255, 255, 255, 0.014)";
        const stripeW = FIELD_W / 12;
        for (let i = 0; i < 12; i += 2) {
          ctx.fillRect(i * stripeW, 0, stripeW, FIELD_H);
        }

        // Reticula tactica sutil
        ctx.strokeStyle = "rgba(148, 163, 184, 0.055)";
        ctx.lineWidth = 1;
        for (let x = 80; x < FIELD_W; x += 80) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, FIELD_H);
          ctx.stroke();
        }
        for (let y = 80; y < FIELD_H; y += 80) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(FIELD_W, y);
          ctx.stroke();
        }

        // Redes luminosas dentro de ambas porterias
        ctx.strokeStyle = "rgba(34, 211, 238, 0.22)";
        for (let gx = -GOAL_DEPTH; gx <= 0; gx += 14) {
          ctx.beginPath();
          ctx.moveTo(gx, gTop);
          ctx.lineTo(gx, gBot);
          ctx.stroke();
        }
        ctx.strokeStyle = "rgba(251, 146, 60, 0.22)";
        for (let gx = FIELD_W; gx <= FIELD_W + GOAL_DEPTH; gx += 14) {
          ctx.beginPath();
          ctx.moveTo(gx, gTop);
          ctx.lineTo(gx, gBot);
          ctx.stroke();
        }
        for (let gy = gTop; gy <= gBot; gy += 16) {
          ctx.strokeStyle = "rgba(34, 211, 238, 0.18)";
          ctx.beginPath();
          ctx.moveTo(-GOAL_DEPTH, gy);
          ctx.lineTo(0, gy);
          ctx.stroke();

          ctx.strokeStyle = "rgba(251, 146, 60, 0.18)";
          ctx.beginPath();
          ctx.moveTo(FIELD_W, gy);
          ctx.lineTo(FIELD_W + GOAL_DEPTH, gy);
          ctx.stroke();
        }

        // Lineas reglamentarias de cancha: mediocampo, circulo central y areas
        ctx.strokeStyle = "rgba(148, 163, 184, 0.22)";
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(midX, 0);
        ctx.lineTo(midX, FIELD_H);
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(midX, midY, 96, 0, Math.PI * 2);
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(midX, midY, 8, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(148, 163, 184, 0.35)";
        ctx.fill();

        // Areas defensivas iluminadas
        ctx.strokeStyle = "rgba(34, 211, 238, 0.28)";
        ctx.strokeRect(0, midY - 190, 175, 380);
        ctx.strokeStyle = "rgba(251, 146, 60, 0.28)";
        ctx.strokeRect(FIELD_W - 175, midY - 190, 175, 380);

        // Sensores laser en lineas de gol
        ctx.save();
        ctx.lineWidth = 4;
        ctx.strokeStyle = COLORS.cyan;
        ctx.shadowColor = COLORS.cyan;
        ctx.shadowBlur = 16;
        ctx.beginPath();
        ctx.moveTo(0, gTop);
        ctx.lineTo(0, gBot);
        ctx.stroke();

        ctx.strokeStyle = COLORS.orange;
        ctx.shadowColor = COLORS.orange;
        ctx.beginPath();
        ctx.moveTo(FIELD_W, gTop);
        ctx.lineTo(FIELD_W, gBot);
        ctx.stroke();
        ctx.restore();

        // Huellas de derrape fisico
        for (let i = 0; i < state.skidMarks.length; i++) {
          const sk = state.skidMarks[i];
          ctx.globalAlpha = clamp(sk.alpha, 0, 1);
          ctx.fillStyle = sk.color;
          ctx.fillRect(sk.x1 - 2.2, sk.y1 - 2.2, 4.4, 4.4);
          ctx.fillRect(sk.x2 - 2.2, sk.y2 - 2.2, 4.4, 4.4);
        }
        ctx.globalAlpha = 1;

        ctx.restore();

        // Bordes neon curvos exteriores de la cancha
        ctx.save();
        traceFieldPath(ctx, FIELD_W, FIELD_H, GOAL_HALF_H, GOAL_DEPTH, CORNER_R);
        ctx.lineWidth = 6;
        ctx.strokeStyle = "rgba(30, 41, 59, 0.95)";
        ctx.stroke();

        // Mitad izquierda Cian / mitad derecha Naranja en rieles curvos
        ctx.save();
        ctx.beginPath();
        ctx.rect(-GOAL_DEPTH - 20, -20, midX + GOAL_DEPTH + 20, FIELD_H + 40);
        ctx.clip();
        traceFieldPath(ctx, FIELD_W, FIELD_H, GOAL_HALF_H, GOAL_DEPTH, CORNER_R);
        ctx.lineWidth = 3;
        ctx.strokeStyle = COLORS.cyan;
        ctx.shadowColor = COLORS.cyan;
        ctx.shadowBlur = 14;
        ctx.stroke();
        ctx.restore();

        ctx.save();
        ctx.beginPath();
        ctx.rect(midX, -20, midX + GOAL_DEPTH + 20, FIELD_H + 40);
        ctx.clip();
        traceFieldPath(ctx, FIELD_W, FIELD_H, GOAL_HALF_H, GOAL_DEPTH, CORNER_R);
        ctx.lineWidth = 3;
        ctx.strokeStyle = COLORS.orange;
        ctx.shadowColor = COLORS.orange;
