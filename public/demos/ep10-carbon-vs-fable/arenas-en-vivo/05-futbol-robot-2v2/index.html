<script>
(function() {
  const window_proxy = {};
  (function(window) {
      const FIELD_W = 1280;
      const FIELD_H = 736;
      const GOAL_HALF_H = 126;
      const GOAL_DEPTH = 74;
      const CORNER_R = 122;
      const POST_R = 8;

      const BALL_R = 23;
      const BOT_R = 22;
      const MATCH_DURATION = 90.0;

      const CAR_ACCEL = 790;
      const CAR_REV_ACCEL = 600;
      const CAR_BOOST_ACCEL = 700;
      const CAR_MAX_SPEED = 465;
      const CAR_MAX_BOOST_SPEED = 720;
      const CAR_MAX_REV_SPEED = 295;
      const CAR_TURN_RATE = 4.65;
      const CAR_DRIFT_TURN_RATE = 5.45;

      const BALL_DRAG = 0.24;
      const BALL_RESTITUTION = 0.88;
      const BALL_MAX_SPEED = 1040;
      const BOOST_RESPAWN_TIME = 6.5;

      const COLORS = {
        bgVoid: "#060A12",
        panel: "#0F172A",
        cyan: "#22D3EE",
        cyanGlow: "rgba(34, 211, 238, 0.55)",
        orange: "#FB923C",
        orangeGlow: "rgba(251, 146, 60, 0.55)",
        emerald: "#10B981",
        gold: "#FBBF24",
        coral: "#F43F5E",
        white: "#F8FAFC"
      };

      /* =========================================================================
       * 2. UTILIDADES MATEMATICAS Y PREDICCION BALISTICA PURA
       * ========================================================================= */
      function clamp(v, lo, hi) {
        return v < lo ? lo : v > hi ? hi : v;
      }

      function lerp(a, b, t) {
        return a + (b - a) * t;
      }

      function wrapAngle(a) {
        while (a > Math.PI) a -= Math.PI * 2;
        while (a < -Math.PI) a += Math.PI * 2;
        return a;
      }

      /**
       * Simulador balistico puro que calcula trayectoria futura y rebotes elasticos
       * contra paredes rectas y esquinas curvas antes de interceptar.
       */
      function simulateBallisticTrajectory(ballInput, fieldW, fieldH, goalHalfH, horizonSec, stepDt) {
        const W = fieldW || FIELD_W;
        const H = fieldH || FIELD_H;
        const gHalf = goalHalfH || GOAL_HALF_H;
        const cR = Math.min(W, H) * (CORNER_R / FIELD_H);
        const r = (ballInput && ballInput.r > 0) ? ballInput.r : BALL_R;
        const midY = H * 0.5;

        let x = Number(ballInput.x) || W * 0.5;
        let y = Number(ballInput.y) || midY;
        let vx = Number(ballInput.vx) || 0;
        let vy = Number(ballInput.vy) || 0;

        const points = [{ x, y, vx, vy, t: 0, bounced: false }];
        const bounces = [];
        let goalScoredSide = null;
        let leftThreatY = midY;
        let rightThreatY = midY;
        let leftThreatTime = Infinity;
        let rightThreatTime = Infinity;

        const steps = Math.max(1, Math.floor(horizonSec / stepDt));

        for (let i = 1; i <= steps; i++) {
          const t = i * stepDt;
          const damp = Math.max(0, 1 - BALL_DRAG * stepDt);
          vx *= damp;
          vy *= damp;
          x += vx * stepDt;
          y += vy * stepDt;

          let bounced = false;
          const inGoalMouthY = Math.abs(y - midY) < (gHalf - r * 0.28);

          // Comprobar entrada de gol
          if (inGoalMouthY && x < -r * 0.35) {
            goalScoredSide = "left";
            if (t < leftThreatTime) {
              leftThreatTime = t;
              leftThreatY = y;
            }
            points.push({ x, y, vx, vy, t, bounced: false });
            break;
          }
          if (inGoalMouthY && x > W + r * 0.35) {
            goalScoredSide = "right";
            if (t < rightThreatTime) {
              rightThreatTime = t;
              rightThreatY = y;
            }
            points.push({ x, y, vx, vy, t, bounced: false });
            break;
          }

          // Rebotes en las 4 esquinas curvas
          const inCornerX = (x < cR) || (x > W - cR);
          const inCornerY = (y < cR) || (y > H - cR);

          if (inCornerX && inCornerY) {
            const cx = x < cR ? cR : W - cR;
            const cy = y < cR ? cR : H - cR;
            const dx = x - cx;
            const dy = y - cy;
            const dist = Math.hypot(dx, dy);
            const maxDist = Math.max(4, cR - r);
            if (dist > maxDist) {
              const nx = -dx / dist;
              const ny = -dy / dist;
              x = cx - nx * maxDist;
              y = cy - ny * maxDist;
              const vn = vx * nx + vy * ny;
              if (vn < 0) {
                vx -= (1 + BALL_RESTITUTION) * vn * nx;
                vy -= (1 + BALL_RESTITUTION) * vn * ny;
                bounced = true;
              }
            }
          } else {
            // Paredes superior e inferior
            if (y < r) {
              y = r;
              if (vy < 0) {
                vy = -vy * BALL_RESTITUTION;
                bounced = true;
              }
            } else if (y > H - r) {
              y = H - r;
              if (vy > 0) {
                vy = -vy * BALL_RESTITUTION;
                bounced = true;
              }
            }

            // Paredes laterales fuera de la porteria
            if (!inGoalMouthY) {
              if (x < r) {
                x = r;
                if (vx < 0) {
                  vx = -vx * BALL_RESTITUTION;
                  bounced = true;
                }
              } else if (x > W - r) {
                x = W - r;
                if (vx > 0) {
                  vx = -vx * BALL_RESTITUTION;
                  bounced = true;
                }
              }
            }
          }

          if (x < W * 0.14 && t < leftThreatTime) {
            leftThreatTime = t;
            leftThreatY = clamp(y, midY - gHalf * 0.9, midY + gHalf * 0.9);
          }
          if (x > W * 0.86 && t < rightThreatTime) {
            rightThreatTime = t;
            rightThreatY = clamp(y, midY - gHalf * 0.9, midY + gHalf * 0.9);
          }

          if (bounced && bounces.length < 5) {
            bounces.push({ x, y, t });
          }
          points.push({ x, y, vx, vy, t, bounced });
        }

        return {
          points,
          bounces,
          goalScoredSide,
          leftThreatY,
          rightThreatY,
          leftThreatTime,
          rightThreatTime
        };
      }

      /* =========================================================================
       * 3. CONTROLADOR TACTICO PURO IA VS IA (window.computeSoccerTeamAI)
       * ========================================================================= */
      const aiVisualPlans = {
        left: null,
        right: null
      };

      /**
       * Calcula la distancia y normal interior hacia la pared o esquina curva mas cercana.
       */
      function getWallClearance(px, py, W, H, gHalf, cR) {
        const midY = H * 0.5;
        // Esquinas curvas primero
        if ((px < cR || px > W - cR) && (py < cR || py > H - cR)) {
          const cx = px < cR ? cR : W - cR;
          const cy = py < cR ? cR : H - cR;
          const dx = px - cx;
          const dy = py - cy;
          const d = Math.hypot(dx, dy) || 1;
          return {
            dist: Math.max(0, cR - d),
            nx: -dx / d,
            ny: -dy / d
          };
        }

        let minDist = py;
        let nx = 0;
        let ny = 1;

        if (H - py < minDist) {
          minDist = H - py;
          nx = 0;
          ny = -1;
        }

        const inGoalY = Math.abs(py - midY) < gHalf * 0.88;
        if (!inGoalY) {
          if (px < minDist) {
            minDist = px;
            nx = 1;
            ny = 0;
          }
          if (W - px < minDist) {
            minDist = W - px;
            nx = -1;
            ny = 0;
          }
        }

        return { dist: Math.max(0, minDist), nx, ny };
      }

      /**
       * Limita cualquier punto objetivo tactico para mantener margen seguro lejos de esquinas.
       */
      function clampTacticalPoint(tx, ty, W, H, gHalf, cR, margin, allowRightGoal, allowLeftGoal) {
        const midY = H * 0.5;
        let x = tx;
        let y = clamp(ty, margin, H - margin);

        const inMouth = Math.abs(y - midY) < gHalf * 0.78;
        const minX = (allowLeftGoal && inMouth) ? -margin * 0.5 : margin;
        const maxX = (allowRightGoal && inMouth) ? W + margin * 0.5 : W - margin;
        x = clamp(x, minX, maxX);

        if ((x < cR || x > W - cR) && (y < cR || y > H - cR)) {
          const cx = x < cR ? cR : W - cR;
          const cy = y < cR ? cR : H - cR;
          const dx = x - cx;
          const dy = y - cy;
          const d = Math.hypot(dx, dy) || 1;
          const limitR = Math.max(12, cR - margin);
          if (d > limitR) {
            x = cx + (dx / d) * limitR;
            y = cy + (dy / d) * limitR;
          }
        }
        return { x, y };
      }

      /**
       * Convierte un punto objetivo tactico en comandos puros { throttle, steer, boost }
       * con prevencion de orbitas cerradas y escape instantaneo de paredes/esquinas.
       */
      function computeDriveCommand(bot, targetX, targetY, holdAngle, wantBoost, W, H, gHalf, cR) {
        const fx = Math.cos(bot.angle);
        const fy = Math.sin(bot.angle);
        const forwardSpeed = bot.vx * fx + bot.vy * fy;

        // Si el robot esta dentro de una porteria y su objetivo esta fuera, salir primero por el centro del arco
        let effTargetX = targetX;
        let effTargetY = targetY;
        const midY = H * 0.5;
        if (bot.x < H * 0.02 && targetX > H * 0.05) {
          effTargetX = H * 0.065;
          effTargetY = clamp(bot.y, midY - gHalf * 0.52, midY + gHalf * 0.52);
        } else if (bot.x > W - H * 0.02 && targetX < W - H * 0.05) {
          effTargetX = W - H * 0.065;
          effTargetY = clamp(bot.y, midY - gHalf * 0.52, midY + gHalf * 0.52);
        }

        const dx = effTargetX - bot.x;
        const dy = effTargetY - bot.y;
        const dist = Math.hypot(dx, dy);

        // Escape reflejo puro si el morro se frena contra una pared o esquina (forwardSpeed con signo evita oscilacion)
        const wall = getWallClearance(bot.x, bot.y, W, H, gHalf, cR);
        const wallDot = fx * wall.nx + fy * wall.ny;
        if (wall.dist < H * 0.054 && wallDot < -0.48 && forwardSpeed < 95 && dist > H * 0.045) {
          const crossWall = fx * wall.ny - fy * wall.nx;
          return {
            throttle: -0.95,
            steer: crossWall >= 0 ? 0.88 : -0.88,
            boost: false
          };
        }

        // Modo estacionamiento direccional (Portero listo en la linea de sombra)
        if (holdAngle !== null && dist < W * 0.028) {
          const faceErr = wrapAngle(holdAngle - bot.angle);
          const forwardProj = dx * fx + dy * fy;
          return {
            throttle: clamp(forwardProj / (W * 0.025), -0.35, 0.35),
            steer: clamp(faceErr * 2.4, -1, 1),
            boost: false
          };
        }

        const desiredAngle = Math.atan2(dy, dx);
        const angleErr = wrapAngle(desiredAngle - bot.angle);
        const absErr = Math.abs(angleErr);
        const steer = clamp(angleErr * 2.45, -1, 1);

        // Prevencion de orbita circular: si el objetivo esta muy cerca y de lado/atras,
        // reducir aceleracion para girar cerrado con derrape sin rodearlo eternamente.
        if (dist < H * 0.165 && absErr > 1.05) {
          if (dist < H * 0.085 && absErr > 2.25 && wall.dist > H * 0.12) {
            return {
              throttle: -0.75,
              steer: clamp(-angleErr * 1.4, -1, 1),
              boost: false
            };
          }
          return {
            throttle: 0.30,
            steer: angleErr > 0 ? 1 : -1,
            boost: false
          };
        }

        if (absErr > 1.42) {
          return {
            throttle: 0.52,
            steer: angleErr > 0 ? 1 : -1,
            boost: false
          };
        }

        const useBoost = Boolean(wantBoost && absErr < 0.36 && bot.boost > 8 && dist > H * 0.05);
        return {
          throttle: 1.0,
          steer,
          boost: useBoost
        };
      }

      window.computeSoccerTeamAI = function computeSoccerTeamAI(worldState, side) {
        if (!worldState || !worldState.ball) {
          return [
            { throttle: 0, steer: 0, boost: false },
            { throttle: 0, steer: 0, boost: false }
          ];
        }

        const W = Number(worldState.fieldW) || FIELD_W;
        const H = Number(worldState.fieldH) || FIELD_H;
        const gHalf = Number(worldState.goalHalfH) || (H * 0.171);
        const cR = Math.min(W, H) * (CORNER_R / FIELD_H);
        const midX = W * 0.5;
        const midY = H * 0.5;
        const isLeft = side !== "right";
        const attackDir = isLeft ? 1 : -1;

        const rawMy = Array.isArray(worldState.myBots) ? worldState.myBots : [];
        const rawOpp = Array.isArray(worldState.oppBots) ? worldState.oppBots : [];
        const rawPads = Array.isArray(worldState.boostPads) ? worldState.boostPads : [];

        // Autodeteccion de sistema de coordenadas ([0..W, 0..H] vs centrado [-W/2..W/2, -H/2..H/2])
        let isCenteredOrigin = false;
        if (rawPads.length > 0) {
          let sumX = 0;
          let sumY = 0;
          for (let i = 0; i < rawPads.length; i++) {
            sumX += Number(rawPads[i].x) || 0;
            sumY += Number(rawPads[i].y) || 0;
          }
          if (Math.abs(sumX / rawPads.length) < W * 0.18 && Math.abs(sumY / rawPads.length) < H * 0.18) {
            isCenteredOrigin = true;
          }
        } else {
          const checkEntities = [worldState.ball].concat(rawMy, rawOpp);
          for (let i = 0; i < checkEntities.length; i++) {
            const e = checkEntities[i];
            if (e && ((Number(e.y) || 0) < -H * 0.08 || (Number(e.x) || 0) < -W * 0.12)) {
              isCenteredOrigin = true;
              break;
            }
          }
        }

        const offX = isCenteredOrigin ? midX : 0;
        const offY = isCenteredOrigin ? midY : 0;

        // Detectar escala de boost (0..1 vs 0..100)
        let maxRawBoost = 0;
        for (let i = 0; i < rawMy.length; i++) {
          const bVal = Number(rawMy[i] && rawMy[i].boost) || 0;
          if (bVal > maxRawBoost) maxRawBoost = bVal;
        }
        for (let i = 0; i < rawOpp.length; i++) {
          const bVal = Number(rawOpp[i] && rawOpp[i].boost) || 0;
          if (bVal > maxRawBoost) maxRawBoost = bVal;
        }
        const boostScale = (maxRawBoost > 0 && maxRawBoost <= 1.001) ? 100 : 1;

        const ball = {
          x: (Number(worldState.ball.x) || 0) + offX,
          y: (Number(worldState.ball.y) || 0) + offY,
          vx: Number(worldState.ball.vx) || 0,
          vy: Number(worldState.ball.vy) || 0,
          r: Number(worldState.ball.r) || (H * 0.031)
        };

        const myBots = rawMy.map(function (b, idx) {
          return {
            idx,
            x: (Number(b && b.x) || 0) + offX,
            y: (Number(b && b.y) || 0) + offY,
            vx: Number(b && b.vx) || 0,
            vy: Number(b && b.vy) || 0,
            angle: Number(b && b.angle) || (isLeft ? 0 : Math.PI),
            boost: (Number(b && b.boost) || 0) * boostScale
          };
        });

        if (myBots.length === 0) {
          return [
            { throttle: 0, steer: 0, boost: false },
            { throttle: 0, steer: 0, boost: false }
          ];
        }

        const oppBots = rawOpp.map(function (b) {
          return {
            x: (Number(b && b.x) || 0) + offX,
            y: (Number(b && b.y) || 0) + offY,
            vx: Number(b && b.vx) || 0,
            vy: Number(b && b.vy) || 0,
            angle: Number(b && b.angle) || 0,
            boost: (Number(b && b.boost) || 0) * boostScale
          };
        });

        const boostPads = rawPads.map(function (p) {
          return {
            x: (Number(p && p.x) || 0) + offX,
            y: (Number(p && p.y) || 0) + offY,
            active: Boolean(p && p.active)
          };
        });

        // Prediccion balistica multi-rebote (2.35s a 30 muestras/seg)
        const pred = simulateBallisticTrajectory(ball, W, H, gHalf, 2.35, 1 / 30);

        const ownGoalX = isLeft ? 0 : W;
        const oppGoalX = isLeft ? W : 0;
        const botRadiusEst = H * 0.03;
        const safeMargin = botRadiusEst * 1.45;

        // Analizar posicion del portero enemigo para apuntar al hueco libre de la porteria rival
        let oppKeeperY = midY;
        if (oppBots.length > 0) {
          let bestOppDist = Infinity;
          for (let i = 0; i < oppBots.length; i++) {
            const dGoal = Math.abs(oppBots[i].x - oppGoalX);
            if (dGoal < bestOppDist) {
              bestOppDist = dGoal;
              oppKeeperY = oppBots[i].y;
            }
          }
        }

        const ballSpeed = Math.hypot(ball.vx, ball.vy);
        let aimGoalY = oppKeeperY > midY ? (midY - gHalf * 0.48) : (midY + gHalf * 0.48);
        // En saque inicial quieto, romper simetria apuntando con angulo diagonal limpio
        if (ballSpeed < 8 && Math.hypot(ball.x - midX, ball.y - midY) < W * 0.035) {
          aimGoalY = midY - gHalf * 0.38;
        }

        // Funcion para encontrar el punto optimo de intercepcion balistica de un bot
        function findBestIntercept(bot, preferPostBounce) {
          const effSpeed = (H * 0.62) * (bot.boost > 20 ? 1.28 : 1.0);
          let chosen = pred.points[pred.points.length - 1];
          let seenBounce = false;

          for (let i = 0; i < pred.points.length; i++) {
            const pt = pred.points[i];
            if (pt.bounced) seenBounce = true;

            // Si la bola va rapido hacia una pared cercana, esperar el rebote limpio en vez de chocar la pared
            const nearSideWall = (pt.y < cR * 0.52 || pt.y > H - cR * 0.52);
            if (preferPostBounce && !seenBounce && nearSideWall && ballSpeed > H * 0.36 && i < 24) {
              continue;
            }

            const toGoalX = oppGoalX - pt.x;
            const toGoalY = aimGoalY - pt.y;
            const toGoalLen = Math.hypot(toGoalX, toGoalY) || 1;
            const strikeX = pt.x - (toGoalX / toGoalLen) * (ball.r + botRadiusEst * 0.85);
            const strikeY = pt.y - (toGoalY / toGoalLen) * (ball.r + botRadiusEst * 0.85);

            const d = Math.hypot(strikeX - bot.x, strikeY - bot.y);
            const angPenalty = Math.abs(wrapAngle(Math.atan2(strikeY - bot.y, strikeX - bot.x) - bot.angle)) * 0.085;
            const eta = d / effSpeed + angPenalty;

            if (eta <= pt.t + 0.06) {
              chosen = pt;
              break;
            }
          }
          return chosen;
        }

        // Seleccion dinamica de roles entre Delantero (attacker) y Portero/Defensa (defender)
        let attackerIdx = 0;
        let defenderIdx = myBots.length > 1 ? 1 : -1;

        if (myBots.length >= 2) {
          const b0 = myBots[0];
          const b1 = myBots[1];
          const b0OnSide = (ball.x - b0.x) * attackDir >= -ball.r * 0.5;
          const b1OnSide = (ball.x - b1.x) * attackDir >= -ball.r * 0.5;
          const score0 = Math.hypot(ball.x - b0.x, ball.y - b0.y) + (b0OnSide ? 0 : W * 0.34) - W * 0.055;
          const score1 = Math.hypot(ball.x - b1.x, ball.y - b1.y) + (b1OnSide ? 0 : W * 0.34);

          if (score1 < score0) {
            attackerIdx = 1;
            defenderIdx = 0;
          }
        }

        const commands = new Array(myBots.length);
        const roleLabels = new Array(myBots.length);
        const stateLabels = new Array(myBots.length);

        // --- LOGICA DEL DELANTERO (INTERCEPTOR BALISTICO + REMATE) ---
        const atk = myBots[attackerIdx];
        const atkIntercept = findBestIntercept(atk, true);
        roleLabels[attackerIdx] = "DELANTERO";

        const goalVecX = oppGoalX - atkIntercept.x;
        const goalVecY = aimGoalY - atkIntercept.y;
        const goalVecLen = Math.hypot(goalVecX, goalVecY) || 1;
        const ux = goalVecX / goalVecLen;
        const uy = goalVecY / goalVecLen;

        let atkTargetX = atkIntercept.x - ux * (ball.r + botRadiusEst * 0.88);
        let atkTargetY = atkIntercept.y - uy * (ball.r + botRadiusEst * 0.88);
        let atkWantBoost = false;
        let atkAllowGoalEntry = false;

        const atkDistBall = Math.hypot(ball.x - atk.x, ball.y - atk.y);
        const atkWrongSide = (atkIntercept.x - atk.x) * attackDir < -ball.r * 0.35;

        if (atkWrongSide) {
          // Rodear limpiamente el balon sin empujarlo jamas hacia propia puerta
          stateLabels[attackerIdx] = "REPLIEGUE CURVO";
          const detourSign = (atk.y >= atkIntercept.y)
            ? (atkIntercept.y + H * 0.22 < H - safeMargin ? 1 : -1)
            : (atkIntercept.y - H * 0.22 > safeMargin ? -1 : 1);
          atkTargetX = atkIntercept.x - attackDir * (W * 0.105);
          atkTargetY = atkIntercept.y + detourSign * (H * 0.185);
          atkWantBoost = atk.boost > 35 && Math.hypot(atkTargetX - atk.x, atkTargetY - atk.y) > W * 0.18;
        } else if (atkDistBall < W * 0.115 && ((ball.x - atk.x) * ux + (ball.y - atk.y) * uy) > 0) {
          // Ventana de disparo directo a porteria
          stateLabels[attackerIdx] = "DISPARO POTENTE";
          atkTargetX = ball.x + ux * ball.r * 0.45;
          atkTargetY = ball.y + uy * ball.r * 0.45;
          atkWantBoost = true;
          atkAllowGoalEntry = true;
        } else {
          stateLabels[attackerIdx] = atkIntercept.t > 0.32 ? "PREDICCION REBOTE" : "ATAQUE BALON";
          atkWantBoost = Math.hypot(atkTargetX - atk.x, atkTargetY - atk.y) > W * 0.15;

          // Recoger pastilla dorada 100% oportuna en ruta si tiene poco turbo
          if (atk.boost < 32 && Math.abs(ball.x - ownGoalX) > W * 0.32) {
            const toTgtLen = Math.hypot(atkTargetX - atk.x, atkTargetY - atk.y) || 1;
            for (let p = 0; p < boostPads.length; p++) {
              const pad = boostPads[p];
              if (!pad.active) continue;
              const pdx = pad.x - atk.x;
              const pdy = pad.y - atk.y;
              const pDist = Math.hypot(pdx, pdy);
              const align = (pdx * (atkTargetX - atk.x) + pdy * (atkTargetY - atk.y)) / ((pDist || 1) * toTgtLen);
              if (pDist < W * 0.15 && align > 0.58) {
                atkTargetX = pad.x;
                atkTargetY = pad.y;
                stateLabels[attackerIdx] = "RECARGA TURBO";
                break;
              }
            }
          }
        }

        // --- LOGICA DEL PORTERO / DEFENSA (SWEEPER-KEEPER) ---
        let defTargetX = ownGoalX + attackDir * (W * 0.065);
        let defTargetY = midY;
        let defHoldAngle = null;
        let defWantBoost = false;
        let defInterceptVis = null;

        if (defenderIdx !== -1) {
          const def = myBots[defenderIdx];
          roleLabels[defenderIdx] = "PORTERO/DEF";

          const ballDistOwnGoalX = (ball.x - ownGoalX) * attackDir;
          const ballHeadingHome = (ball.vx * attackDir) < -35;
          const threatY = isLeft ? pred.leftThreatY : pred.rightThreatY;
          const threatTime = isLeft ? pred.leftThreatTime : pred.rightThreatTime;

          const defBehindBall = (ball.x - def.x) * attackDir > -ball.r * 0.25;

          if (ballDistOwnGoalX < W * 0.26 && defBehindBall) {
            // Despeje explosivo fuera del area de peligro
            const clearPt = findBestIntercept(def, false);
            defInterceptVis = clearPt;
            const clearTargetY = clearPt.y < midY ? H * 0.18 : H * 0.82;
            const cVecX = oppGoalX - clearPt.x;
            const cVecY = clearTargetY - clearPt.y;
            const cLen = Math.hypot(cVecX, cVecY) || 1;
            defTargetX = clearPt.x - (cVecX / cLen) * (ball.r + botRadiusEst * 0.8);
            defTargetY = clearPt.y - (cVecY / cLen) * (ball.r + botRadiusEst * 0.8);
            defWantBoost = true;
            stateLabels[defenderIdx] = "DESPEJE AREA";
          } else if (ballDistOwnGoalX < W * 0.54 || ballHeadingHome || threatTime < 1.8) {
            // Sombra activa cubriendo la proyeccion balistica sobre el arco propio
            const shadowY = threatTime < 2.2
              ? threatY
              : clamp(lerp(midY, ball.y + ball.vy * 0.28, 0.72), midY - gHalf * 0.82, midY + gHalf * 0.82);
            defTargetX = ownGoalX + attackDir * (W * 0.062);
            defTargetY = clamp(shadowY, midY - gHalf * 0.82, midY + gHalf * 0.82);
            defHoldAngle = Math.atan2(ball.y - def.y, ball.x - def.x);
            defWantBoost = Math.hypot(defTargetX - def.x, defTargetY - def.y) > W * 0.14;
            stateLabels[defenderIdx] = "SOMBRA ARCO";
            defInterceptVis = { x: defTargetX, y: defTargetY, t: 0.4 };
          } else {
            // Apoyo adelantado en mediocampo o recarga segura de Boost 100%
            let pickedPad = null;
            if (def.boost < 58) {
              let bestPadDist = W * 0.26;
              for (let p = 0; p < boostPads.length; p++) {
                const pad = boostPads[p];
                if (!pad.active) continue;
                const padOwnX = (pad.x - ownGoalX) * attackDir;
                if (padOwnX < W * 0.54) {
                  const d = Math.hypot(pad.x - def.x, pad.y - def.y);
                  if (d < bestPadDist) {
                    bestPadDist = d;
                    pickedPad = pad;
                  }
                }
              }
            }

            if (pickedPad) {
              defTargetX = pickedPad.x;
              defTargetY = pickedPad.y;
              defWantBoost = false;
              stateLabels[defenderIdx] = "TURBO 100%";
            } else {
              const midSample = pred.points[Math.min(18, pred.points.length - 1)];
              defTargetX = ownGoalX + attackDir * (W * 0.31);
              defTargetY = clamp(lerp(midY, midSample.y, 0.48), H * 0.20, H * 0.80);
              defHoldAngle = Math.atan2(ball.y - def.y, ball.x - def.x);
              defWantBoost = Math.hypot(defTargetX - def.x, defTargetY - def.y) > W * 0.22 && def.boost > 50;
              stateLabels[defenderIdx] = "APOYO MEDIO";
            }
            defInterceptVis = { x: defTargetX, y: defTargetY, t: 0.5 };
          }

          // Separacion suave entre companeros para evitar estorbarse
          const teamDx = def.x - atk.x;
          const teamDy = def.y - atk.y;
          const teamDist = Math.hypot(teamDx, teamDy);
          if (teamDist < H * 0.14 && teamDist > 0.001) {
            const push = (H * 0.14 - teamDist) * 0.85;
            defTargetX += (teamDx / teamDist) * push;
            defTargetY += (teamDy / teamDist) * push;
          }

          const clampedDef = clampTacticalPoint(
            defTargetX,
            defTargetY,
            W,
            H,
            gHalf,
            cR,
            safeMargin,
            false,
            false
          );
          commands[defenderIdx] = computeDriveCommand(
            def,
            clampedDef.x,
            clampedDef.y,
            defHoldAngle,
            defWantBoost,
            W,
            H,
            gHalf,
            cR
          );
        }

        const clampedAtk = clampTacticalPoint(
          atkTargetX,
          atkTargetY,
          W,
          H,
          gHalf,
          cR,
          safeMargin,
          isLeft && atkAllowGoalEntry,
          !isLeft && atkAllowGoalEntry
        );
        commands[attackerIdx] = computeDriveCommand(
          atk,
          clampedAtk.x,
          clampedAtk.y,
          null,
          atkWantBoost,
          W,
          H,
          gHalf,
          cR
        );

        // Guardar telemetria visual de prediccion para el HUD sin mutar worldState
        if (!isCenteredOrigin && Math.abs(W - FIELD_W) < 2) {
          aiVisualPlans[isLeft ? "left" : "right"] = {
            predPoints: pred.points,
            bounces: pred.bounces,
            attackerIdx,
            defenderIdx,
            interceptPt: atkIntercept,
            defPt: defInterceptVis,
            aimGoalY,
            roleLabels,
            stateLabels
          };
        }

        // Rellenar cualquier bot extra si un arnes externo enviara >2 bots
        for (let i = 0; i < myBots.length; i++) {
          if (!commands[i]) {
            commands[i] = computeDriveCommand(myBots[i], ball.x, ball.y, null, false, W, H, gHalf, cR);
          }
        }

        return commands;
      };
  })(window_proxy);
  window.__carbonComputeSoccerTeamAI = window_proxy.computeSoccerTeamAI;
})();
</script>

<script>
/* =====================================================================
   1) CONTROLADOR TACTICO PURO (hook para duelo IA vs IA)
   window.computeSoccerTeamAI(worldState, side) -> [{throttle,steer,boost} x2]
   Convencion: x a la derecha, y hacia abajo, angle en radianes (0 = +x).
   steer > 0 hace crecer angle (giro horario en pantalla). throttle -1..1.
   Indice 0 = Delantero, indice 1 = Portero/Defensa. Funcion pura: sin estado.
   ===================================================================== */
(function () {
  'use strict';
  window.__soccerState = { scoreLeft: 0, scoreRight: 0, ballSpeed: 0, timeLeft: 90, phase: 'boot', fps: 0, match: 1 };

  window.computeSoccerTeamAI = function computeSoccerTeamAI(worldState, side) {
    var ws = worldState || {};
    var PI = Math.PI;
    function num(v, d) { v = +v; return (v === v && v !== Infinity && v !== -Infinity) ? v : d; }
    function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
    function wrap(a) { a = (a + PI) % (2 * PI); if (a < 0) a += 2 * PI; return a - PI; }
    function hyp(x, y) { return Math.sqrt(x * x + y * y); }

    var W = num(ws.fieldW, 1280); if (W <= 0) W = 1280;
    var H = num(ws.fieldH, 800); if (H <= 0) H = 800;
    var GH = num(ws.goalHalfH, H * 0.15); if (GH <= 0) GH = H * 0.15;
    var CY = H / 2;
    var flip = side === 'right';
    var R = num(ws.cornerR, Math.min(W, H) * 0.17); if (R < 0) R = 0;
    var DRAG = num(ws.ballDrag, 0.4);
    var REST = clamp(num(ws.wallRestitution, 0.86), 0, 1);
    var VMAX = num(ws.botMaxSpeed, 540); if (VMAX <= 0) VMAX = 540;
    var VBST = num(ws.botBoostSpeed, VMAX * 1.55); if (VBST < VMAX) VBST = VMAX;
    var CARR = num(ws.botRadius, 24); if (CARR <= 0) CARR = 24;

    /* --- normaliza el mundo: este equipo siempre ataca hacia +x --- */
    function normBot(b, defX) {
      b = b || {};

      var bo = num(b.boost, 0); if (bo > 1.5) bo = bo / 100;

        x: flip ? W - x : x, y: num(b.y, CY),
        vx: flip ? -vx : vx, vy: num(b.vy, 0),
        angle: wrap(flip ? PI - a : a), boost: clamp(bo, 0, 1)
      };
    }
    var rb = ws.ball || {};
    var ball = { x: num(rb.x, W / 2), y: num(rb.y, CY), vx: num(rb.vx, 0), vy: num(rb.vy, 0), r: num(rb.r, 26) };
    if (ball.r <= 0) ball.r = 26;
    if (flip) { ball.x = W - ball.x; ball.vx = -ball.vx; }
    var rawMy = Array.isArray(ws.myBots) ? ws.myBots : [];
    var rawOpp = Array.isArray(ws.oppBots) ? ws.oppBots : [];

    var opp = [], pads = [], i;

      var rp = rawPads[i] || {};

    /* --- prediccion balistica del balon con rebotes en paredes y esquinas curvas --- */

      var pts = [{ x: x, y: y, vx: vx, vy: vy, t: 0, b: false }];

        var ccy = y < R ? R : (y > H - R ? H - R : NaN);

          var dx = x - ccx, dy = y - ccy, d = Math.sqrt(dx * dx + dy * dy);
          if (d > lim) {
            var nx = dx / d, ny = dy / d;
            x = ccx + nx * lim; y = ccy + ny * lim;
            var vn = vx * nx + vy * ny;
            if (vn > 0) { vx -= (1 + REST) * vn * nx; vy -= (1 + REST) * vn * ny; b = true; }
          }
        } else {
          if (y < r) { y = r; if (vy < 0) { vy = -vy * REST; b = true; } }
          else if (y > H - r) { y = H - r; if (vy > 0) { vy = -vy * REST; b = true; } }
          var mouth = Math.abs(y - CY) < GH - r * 0.35;
          if (x < r) {
            if (mouth) { if (x < 0) goal = -1; }
            else { x = r; if (vx < 0) { vx = -vx * REST; b = true; } }
          } else if (x > W - r) {
            if (mouth) { if (x > W) goal = 1; }
            else { x = W - r; if (vx > 0) { vx = -vx * REST; b = true; } }
          }

        pts.push({ x: x, y: y, vx: vx, vy: vy, t: t, b: b });
        if (goal) { goalIdx = pts.length - 1; break; }
      }
      return { pts: pts, goal: goal, goalIdx: goalIdx };
    }

    function outside(x, y) {
      if (x < 1 || x > W - 1 || y < 1 || y > H - 1) return true;
      var cx = x < R ? R : (x > W - R ? W - R : NaN);
      var cy = y < R ? R : (y > H - R ? H - R : NaN);
      if (cx === cx && cy === cy) { var dx = x - cx, dy = y - cy; return dx * dx + dy * dy > R * R; }
      return false;
    }

    /* --- tiempo estimado de llegada de un robot a un punto --- */
    function eta(bot, px, py) {

      var d = Math.sqrt(dx * dx + dy * dy) - (ball.r + CARR * 0.8);
      if (d < 0) d = 0;
      var spd = hyp(bot.vx, bot.vy);
      var vAvg = VMAX * 0.8 + (VBST - VMAX) * 0.55 * Math.min(1, bot.boost / 0.4);

      var ang = d > 1 ? Math.abs(wrap(Math.atan2(dy, dx) - bot.angle)) : 0;

    /* --- punto de golpeo: llegar por detras del balon respecto al objetivo --- */
    function strike(bot, p, tx, ty) {
      var ax = tx - p.x, ay = ty - p.y, al = hyp(ax, ay) || 1; ax /= al; ay /= al;
      var bx = p.x - bot.x, by = p.y - bot.y, bl = hyp(bx, by);

        ox = p.x - ax * off; oy = p.y - ay * off;

        var s = cr >= 0 ? 1 : -1;

        oy = p.y - ay * back + ax * s * lat;

        var rd = wrap(des - bot.angle - PI);
        throttle = -1; steer = clamp(-rd * 3.2, -1, 1);
        if (o.arrive) {
          if (dist < o.arrive * 0.25) throttle = fwd < -40 ? 1 : 0;
          else if (dist < o.arrive) throttle = -(0.35 + 0.65 * dist / o.arrive);
        }
      } else {
        if (ad > 1.25) throttle = fwd > VMAX * 0.42 ? -0.7 : 0.75;
        else if (ad > 0.6 && fwd > VMAX * 0.75) throttle = 0.15;
        if (o.arrive) {
          var stopD = fwd > 0 ? (fwd * fwd) / (2 * VMAX * 2.4) : 0;
          if (dist < o.arrive * 0.25) throttle = fwd > 40 ? -1 : (fwd < -40 ? 1 : 0);

        m0 = sp.align > 0.2 ? (iA.p.x > W * 0.58 ? 'DISPARO' : 'ATAQUE') : 'RODEO';
        on0 = true;
      }
    } else {
      var sx = clamp(ballF.x + W * 0.26, W * 0.30, W * 0.68), sy = CY + (ballF.y - CY) * 0.35;

    }

      var p1 = iD.p, tgt;

        var ex = p1.x, ey = p1.y - CY, el = hyp(ex, ey) || 1;
        var wing = p1.y >= CY ? 1 : -1;

      } else {
        tgt = attackTarget(p1);
      }
      if (ownThreat && !iD.ok && pred.goalIdx >= 0) {
        var g = path[pred.goalIdx];
        o1 = drive(D, CARR + 6, clamp(g.y, CY - GH, CY + GH), { boost: true, boostAng: 0.5, boostMin: 0 });
        m1 = 'COBERTURA';
      } else {
        var sd = strike(D, p1, tgt.x, tgt.y);
        o1 = drive(D, sd.x, sd.y, { boost: true, boostAng: 0.3, boostMin: ownThreat ? 0 : W * 0.14 });
        m1 = ownThreat ? 'ATAJADA' : 'DESPEJE';
        on1 = true;
      }
    } else {
      var np3 = (D.boost < 0.35 && ballF.x > W * 0.45) ? nearestPad(D, W * 0.5) : null;
      if (np3 && np3.d < W * 0.4) { o1 = drive(D, np3.x, np3.y, {}); m1 = 'TURBO'; }
      else {
        var gx = ballF.x, gy = ballF.y - CY, gl = hyp(gx, gy) || 1;
        var outD = clamp(gl * 0.3, W * 0.065, W * 0.23);
        var hx = clamp((gx / gl) * outD, CARR + 8, W * 0.3);
        var hy = clamp(CY + (gy / gl) * outD, CY - GH * 1.15, CY + GH * 1.15);
        var far = hyp(D.x - hx, D.y - hy) > W * 0.3;
        o1 = drive(D, hx, hy, { arrive: W * 0.11, reverseOk: true, boost: far, boostAng: 0.3, boostMin: W * 0.25 });
        m1 = 'PORTERO';
      }
    }

    function ux(x) { return flip ? W - x : x; }
    function fin(o) {

      side: flip ? 'right' : 'left', path: dpath, ownThreat: ownThreat,
      bots: [
        { mode: m0, tx: ux(o0.tx), ty: o0.ty, ix: ux(iA.p.x), iy: iA.p.y, eta: iA.t, onBall: on0 },

          oppBots: [{ x: 980, y: 400, vx: 0, vy: 0, angle: Math.PI, boost: 50 }, { x: 1190, y: 400, vx: 0, vy: 0, angle: Math.PI, boost: 50 }],

      }

    return {
      scoreLeft: (+st.scoreLeft || 0) | 0,

      ui.clockBar.style.transform = 'scaleX(' + clamp(timeLeft / MATCH_TIME, 0, 1).toFixed(4) + ')';
      var low = timeLeft <= 10;
      if (low !== clockLow) { clockLow = low; ui.clock.className = 'ckv mono' + (low ? ' low' : ''); }
    }
  }
  function modeClass(m) {
    if (m === 'ATAJADA' || m === 'COBERTURA') return 'm-def';
    if (m === 'TURBO') return 'm-tur';
    if (m === 'DISPARO' || m === 'DESPEJE') return 'm-sho';
    return '';
  }
  function updateHud() {
    setT(ui.scoreL, '' + score.left); setT(ui.scoreR, '' + score.right);
    setT(ui.fps, '' + Math.round(fpsEMA));
    setT(ui.matchNo, '' + matchNo);
    setT(ui.status, paused ? 'PAUSA' : (STATUS[phase] || ''));
    setT(ui.winsL, 'VICTORIAS ' + wins.left); setT(ui.winsR, 'VICTORIAS ' + wins.right);
    var bs = hyp(ball.vx, ball.vy);
    if (bs > topBall) topBall = bs;
    setT(ui.bspd, '' + Math.round(bs));
    ui.bspdBar.style.transform = 'scaleX(' + clamp(bs / 1400, 0, 1).toFixed(3) + ')';
    setT(ui.bmax, 'MAX ' + Math.round(topBall));
    for (var k = 0; k < 4; k++) {
      var c = cars[k], u = uiBot[k], d = teamDbg[c.team];
      var bd = (d && d.bots) ? d.bots[c.role] : null;
      setT(u.bp, Math.round(c.boost) + '%');
      u.bb.style.transform = 'scaleX(' + clamp(c.boost / 100, 0, 1).toFixed(3) + ')';
      setT(u.sp, '' + Math.round(hyp(c.vx, c.vy)));
      var mode;
      if (manual && k === 0) mode = 'MANUAL';
      else if (phase === 'goal' || phase === 'replay') mode = 'GOL';
      else if (phase === 'end') mode = 'FINAL';
      else if (phase === 'kickoff') mode = 'SAQUE';
      else mode = (bd && bd.mode) ? String(bd.mode).slice(0, 12) : 'IA EXTERNA';
      if (u.md.__t !== mode) { setT(u.md, mode); u.md.className = 'bmode ' + modeClass(mode); }
      var e = bd ? +bd.eta : NaN;
      setT(u.et, (e === e && phase === 'play') ? e.toFixed(2) + ' s' : '--');
    }
    var tot = stats.left.poss + stats.right.poss;
    var sides = ['left', 'right'];
    for (var s = 0; s < 2; s++) {
      var side = sides[s], st = stats[side], ut = uiTeam[side];
      setT(ut.sh, '' + st.shots); setT(ut.sv, '' + st.saves); setT(ut.tc, '' + st.touches); setT(ut.pd, '' + st.pads);
      setT(ut.po, tot > 0.05 ? Math.round(st.poss / tot * 100) + '%' : '--');
      setT(ut.mx, '' + Math.round(st.maxShot));
      var dd = teamDbg[side], path = (dd && dd.path) ? dd.path : arenaPath, nb = 0;
      for (var i = 1; i < path.length && i < 100; i++) if (path[i].bounce) nb++;
      var risk = arenaGoal === (side === 'left' ? -1 : 1);
      setT(ut.ia, 'REBOTES ' + nb + ' // RIESGO ' + (risk ? 'SI' : 'NO'));
      ut.ia.style.color = risk ? '#F43F5E' : '#E2E8F0';
    }
  }
  function syncState() {
    ST.scoreLeft = score.left; ST.scoreRight = score.right;
    ST.ballSpeed = hyp(ball.vx, ball.vy);
    ST.timeLeft = timeLeft; ST.phase = paused ? 'paused' : phase; ST.fps = fpsEMA; ST.match = matchNo;
  }

  /* ---------------- Controles ---------------- */
  function syncButtons() {
    $('bPause').className = 'btn' + (paused ? ' warn' : '');
    $('sPause').textContent = paused ? 'DETENIDO' : 'EN JUEGO';
    $('icPause').setAttribute('d', paused ? 'M7 4l13 8-13 8z' : 'M7 5h4v14H7zM13 5h4v14h-4z');
    $('sSpeed').textContent = SPEEDS[speedIdx] + 'x';
    $('bSpeed').className = 'btn' + (speedIdx !== 1 ? ' warn' : '');
    $('bPred').className = 'btn' + (showPred ? ' on' : ''); $('sPred').textContent = showPred ? 'ON' : 'OFF';
    $('bReplay').className = 'btn' + (replayOn ? ' on' : ''); $('sReplay').textContent = replayOn ? 'ON' : 'OFF';
    $('bSound').className = 'btn' + (soundOn ? ' on' : ''); $('sSound').textContent = soundOn ? 'ON' : 'OFF';
    $('bManual').className = 'btn' + (manual ? ' on' : ''); $('sManual').textContent = manual ? 'WASD+ESPACIO' : 'OFF';
  }
  function togglePause() { paused = !paused; syncButtons(); }
  function togglePred() { showPred = !showPred; syncButtons(); }
  function restart() { paused = false; newMatch(false); syncButtons(); }
  function kickBall(dx, dy, power) {
    if (phase !== 'play') return;
    var d = hyp(dx, dy) || 1;
    ball.vx += dx / d * power; ball.vy += dy / d * power;
    ring(ball.x, ball.y, ball.r, 320, 0.4, '255,255,255', 3);
    burst(ball.x, ball.y, 14, 5, 280);
    lastTouch = null; touchTeam = null;
    sfxHit(600);
  }
  function bind(id, fn) {
    $(id).addEventListener('click', function () { fn(); this.blur(); });
  }
  bind('bPause', togglePause);
  bind('bReset', restart);
  bind('bSpeed', function () { speedIdx = (speedIdx + 1) % SPEEDS.length; syncButtons(); });
  bind('bPred', togglePred);
  bind('bReplay', function () { replayOn = !replayOn; syncButtons(); });
  bind('bSound', function () { soundOn = !soundOn; if (soundOn) { initAudio(); sfxPad(); } syncButtons(); });
  bind('bManual', function () {
    manual = !manual; syncButtons();
    logEvent(manual ? 'CONTROL MANUAL C1: WASD / FLECHAS + ESPACIO (TURBO)' : 'C1 VUELVE A CONTROL DE IA', 'l');
  });
  bind('bKick', function () { var a = Math.random() * TAU; kickBall(Math.cos(a), Math.sin(a), 900); });

  cv.addEventListener('pointerdown', function (e) {
    var r = cv.getBoundingClientRect();
    if (!r.width || !r.height) return;
    var px = (e.clientX - r.left) / r.width * CW, py = (e.clientY - r.top) / r.height * CH;
    var wx = (px - OX) / SC, wy = (py - OY) / SC;
    kickBall(wx - ball.x, wy - ball.y, 820);
  });
  window.addEventListener('keydown', function (e) {
    keys[e.code] = true;
    if (manual && (e.code === 'Space' || e.code.indexOf('Arrow') === 0)) e.preventDefault();
    if (e.repeat) return;
    if (e.code === 'KeyP') togglePause();
    else if (e.code === 'KeyR') restart();
    else if (e.code === 'KeyT') togglePred();
  });
  window.addEventListener('keyup', function (e) { keys[e.code] = false; });
  window.addEventListener('blur', function () { keys = {}; });

  function fit() {
    var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    if (!(s > 0)) s = 1;
    var tx = (window.innerWidth - 1920 * s) / 2, ty = (window.innerHeight - 1080 * s) / 2;
    $('stage').style.transform = 'translate(' + tx.toFixed(2) + 'px,' + ty.toFixed(2) + 'px) scale(' + s.toFixed(5) + ')';
  }
  window.addEventListener('resize', fit);

  /* ---------------- Bucle principal ---------------- */
  function frame(now) {
    requestAnimationFrame(frame);
    var rdt = (now - lastT) / 1000; lastT = now;
    if (!(rdt > 0)) rdt = 0;
    if (rdt > 0.1) rdt = 0.1;
    if (rdt > 0.001) fpsEMA += (1 / rdt - fpsEMA) * 0.06;
    frameNo++;
    try {
      if (!paused) advance(rdt);
      render(rdt, now / 1000);
      updateClock();
      if (frameNo % 6 === 0) updateHud();
      syncState();
    } catch (err) {
      if (!errShown) { errShown = true; if (window.console && console.error) console.error(err); }
    }
  }

  /* ---------------- Arranque automatico ---------------- */
  window.__soccerArena = { getWorldState: buildWS, restart: restart };
  window.__ARENA_SUMMARY__ = function() {
    var totPoss = (stats.left.poss + stats.right.poss) || 1;
    var winName = score.left > score.right ? 'GEMINI 4 CARBON' : (score.right > score.left ? 'CLAUDE FABLE 5.2' : 'EMPATE');
    return {
      challenge: '05-futbol-robot-2v2',
      hostSimulatorWinnerFaseA: 'CLAUDE FABLE 5.2',
      seed: 20261105,
      phase: phase,
      elapsedSimSec: Math.round(elapsedSim * 100) / 100,
      overtimeUsed: overtimeOn,
      winnerFaseB: winName,
      score: { carbon: score.left, fable: score.right },
      carbonStats: {
        goals: score.left,
        shots: stats.left.shots,
        saves: stats.left.saves,
        touches: stats.left.touches,
        possessionPct: Math.round((stats.left.poss / totPoss) * 1000) / 10,
        boostPads: stats.left.pads,
        maxShotSpeed: Math.round(stats.left.maxShot)
      },
      fableStats: {
        goals: score.right,
        shots: stats.right.shots,
        saves: stats.right.saves,
        touches: stats.right.touches,
        possessionPct: Math.round((stats.right.poss / totPoss) * 1000) / 10,
        boostPads: stats.right.pads,
        maxShotSpeed: Math.round(stats.right.maxShot)
      },
      totalLoggedActions: window.__ARENA_LOG__.length,
      fullLogs: window.__ARENA_LOG__
    };
  };
  fit();
  buildBg();
  syncButtons();
  newMatch(false);
  updateHud(); updateClock(); syncState();
  lastT = performance.now();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
